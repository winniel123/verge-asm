name: commentlint

on:
  pull_request:
    # `verify` is gated on the `sweep:comments` label, which can land after
    # GitHub builds the opened run's payload (#1273).
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: commentlint-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.8"

jobs:
  lint:
    runs-on: ubuntu-latest
    # A violation fails this job, but `main`'s ruleset does not yet require the
    # check, so it blocks no merge (#1435, #1263).
    steps:
      - name: Check out the head commit with the history the merge base needs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # `.jsx` lexes through the node esbuild that docs-site installs, so the
      # job needs both. --omit=dev skips playwright, which no lexer reads.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install the esbuild the .jsx surface needs
        working-directory: docs-site
        run: npm ci --omit=dev

      - name: Lint the changed in-scope files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          readarray -t changed < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA")
          echo "changed files in the diff: ${#changed[@]}"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "no changed file to lint"
            exit 0
          fi
          go run ./cmd/commentlint lint --github --in-scope-only "${changed[@]}"

  verify:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'sweep:comments')
    steps:
      - name: Check out the head commit with the history the merge base needs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # `.jsx` lexes through the node esbuild that docs-site installs, so the
      # job needs both. --omit=dev skips playwright, which no lexer reads.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install the esbuild the .jsx surface needs
        working-directory: docs-site
        run: npm ci --omit=dev

      - name: Prove the sweep moved no non-comment byte
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "merge base: $merge_base"
          readarray -t changed < <(git diff --name-only --diff-filter=ACMRT "$merge_base...$HEAD_SHA")
          echo "changed files in the diff: ${#changed[@]}"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "no changed file to verify"
            exit 0
          fi
          go run ./cmd/commentlint verify --base "$merge_base" "${changed[@]}"
