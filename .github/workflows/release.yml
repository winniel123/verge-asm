name: Release

# The tag-to-release pipeline (docs/spec/release-pipeline.md). A pushed `vX.Y.Z`
# tag guards, builds the two multi-arch images, gates them on Trivy, tags them,
# signs and attests them, and creates the GitHub Release last.
#
# `contents: write` and `id-token: write` NEVER coexist in one job. `publish`
# holds `id-token: write` for keyless cosign; `release` holds `contents: write`
# to create the Release. That split is why there are five jobs and not two, and
# its whole cost is one artifact hop.
#
# There is no `pull_request` trigger here, so the house rule that `id-token:
# write` never reaches a pull-request run is honoured by absence. No machine
# check enforces either rule — a grep false-positives on docs-site.yml, and a
# true check must model job-level reachability over the trigger graph. The rule
# lives in this header and in CONTRIBUTING.md instead (§4.2).

on:
  # Nothing else. `release: [published]` is impossible, because this workflow
  # creates the Release last. `workflow_dispatch` is refused, because it buys
  # only a re-run and a spent tag makes a re-run never correct (§4.1).
  #
  # The filter stays a glob and is not tightened: `*` matches any character but
  # `/`, so the third `*` swallows `0-rc1`. Guard 1's regex below is the only
  # exact statement of the tag format (§1.3).
  push:
    tags: ["v*.*.*"]

# A global singleton. A cancellation between the digest push and the sign step
# would leave unsigned digests in GHCR with no cleanup path, and a per-ref group
# would give two tags pushed together two groups that then race on the floating
# `latest` tag. The precedent is docs-site.yml's `docs-site-pages` group (§4.1).
concurrency:
  group: release
  cancel-in-progress: false

# Least-privilege default. Every job below declares its own §4.2 row, and
# `security-events: write` sits at job level and never here.
permissions:
  contents: read

env:
  # The nested three-segment form. Two GHCR packages, one per binary (§2.1).
  IMAGE_BASE: ghcr.io/winniel123/verge-asm
  # Two pins, not one. The action SHA below pins the wrapper; this pins the
  # scanner binary the wrapper downloads, and the scanner is the pin that
  # matters. release-scan.yml carries the same pair (§5.4).
  TRIVY_RELEASE: "v0.74.0"

jobs:
  guard:
    name: Guards
    runs-on: ubuntu-latest
    # Without this a fork that pushes a `v*` tag runs the pipeline under the
    # fork's own Fulcio identity, and `cosign sign-blob` over a locally built
    # SHA256SUMS mints a genuine Sigstore bundle bound to a stranger. The five
    # jobs chain through `needs:`, so a skipped `guard` skips all five (§4.1).
    if: github.repository == 'winniel123/verge-asm'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      previous-tag: ${{ steps.tag.outputs.previous }}
      migrations-present: ${{ steps.migrations.outputs.present }}
      migration-diff: ${{ steps.migrations.outputs.files }}
    steps:
      # fetch-depth 0: guard 1 sorts every existing tag, guard 2 reads
      # `git log -- CHANGELOG.md`, guard 3 needs `origin/main`, and guard 4 runs
      # git-cliff over the tag range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard 1 — the tag format, the sort order and the major
        id: tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "guard 1: ${tag} is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          previous=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -Fxv "$tag" \
            | sort -V \
            | tail -n1 || true)
          if [ -n "$previous" ]; then
            highest=$(printf '%s\n%s\n' "$previous" "$tag" | sort -V | tail -n1)
            if [ "$highest" != "$tag" ]; then
              echo "guard 1: ${tag} does not sort above the existing tag ${previous}" >&2
              exit 1
            fi
          fi

          version="${tag#v}"
          major="${version%%.*}"
          # The project is alpha on 0.y.z for as long as the notice stands (§1.3).
          if grep -Fq '**Alpha software.**' README.md && [ "$major" != "0" ]; then
            echo "guard 1: the README alpha notice stands, so the major must be 0" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Guard 2 — the tag agrees with CHANGELOG.md
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # One check closing three failure modes: a version mismatch, a tag on a
          # commit older than the prep merge, and a merge in the gap (§4.3).
          last=$(git log -1 --format=%H -- CHANGELOG.md)
          if [ "$last" != "$GITHUB_SHA" ]; then
            echo "guard 2: ${tag} is at ${GITHUB_SHA}, but CHANGELOG.md was last written at ${last}" >&2
            exit 1
          fi

          # cliff.toml's `header` carries no `##` line, so the first `## ` line in
          # the file is the newest section heading, and it keeps the `v`.
          heading=$(grep -m1 '^## ' CHANGELOG.md || true)
          newest=$(printf '%s\n' "$heading" | sed -n 's/^## \[\([^]]*\)\].*/\1/p')
          if [ "$newest" != "$tag" ]; then
            echo "guard 2: CHANGELOG.md's newest section is [${newest:-none}], not [${tag}]" >&2
            exit 1
          fi

      - name: Guard 3 — the tagged commit is an ancestor of `main`
        run: |
          set -euo pipefail
          # A tag may be pushed from any branch today, so this cannot live in
          # repository settings. Guard 2 implies it, and both are stated because
          # they refuse for different reasons (§4.3).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "guard 3: ${GITHUB_SHA} is not an ancestor of origin/main" >&2
            exit 1
          fi

      # Pinned by version and by the archive's SHA-256, because a release pins
      # every byte it builds (ADR-0138).
      - name: Install git-cliff
        run: |
          set -euo pipefail
          scripts/install-git-cliff.sh >> "$GITHUB_PATH"

      - name: Guard 4 — the tag range produces a Release body
        run: |
          set -euo pipefail
          git-cliff --version
          # `--strip all` is required for this guard to mean anything: without it
          # cliff.toml's `header` is prepended and the output is never empty. It is
          # also the exact invocation `release` builds the body with (§10.1).
          if ! body=$(git cliff --latest --strip all 2>"$RUNNER_TEMP/cliff.err"); then
            cat "$RUNNER_TEMP/cliff.err" >&2
            echo "guard 4: git cliff refused the range for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "guard 4: the range for ${GITHUB_REF_NAME} holds no changelog commit" >&2
            exit 1
          fi

      # Not a fifth guard. It always succeeds, and `release` renders it as the
      # §10.2 banner in both polarities (§4.3).
      - name: The migration diff
        id: migrations
        env:
          PREVIOUS: ${{ steps.tag.outputs.previous }}
        run: |
          # `set +e` explicitly, because this step must always succeed and a step
          # runs as `bash -e {0}` (#1532). The `|| true` guards below are belt to
          # this brace; neither alone states the contract.
          set +e -u
          if [ -n "$PREVIOUS" ]; then
            files=$(git diff --name-only "$PREVIOUS" "$GITHUB_REF_NAME" -- db/migrations/ || true)
          else
            # v0.1.0 has no predecessor, so every migration reads as new. That is
            # honest: a first install creates the schema and has no rollback target.
            files=$(git ls-tree -r --name-only "$GITHUB_REF_NAME" -- db/migrations/ || true)
          fi

          present=false
          if [ -n "$files" ]; then
            present=true
          fi

          {
            echo "present=${present}"
            echo "files<<VERGE_MIGRATION_DIFF"
            printf '%s\n' "$files"
            echo "VERGE_MIGRATION_DIFF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Migrations"
            echo
            echo "migrations-present=${present}"
            echo
            printf '%s\n' "$files" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

          # The step's status is its last command's. Stated, not inherited.
          exit 0

      # Release mode, so a fetch failure is fatal here rather than the warning it
      # is in ci.yml (§4.3, §12).
      - name: The Go toolchain pin check
        run: scripts/check-go-pins.sh --mode release

  build:
    name: Build and push by digest
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web-index-digest: ${{ steps.digests.outputs.web-index }}
      worker-index-digest: ${{ steps.digests.outputs.worker-index }}
      web-amd64-digest: ${{ steps.digests.outputs.web-amd64 }}
      web-arm64-digest: ${{ steps.digests.outputs.web-arm64 }}
      worker-amd64-digest: ${{ steps.digests.outputs.worker-amd64 }}
      worker-arm64-digest: ${{ steps.digests.outputs.worker-arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docker driver cannot build two platforms in one call, so the container
      # driver is required here rather than preferred.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `created` has no expression form, and the two `github` values are stable
      # for the run, so all three annotation values are resolved in one place.
      - name: Resolve the annotation values
        id: annot
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "revision=${REVISION}"
            echo "version=${VERSION}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Bake both targets and push by digest
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          # Without this the action bakes the remote git context and ignores the
          # checked-out tree.
          source: .
          files: docker-bake.hcl
          targets: |
            web
            worker
          # The `provenance` and `sbom` inputs stay unset. They are the shorthand
          # docker-bake.hcl's `attest` long form replaces, and the shorthand is a
          # silent no-op that still attaches both attestations (§2.3, #1248).
          #
          # Tags are cleared and the release job owns the output. The tags land in
          # `publish`, after the Trivy gate, so a blocked release leaves nothing
          # reachable by name (§2.3, §4.4). `name=` is carried on the output rather
          # than on a tag, because push-by-digest still needs the repository.
          #
          # A release that does not override VERGE_VERSION ships unstamped images
          # that report the operator's `dev` (§2.3, §3).
          #
          # `index,manifest:` writes each annotation at both levels. §6 sends an
          # operator to a platform digest, and an index-only annotation is invisible
          # from there. Repeating `*.annotations` appends rather than replaces,
          # measured on buildx 0.30.1 (§2.3, #1529).
          set: |
            *.tags=
            *.args.VERGE_VERSION=${{ needs.guard.outputs.version }}
            *.annotations=index,manifest:org.opencontainers.image.revision=${{ steps.annot.outputs.revision }}
            *.annotations=index,manifest:org.opencontainers.image.version=${{ steps.annot.outputs.version }}
            *.annotations=index,manifest:org.opencontainers.image.created=${{ steps.annot.outputs.created }}
            web.output=type=image,name=${{ env.IMAGE_BASE }}/web,push-by-digest=true,name-canonical=true,push=true
            worker.output=type=image,name=${{ env.IMAGE_BASE }}/worker,push-by-digest=true,name-canonical=true,push=true

      - name: Resolve the index and platform manifest digests
        id: digests
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -euo pipefail
          for image in web worker; do
            index=$(printf '%s' "$BAKE_METADATA" | jq -er --arg t "$image" '.[$t]["containerimage.digest"]')
            echo "${image}-index=${index}" >> "$GITHUB_OUTPUT"
            echo "- ${IMAGE_BASE}/${image} index is ${index}" >> "$GITHUB_STEP_SUMMARY"

            # The Trivy gate binds the platform manifest digests, not the index:
            # `imagetools create` copies child descriptors by reference, so a
            # platform digest survives the tagging step (§4.4).
            raw=$(docker buildx imagetools inspect "${IMAGE_BASE}/${image}@${index}" --raw)
            for arch in amd64 arm64; do
              digest=$(printf '%s' "$raw" | jq -er --arg arch "$arch" '
                (.manifests // [])
                | map(select(.platform.os == "linux" and .platform.architecture == $arch))
                | .[0].digest
              ')
              echo "${image}-${arch}=${digest}" >> "$GITHUB_OUTPUT"
              echo "- ${IMAGE_BASE}/${image} linux/${arch} is ${digest}" >> "$GITHUB_STEP_SUMMARY"
            done
          done

      # The pushed bytes, not the bake plan. `--print` would prove only that the
      # override parsed. §2.3 says this project owns these three annotations'
      # correctness, and a wrong or missing one is invisible everywhere else.
      - name: Assert the three OCI annotations landed
        env:
          REVISION: ${{ steps.annot.outputs.revision }}
          VERSION: ${{ steps.annot.outputs.version }}
          CREATED: ${{ steps.annot.outputs.created }}
          WEB_INDEX: ${{ steps.digests.outputs.web-index }}
          WORKER_INDEX: ${{ steps.digests.outputs.worker-index }}
        run: |
          set -euo pipefail
          status=0
          check() {
            ref="$1"
            raw=$(docker buildx imagetools inspect "$ref" --raw)
            for pair in "revision=${REVISION}" "version=${VERSION}" "created=${CREATED}"; do
              key="org.opencontainers.image.${pair%%=*}"
              want="${pair#*=}"
              got=$(printf '%s' "$raw" | jq -r --arg k "$key" '.annotations[$k] // ""')
              if [ "$got" != "$want" ]; then
                echo "::error::${ref} has ${key}='${got}', want '${want}'"
                status=1
              fi
            done
          }
          for pair in "web:${WEB_INDEX}" "worker:${WORKER_INDEX}"; do
            image="${IMAGE_BASE}/${pair%%:*}"
            index="${pair#*:}"
            # The index, then each child. `index,manifest:` writes both levels, and
            # an operator sent to a platform digest by §6 reads only the child.
            check "${image}@${index}"
            children=$(docker buildx imagetools inspect "${image}@${index}" --raw \
              | jq -r '(.manifests // []) | map(select(.platform.os == "linux")) | .[].digest')
            for child in $children; do
              check "${image}@${child}"
            done
          done
          exit "$status"

      # The runtime image carries no shell and the binary carries no version flag,
      # so the boot check's "ignored: this build is stamped" line is the only
      # surface that reports the stamp. Nothing else proves it landed (§3).
      - name: Assert the built images report the tag
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          WEB_REF: ${{ env.IMAGE_BASE }}/web@${{ steps.digests.outputs.web-amd64 }}
          WORKER_REF: ${{ env.IMAGE_BASE }}/worker@${{ steps.digests.outputs.worker-amd64 }}
        run: |
          # `set +e` explicitly. Both containers are MEANT to exit non-zero, and a
          # step runs as `bash -e {0}`, so a bare `set -uo pipefail` leaves errexit
          # on and the first container kills the step before it parses or reports.
          # That spent v0.1.0 on a green build (#1532).
          set +e -u
          # Neither empty nor `dev`: the boot check ignores both (§3).
          sentinel="assert-the-build-stamp"
          status=0
          for pair in "web:${WEB_REF}" "worker:${WORKER_REF}"; do
            name="${pair%%:*}"
            ref="${pair#*:}"
            # Both binaries print the stamp line, then fail on the unreachable
            # database and exit 1. The exit code is captured, never asserted on.
            out=$(timeout 300 docker run --rm \
              --env "VERGE_VERSION=${sentinel}" \
              --env "DATABASE_URL=postgres://verge:verge@127.0.0.1:1/verge" \
              "$ref" 2>&1)
            rc=$?
            reported=$(printf '%s\n' "$out" \
              | sed -n 's/.*ignored: this build is stamped \(.*\)$/\1/p' \
              | head -n1)
            if [ "$reported" != "$VERSION" ]; then
              echo "::error::${name} reports '${reported:-<unstamped>}', not '${VERSION}' (container exit ${rc})"
              printf '%s\n' "$out" >&2
              status=1
            else
              echo "${name} reports ${reported} (container exit ${rc}, non-zero is expected)"
            fi
          done
          exit "$status"

  # This job sits between the digest push and the tag, so a blocked release
  # leaves nothing public (§4.4).
  #
  # One leg per image per architecture. Trivy never scans a manifest list as a
  # unit, and a multi-arch tarball fails with `tarball must contain only a
  # single image`, so each leg targets one platform manifest by digest. Two runs
  # per leg makes the eight §5.3 invocations.
  scan:
    name: Scan ${{ matrix.image }} linux/${{ matrix.arch }}
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      # A cancelled sibling would lose that platform's SARIF and its two SBOM
      # documents, and the silence would read as a clean platform (§5.3, §6.1).
      fail-fast: false
      matrix:
        # `imagetools create` copies child descriptors by reference, so these
        # platform digests survive the later tagging step whatever happens to
        # the index. The gate binds them and never the index (§4.4, §5.3).
        include:
          - image: web
            arch: amd64
            digest: ${{ needs.build.outputs.web-amd64-digest }}
          - image: web
            arch: arm64
            digest: ${{ needs.build.outputs.web-arm64-digest }}
          - image: worker
            arch: amd64
            digest: ${{ needs.build.outputs.worker-amd64-digest }}
          - image: worker
            arch: arm64
            digest: ${{ needs.build.outputs.worker-arm64-digest }}
    env:
      # The §6.1 asset stem. Every file this leg writes is named from it.
      NAME: ${{ matrix.image }}-linux-${{ matrix.arch }}
      # The eight invocations read the database the fetch step below already
      # proved reachable, so no scan can quietly fall back to an empty one
      # (§5.5). The path is trivy-action's own `cache-dir` default.
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
      TRIVY_SKIP_DB_UPDATE: "true"
    steps:
      # upload-sarif reads the checked-out repository to bind its results to a
      # commit, and the stdlib assert reads `.go-version` from the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy reads ~/.docker/config.json, so this scopes the token to ghcr.io.
      # TRIVY_PASSWORD is global and would send it to the database registries.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No waiver exists today, so the file need not exist. trivy-action exits 1
      # on an ignorefile it cannot find, so the path is passed only when the file
      # is present. An entry carries an `expired_at` date and a stated reason,
      # and it lands through a normal pull request with green CI (§5.6).
      - name: Look for the waiver file
        id: waiver
        run: |
          set -euo pipefail
          file=""
          if [ -f .trivyignore.yaml ]; then
            file=".trivyignore.yaml"
            {
              echo "### Waivers"
              echo
              echo "\`.trivyignore.yaml\` is present and the gate honours it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      # trivy-action installs this same version through this same action, so the
      # two runs below restore the binary this step cached. It exists so the
      # database fetch can be retried before any scan reads it (§5.5).
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: ${{ env.TRIVY_RELEASE }}
          cache: true

      - name: Fetch the vulnerability database
        env:
          # Defeats the job-level skip for this one step.
          TRIVY_SKIP_DB_UPDATE: "false"
        run: |
          # Errexit is on regardless, because a step runs as `bash -e {0}` (#1532).
          # Stated rather than left implied. Every fallible command below sits in an
          # `if` condition, which errexit exempts, so the retry ladder still runs.
          set -euo pipefail
          # A gate that opens when its data source is unreachable is not a gate.
          # Failing costs one re-run, and the tag survives a failed run (§5.5).
          ok=""
          for attempt in 1 2; do
            if trivy image --download-db-only --no-progress; then
              ok=yes
              break
            fi
            sleep $((attempt * 15))
          done
          if [ -z "$ok" ]; then
            # The AWS ECR copy. Trivy's own default pair is mirror.gcr.io then
            # ghcr.io, and both have already refused twice above.
            if trivy image --download-db-only --no-progress \
              --db-repository public.ecr.aws/aquasecurity/trivy-db; then
              ok=yes
            fi
          fi
          if [ -z "$ok" ]; then
            echo "::error::the Trivy vulnerability database is unreachable" >&2
            exit 1
          fi

      # The report half: every package type, every severity, and it never fails.
      # It feeds code scanning, the Release asset and the §6 SBOM documents.
      # It runs before the gate so a blocked release still publishes its
      # evidence (§5.2, §5.3).
      - name: Report — every finding
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.image }}@${{ matrix.digest }}
          scanners: vuln
          format: json
          output: ${{ env.NAME }}.trivy.json
          # The SBOM conversions below read the package list, not the findings.
          list-all-pkgs: "true"
          exit-code: "0"
          version: ${{ env.TRIVY_RELEASE }}

      # Trivy writes one `--format` per call, so the three derived documents come
      # from `trivy convert` over the report above. They add no scan and no tool:
      # one tool read one image once, so the SBOM and the vulnerability report
      # describe the same package set (§6.2).
      - name: Write the SARIF and the two SBOM documents
        run: |
          set -euo pipefail
          trivy convert --format sarif --output "${NAME}.trivy.sarif" "${NAME}.trivy.json"
          trivy convert --format spdx-json --output "${NAME}.spdx.json" "${NAME}.trivy.json"
          trivy convert --format cyclonedx --output "${NAME}.cdx.json" "${NAME}.trivy.json"

      # Uploads collide in code scanning without a distinct category, and each
      # would overwrite the last (§5.3).
      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: ${{ env.NAME }}.trivy.sarif
          category: trivy-${{ matrix.image }}-${{ matrix.arch }}

      # An arm64 operator who receives an amd64 SBOM holds a wrong SBOM, not a
      # partial one, so each platform ships its own pair (§6.1).
      - name: Hand the SBOM documents to the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.NAME }}
          path: |
            ${{ env.NAME }}.spdx.json
            ${{ env.NAME }}.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Hand the scan output to the later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ env.NAME }}
          path: |
            ${{ env.NAME }}.trivy.json
            ${{ env.NAME }}.trivy.sarif
          if-no-files-found: error
          retention-days: 7

      # The fourth toolchain assert, and it is not redundant with the three pin
      # compares. `GOTOOLCHAIN` defaults to `auto` and go.mod is a floor, so a
      # builder image may fetch a newer toolchain than it ships. The annotation
      # proves the builder; this proves the product (§12.2 ruling 7).
      - name: Assert the shipped Go stdlib matches `.go-version`
        run: |
          set -euo pipefail
          # Both sides are normalised to the bare number. Trivy reports the stdlib
          # as a Go module version, so it carries the `v` that §1.2 drops
          # everywhere else: measured `v1.26.8` against `.go-version`'s `1.26.8`,
          # which spent v0.1.1 on a correct toolchain (#1534).
          want=$(tr -d '[:space:]' < .go-version)
          want="${want#v}"
          shipped=$(jq -r '
            [ .Results[]? | .Packages[]? | select(.Name == "stdlib") | .Version ]
            | unique | .[]
          ' "${NAME}.trivy.json")

          # An empty read is a failure. A report that names no stdlib proves
          # nothing about the binary this release ships.
          if [ -z "$shipped" ]; then
            echo "assert: ${NAME} reports no Go stdlib package" >&2
            exit 1
          fi

          status=0
          while IFS= read -r version; do
            if [ "${version#v}" != "$want" ]; then
              echo "::error::${NAME} ships Go stdlib ${version}, but .go-version pins ${want}"
              status=1
            else
              echo "${NAME} ships Go stdlib ${version}, matching .go-version ${want}"
            fi
          done <<< "$shipped"
          exit "$status"

      # The gate half. OS packages only: Trivy's Go findings come from govulndb,
      # the database `govulncheck` already blocks every pull request on, so a Go
      # gate could only fail a release on an advisory the house standard already
      # judged and cleared. The OS half is the only watch on the distroless base,
      # and `govulncheck` has no view of dpkg (§5.1).
      - name: Gate — OS findings at HIGH or CRITICAL that have a fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.image }}@${{ matrix.digest }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          # A fixed OS advisory has exactly one repair and an unfixed one offers
          # none. The unfixed ones stay visible in the report above (§5.2).
          ignore-unfixed: "true"
          exit-code: "1"
          format: table
          # Read here and not by the report run, so a waiver silences the gate
          # and never the evidence (§5.6).
          trivyignores: ${{ steps.waiver.outputs.file }}
          version: ${{ env.TRIVY_RELEASE }}

  # The tags land here, after the Trivy gate, so a blocked release leaves nothing
  # public. `build` cleared the bake tags for this reason (§2.3, §4.4).
  #
  # Every sign and attest step below is defined in this file on purpose. Fulcio
  # writes `job_workflow_ref` as the certificate subject, and a reusable workflow
  # moves the identity an operator pins (§7.5).
  #
  # This job holds `id-token: write`, so it must NEVER gain `contents: write`.
  publish:
    name: Tag, sign and attest
    needs: [guard, build, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # This checkout runs first on purpose. The default clean would delete the
      # untracked `sbom/` tree the download below writes (#1256).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `imagetools create`, `cosign sign` and `actions/attest` all read
      # ~/.docker/config.json for the registry write.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `scan` is a four-leg matrix, and a matrix job's outputs are
      # last-writer-wins, so the four SPDX documents arrive as artifacts (§6.1).
      - name: Fetch the SBOM documents the scan job wrote
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v8.0.1
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sbom

      # Two tags per image, both on the index digest. The minor alias `vX.Y` is
      # rejected, because pre-1.0 the minor is the breaking unit and `v0.1` dies
      # the day `v0.2.0` ships (§2.2).
      - name: Apply `vX.Y.Z` and `latest` to both index digests
        env:
          VERSION_TAG: ${{ github.ref_name }}
          WEB_INDEX: ${{ needs.build.outputs.web-index-digest }}
          WORKER_INDEX: ${{ needs.build.outputs.worker-index-digest }}
        run: |
          set -euo pipefail
          for pair in "web:${WEB_INDEX}" "worker:${WORKER_INDEX}"; do
            image="${IMAGE_BASE}/${pair%%:*}"
            index="${pair#*:}"
            docker buildx imagetools create \
              --tag "${image}:${VERSION_TAG}" \
              --tag "${image}:latest" \
              "${image}@${index}"
            echo "- ${image} carries ${VERSION_TAG} and latest at ${index}" >> "$GITHUB_STEP_SUMMARY"
          done

      # Every operator command in the guide verifies by tag, but the signatures
      # below bind the bake digest. §20 item 8 leaves `imagetools create` digest
      # preservation unmeasured, so the release refuses rather than assumes.
      - name: Assert both tags resolve to the digest the signatures will bind
        env:
          VERSION_TAG: ${{ github.ref_name }}
          WEB_INDEX: ${{ needs.build.outputs.web-index-digest }}
          WORKER_INDEX: ${{ needs.build.outputs.worker-index-digest }}
        run: |
          set -euo pipefail
          for pair in "web:${WEB_INDEX}" "worker:${WORKER_INDEX}"; do
            image="${IMAGE_BASE}/${pair%%:*}"
            index="${pair#*:}"
            for tag in "${VERSION_TAG}" latest; do
              # `{{json .Manifest}}` and not `{{.Manifest.Digest}}`: the field-access
              # form silently falls back to the default 164-line render on buildx
              # 0.30.1, so the compare below could never match (#1534).
              got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${image}:${tag}" | jq -r .digest)
              if [ "$got" != "$index" ]; then
                echo "::error::${image}:${tag} resolves to ${got}, not the built index ${index}"
                exit 1
              fi
            done
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The builder pins exactly. The guide states the operator's floor as
          # v3.1.3; v3.0.5 is the true floor and stays out of that line (§7.6).
          cosign-release: "v3.1.3"

      # Six signatures out of two calls. `--recursive` signs each index and its
      # two platform children, and §6 already sends operators to platform
      # digests (§7.2).
      #
      # `--registry-referrers-mode legacy` is pinned. GHCR serves no OCI
      # referrers API, measured 2026-09-03, and a referrer signature produces a
      # saved layout `cosign verify --local-image` refuses (§7.7, #1148).
      - name: Sign both indexes and their per-platform children
        env:
          WEB_INDEX: ${{ needs.build.outputs.web-index-digest }}
          WORKER_INDEX: ${{ needs.build.outputs.worker-index-digest }}
        run: |
          set -euo pipefail
          cosign version
          for pair in "web:${WEB_INDEX}" "worker:${WORKER_INDEX}"; do
            cosign sign --yes --recursive \
              --registry-referrers-mode legacy \
              "${IMAGE_BASE}/${pair%%:*}@${pair#*:}"
          done

      # Six attest steps, not fewer: `push-to-registry` needs one fully-qualified
      # image reference with a digest per step, and `subject-checksums` cannot
      # batch them (§8.2).
      #
      # `predicate-type`, `predicate` and `predicate-path` stay unset on all six.
      # `actions/attest` writes SLSA provenance by default, and `sbom-path`
      # forbids a predicate input beside it (§8.1).
      #
      # `push-to-registry: true` writes both copies from one step: the GitHub
      # attestations API and the GHCR copy beside the image (§8.4).
      #
      # The two tools share one keyless anchor and neither is redundant. The
      # attestation carries a predicate, and the cosign signature verifies with
      # no `gh` and no downloaded bundle (§7.3, §8.6).
      - name: Attest — provenance, web index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/web
          subject-digest: ${{ needs.build.outputs.web-index-digest }}
          push-to-registry: true

      - name: Attest — provenance, worker index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/worker
          subject-digest: ${{ needs.build.outputs.worker-index-digest }}
          push-to-registry: true

      # Each SBOM binds the platform manifest digest and never the index. An SBOM
      # describes one platform, and binding four documents to one index digest
      # states a falsehood about three of them (§6.3).
      - name: Attest — SBOM, web linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/web
          subject-digest: ${{ needs.build.outputs.web-amd64-digest }}
          sbom-path: sbom/web-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest — SBOM, web linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/web
          subject-digest: ${{ needs.build.outputs.web-arm64-digest }}
          sbom-path: sbom/web-linux-arm64.spdx.json
          push-to-registry: true

      - name: Attest — SBOM, worker linux/amd64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/worker
          subject-digest: ${{ needs.build.outputs.worker-amd64-digest }}
          sbom-path: sbom/worker-linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest — SBOM, worker linux/arm64
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_BASE }}/worker
          subject-digest: ${{ needs.build.outputs.worker-arm64-digest }}
          sbom-path: sbom/worker-linux-arm64.spdx.json
          push-to-registry: true

      # §9.1 item 1. The asset is the repository file with this release's index
      # digests substituted, so the operator's file and the contributor's file
      # cannot drift apart (§2.4).
      #
      # The digests must already exist here, and they do: they arrive from
      # `build` (§9.1 ordering constraint, §4.4 step 11).
      - name: Generate the digest-pinned compose asset
        env:
          WEB_INDEX: ${{ needs.build.outputs.web-index-digest }}
          WORKER_INDEX: ${{ needs.build.outputs.worker-index-digest }}
        run: |
          set -euo pipefail
          mkdir -p assets

          sed \
            -e "s#^\( *image: \)${IMAGE_BASE}/web:latest\$#\1${IMAGE_BASE}/web@${WEB_INDEX}#" \
            -e "s#^\( *image: \)${IMAGE_BASE}/worker:latest\$#\1${IMAGE_BASE}/worker@${WORKER_INDEX}#" \
            docker-compose.yml > assets/docker-compose.yml

          # A sed that matches nothing exits 0, so an unpinned asset would ship
          # in silence. Both `image:` keys are literal today (§2.4).
          pinned=$(grep -c "^ *image: ${IMAGE_BASE}/[a-z]*@sha256:" assets/docker-compose.yml || true)
          if [ "$pinned" != "2" ]; then
            echo "::error::the compose asset pins ${pinned} verge images by digest, want 2"
            exit 1
          fi

      # §9.1 items 2 and 3, taken from the tagged tree, so neither can drift by
      # hand. The compose file uses `${POSTGRES_PASSWORD:?}` and `.env.example`
      # is the only file that documents the keys (§9.1).
      #
      # The dot is dropped for the asset only. GitHub rewrites a Release asset
      # whose name begins with `.`, so v0.1.2 shipped `default.env.example`
      # against a SHA256SUMS naming `.env.example`, and `sha256sum -c` failed
      # that line on a correct release (#1536). The repository keeps its
      # `.env.example`.
      - name: Copy the two verbatim loose assets
        run: |
          set -euo pipefail
          cp .env.example assets/env.example
          cp docker-compose.external-db.yml assets/docker-compose.external-db.yml

      # `scan` is a four-leg matrix, so its reports arrive as four artifacts.
      # They ride to `release` inside this job's single artifact (§5.3, §9.1).
      - name: Fetch the Trivy reports the scan job wrote
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v8.0.1
        with:
          pattern: trivy-*
          merge-multiple: true
          path: trivy

      # Eleven files: §9.1 items 1 to 3 and the eight §6.1 SBOM documents.
      #
      # The Trivy scan asset set stays outside the list. §9.1 gives item 4 that
      # exact scope, numbers thirteen assets, and leaves the Trivy row
      # unnumbered with its names and count owned by §5.3 (§20 item 10).
      #
      # `SHA256SUMS.sigstore.json` is absent because it signs this file (§7.4).
      #
      # Bare basenames on purpose. The operator downloads the assets flat into
      # one directory and runs `sha256sum -c SHA256SUMS` there (§9.2).
      - name: Build the checksum list
        run: |
          set -euo pipefail
          cp sbom/*.spdx.json sbom/*.cdx.json assets/
          cd assets
          sha256sum \
            docker-compose.yml \
            env.example \
            docker-compose.external-db.yml \
            web-linux-amd64.spdx.json \
            web-linux-amd64.cdx.json \
            web-linux-arm64.spdx.json \
            web-linux-arm64.cdx.json \
            worker-linux-amd64.spdx.json \
            worker-linux-amd64.cdx.json \
            worker-linux-arm64.spdx.json \
            worker-linux-arm64.cdx.json \
            > SHA256SUMS

          entries=$(wc -l < SHA256SUMS)
          if [ "$entries" != "11" ]; then
            echo "::error::SHA256SUMS holds ${entries} entries, want 11"
            exit 1
          fi
          {
            echo "### SHA256SUMS"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `--bundle` is cosign v3's only output form. `--output-signature` and
      # `--output-certificate` are gone, so the form is the tool's choice and
      # not this project's (§7.4).
      #
      # No `-a key=value` annotation, and no provenance attestation over this
      # file. The keyless certificate already records the repository, the
      # workflow and the tag ref (§9.2).
      - name: Sign the checksum list
        working-directory: assets
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS

      # The Trivy reports join the set after the list is written and signed,
      # because they are not in it.
      - name: Assemble the Release asset set
        run: |
          set -euo pipefail
          cp trivy/* assets/

          # §9.1's thirteen named files, asserted one by one. A missing asset
          # is otherwise invisible until an operator's verify fails.
          for name in \
            docker-compose.yml \
            env.example \
            docker-compose.external-db.yml \
            SHA256SUMS \
            SHA256SUMS.sigstore.json \
            web-linux-amd64.spdx.json \
            web-linux-amd64.cdx.json \
            web-linux-arm64.spdx.json \
            web-linux-arm64.cdx.json \
            worker-linux-amd64.spdx.json \
            worker-linux-amd64.cdx.json \
            worker-linux-arm64.spdx.json \
            worker-linux-arm64.cdx.json
          do
            if [ ! -f "assets/${name}" ]; then
              echo "::error::the Release asset ${name} is missing"
              exit 1
            fi
          done

      # `cosign sign-blob` needs `id-token: write` and `release` holds
      # `contents: write`, so the two never share a job. This hop is that
      # split's whole cost (§4.2, §9).
      #
      # `include-hidden-files` is belt. No asset is a dotfile since #1536 named
      # the env sample `env.example`, but the action drops a dotfile silently
      # and `if-no-files-found: error` only fires on an empty match.
      - name: Hand the Release assets to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The Release is created last, so a failed run leaves no Release at all. No
  # step below builds an asset: every asset arrives as a workflow artifact
  # (§4.4 step 12, §9.1).
  #
  # This job holds `contents: write`, so it must NEVER gain `id-token: write`.
  # `contents: write` here cannot reach `main`, because the `main protection`
  # ruleset has an empty bypass list and so binds GITHUB_TOKEN too (§4.2).
  #
  # Scorecard, and an accepted cap. `releasesAreSigned` matches asset suffixes
  # including `.sigstore.json`, so §9.1 item 5 matches and that check scores 8.
  # `releasesHaveProvenance` matches only an `.intoto.jsonl` Release asset. The
  # provenance lives in the registry beside the image, and loose attestation
  # assets were refused, so that check caps at 8. The cap is a deliberate,
  # cited refusal and not an oversight, so a later session does not "fix" it:
  # reaching 10 costs one `.intoto.jsonl` asset and contradicts §8.4 and §9.3.
  release:
    name: Create the Release
    needs: [guard, build, scan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This checkout runs first on purpose. The default clean would delete the
      # untracked `assets/` tree the download below writes.
      #
      # fetch-depth 0: `git cliff --latest` reads the whole tag range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the Release assets the publish job assembled
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v8.0.1
        with:
          name: release-assets
          path: assets

      # The escape hatch. When the file exists the body is that file verbatim
      # and the generator does not run. v0.1.0 takes this route, because `main`
      # holds 640 first-parent commits and v0.1.0 has no predecessor tag. A
      # withdrawal forces the successor release here too (§10.1, §14.7).
      - name: Look for the release-notes override
        id: override
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file="docs/release-notes/${TAG}.md"
          if [ ! -f "$file" ]; then
            file=""
          fi
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        if: steps.override.outputs.file == ''
        run: |
          set -euo pipefail
          scripts/install-git-cliff.sh >> "$GITHUB_PATH"

      # The banner is prepended above both bodies and appears in both
      # polarities, as two fixed one-line strings. A conditional banner would
      # make absence ambiguous, because an operator could not separate "this
      # release carried no migration" from "this release predates the banner".
      # git-cliff cannot produce the line: it parses commit messages and has no
      # file-path context. The input is the guard job's migration diff (§10.2).
      #
      # `--strip all` is required. Without it cliff.toml's `header` is prepended
      # to every body, and guard 4 runs the same invocation (§10.1).
      #
      # `--generate-notes` is rejected. It groups by pull-request label, and
      # merged pull requests in this repository carry no labels at all (§10.1).
      - name: Build the Release body
        env:
          OVERRIDE: ${{ steps.override.outputs.file }}
          MIGRATIONS_PRESENT: ${{ needs.guard.outputs.migrations-present }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/release-body.md"

          case "$MIGRATIONS_PRESENT" in
            true)
              banner='> **This release carries a database migration.** Roll back by restoring the pre-upgrade dump, and not by pinning the previous image digest. See "Rolling back" in `docs/guides/running.md`.'
              ;;
            false)
              banner='> **This release carries no database migration.** Roll back by pinning the previous image digest. See "Rolling back" in `docs/guides/running.md`.'
              ;;
            *)
              # Silence is the one outcome §10.2 refuses, so an unreadable
              # polarity fails the release rather than dropping the banner.
              echo "::error::the migration diff reports '${MIGRATIONS_PRESENT}', want true or false"
              exit 1
              ;;
          esac

          printf '%s\n\n' "$banner" > "$body"

          if [ -n "$OVERRIDE" ]; then
            cat "$OVERRIDE" >> "$body"
          else
            git cliff --latest --strip all >> "$body"
          fi

          {
            echo "### The Release body"
            echo
            echo '```markdown'
            cat "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Seventeen files: §9.1's thirteen named assets, and the §5.3 Trivy scan
      # asset set.
      #
      # The Trivy set is the four report documents and not the four SARIF
      # documents. §5.3 gives the report run three destinations and names them
      # apart — SARIF, a Release asset, and the SBOM documents — and §5.2
      # repeats that pair. The SARIF's destination is code scanning, which the
      # `scan` job already writes it to under a distinct category.
      #
      # A missing asset is otherwise invisible until an operator's verify fails.
      - name: Assert the asset set arrived whole
        run: |
          set -euo pipefail
          missing=0
          for name in \
            docker-compose.yml \
            env.example \
            docker-compose.external-db.yml \
            SHA256SUMS \
            SHA256SUMS.sigstore.json \
            web-linux-amd64.spdx.json \
            web-linux-amd64.cdx.json \
            web-linux-arm64.spdx.json \
            web-linux-arm64.cdx.json \
            worker-linux-amd64.spdx.json \
            worker-linux-amd64.cdx.json \
            worker-linux-arm64.spdx.json \
            worker-linux-arm64.cdx.json \
            web-linux-amd64.trivy.json \
            web-linux-arm64.trivy.json \
            worker-linux-amd64.trivy.json \
            worker-linux-arm64.trivy.json
          do
            if [ ! -f "assets/${name}" ]; then
              echo "::error::the Release asset ${name} is missing"
              missing=1
            fi
          done
          exit "$missing"

      # `gh release create` is forbidden as the tag mechanism, because it
      # creates the tag and the Release together. `--verify-tag` is what forbids
      # it here: gh aborts when the tag is absent from the remote. The push
      # trigger guarantees the tag exists, so this only ever attaches a Release
      # to the pushed tag (§4.1, §10.1).
      #
      # The assets are named one by one rather than globbed. A glob would sweep
      # in the four SARIF documents the ruling above keeps off the Release.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/release-body.md" \
            assets/docker-compose.yml \
            assets/env.example \
            assets/docker-compose.external-db.yml \
            assets/SHA256SUMS \
            assets/SHA256SUMS.sigstore.json \
            assets/web-linux-amd64.spdx.json \
            assets/web-linux-amd64.cdx.json \
            assets/web-linux-arm64.spdx.json \
            assets/web-linux-arm64.cdx.json \
            assets/worker-linux-amd64.spdx.json \
            assets/worker-linux-amd64.cdx.json \
            assets/worker-linux-arm64.spdx.json \
            assets/worker-linux-arm64.cdx.json \
            assets/web-linux-amd64.trivy.json \
            assets/web-linux-arm64.trivy.json \
            assets/worker-linux-amd64.trivy.json \
            assets/worker-linux-arm64.trivy.json

          {
            echo "### The Release"
            echo
            gh release view "$TAG" --json url --jq .url
          } >> "$GITHUB_STEP_SUMMARY"
