name: Scorecard

# OpenSSF Scorecard — scores this repo against supply-chain security best
# practices (branch protection, pinned dependencies, token permissions, CI
# tests, dangerous-workflow patterns, ...) and publishes the result to the
# public OpenSSF dashboard (https://securityscorecards.dev) and the repo's
# code-scanning tab.
#
# Runs on a schedule and on pushes to main — NOT on pull_request, because
# publishing needs `id-token: write` and that must not be granted to PR runs.

on:
  # On-demand run (e.g. to re-score after changing the main ruleset — note the
  # branch_protection_rule event fires for classic branch protection, not for
  # repository rulesets, which is what this repo uses).
  workflow_dispatch:
  # Re-score whenever a branch-protection rule changes (a scored signal).
  branch_protection_rule:
  schedule:
    - cron: "23 5 * * 1" # weekly, Monday 05:23 UTC
  push:
    branches: [main]

# Least-privilege default; the analysis job scopes up.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the Scorecard SARIF to code scanning
      id-token: write # OIDC token to publish results to OpenSSF
      contents: read
      actions: read # read workflow metadata for the CI-Tests check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the public dashboard so the repo earns a Scorecard badge
          # and API entry. Requires the repo to be public (it is) + id-token.
          publish_results: true
          # The Branch-Protection check needs read access to branch protection /
          # rulesets, which the default GITHUB_TOKEN can't fully provide — it is
          # only *partially* scored without a token that carries repo
          # Administration:read. Set an optional fine-grained PAT in the
          # SCORECARD_TOKEN secret to score it fully; the `|| github.token`
          # fallback keeps the run working (partial scoring) when it is unset,
          # so this needs no follow-up edit once the secret is added.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      # Keep the raw SARIF as a build artifact for debugging a score drop.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # Surface findings in Security > Code scanning. Reuses the same
      # github/codeql-action SHA pinned elsewhere in the repo.
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: results.sarif
