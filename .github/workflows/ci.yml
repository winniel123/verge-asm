name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run for the same ref. A new push to a branch stops the
# in-progress run for that branch, so a force-push does not queue stale jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN (#329). No job here needs write
# access to repo contents; the only exception is the gosec job, which scopes
# `security-events: write` on itself to upload its SARIF (see below).
permissions:
  contents: read

env:
  GO_VERSION: "1.26.8"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...

  # An architecture is in this matrix exactly where the golden corpus (a
  # later ticket) runs on it in CI (ADR-0001, packaging-and-configuration.md
  # §1.2) — amd64 and arm64 only.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: v1
      GOARM64: v8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -o /dev/null ./cmd/web
      - run: go build -o /dev/null ./cmd/worker
      - run: go build -o /dev/null ./cmd/prober

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: "1.31.1"
      - run: sqlc generate
      - run: git diff --exit-code -- internal/db

  # The golden corpus (golden-corpus.md §3): the measure leaves' pinning rows and
  # the `Custody` derivation's (§10), run hermetically (no network, no
  # containers) against every matrix architecture. Legs 1 and 2 are the
  # architectures; leg 3 (GOAMD64=v3) is the contraction differential and ships
  # no artefact. A2 (expectation) and the lock gate run inside `go test`; A5
  # (coverage) names any unpinned cell.
  golden-corpus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goamd64: v1
          - runner: ubuntu-24.04-arm
            goarm64: v8.0
          - runner: ubuntu-24.04
            goamd64: v3
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM64: ${{ matrix.goarm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./internal/measure/... ./internal/custody/...

  # A6, gate direction 2 (golden-corpus.md §3.2): a version bump with no moved
  # corpus digest, no changed declared-parameter digest and no new
  # uncovered-move row fails. Evaluated against the PR base, since "the version
  # moved and nothing else did" is only visible across commits. It runs over
  # every lock named below, and every lock fails on its own name.
  corpus-version-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: refuse an unjustified version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The locks A6 is evaluated against — the three blocks
          # golden-corpus.md specifies, and no others. `resolution-walk` (§2)
          # and `wildcard-discrimination` (§8) are the two membership leaves
          # §3.2's A6 row names; `custody` (§10) is the `Custody` derivation,
          # whose lock pins the fan-out threshold ADR-0129 §3 makes a Break.
          #
          # The other four measure corpora hold locks that §3.2 does not name,
          # so they are deliberately absent. Widening A6 onto them is a decision
          # golden-corpus.md takes first.
          #
          # A6 is evaluated PER LOCK: a bump of one is tested against that one's
          # own block, and the blocks are never pooled. Every failing lock is
          # reported before the step exits, so one run names them all.
          locks="internal/measure/resolutionwalk/corpus/corpus.lock.json
          internal/measure/wildcarddiscrim/corpus/corpus.lock.json
          internal/custody/corpus/corpus.lock.json"
          field() { echo "$1" | jq -r "$2"; }
          refused=0
          for lock in $locks; do
            base=$(git show "$BASE_SHA:$lock" 2>/dev/null || echo '{}')
            # A lock absent at HEAD reads as `{}` rather than aborting the step
            # on `cat`, so a rename or removal still lets the remaining locks be
            # evaluated and reported.
            head=$(cat "$lock" 2>/dev/null || echo '{}')
            bv=$(field "$base" '.leaf_version // ""')
            hv=$(field "$head" '.leaf_version // ""')
            bc=$(field "$base" '.corpus_digest // ""')
            hc=$(field "$head" '.corpus_digest // ""')
            bp=$(field "$base" '.params_digest // ""')
            hp=$(field "$head" '.params_digest // ""')
            bm=$(field "$base" '(.uncovered_moves // []) | length')
            hm=$(field "$head" '(.uncovered_moves // []) | length')
            if [ "$hv" != "$bv" ] && [ "$hc" = "$bc" ] && [ "$hp" = "$bp" ] && [ "$hm" = "$bm" ]; then
              echo "$lock: version moved $bv -> $hv with no moved corpus row, no changed"
              echo "declared parameter and no new uncovered-move row. Refused (ADR-0021)."
              refused=1
            fi
          done
          [ "$refused" = 0 ] || exit 1
          echo "version gate ok"

  compose:
    runs-on: ubuntu-latest
    # Every compose invocation in this job interpolates POSTGRES_PASSWORD —
    # build, up, the `docker compose ps` in the health loop below, and down.
    # It must be set for all of them, so it lives at job level: setting it
    # per-step once left the health loop's `ps` without it, and compose then
    # refuses to parse the file at all ("required variable ... is missing a
    # value"), so the loop never saw the running stack and the job always failed.
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose build
      - name: docker compose up
        run: docker compose up -d
      - name: wait for a healthy stack
        run: |
          for i in $(seq 1 30); do
            bad=$(docker compose ps --all --format json | jq -r \
              'select(.State != "running" or (.Health != "" and .Health != "healthy")) | .Name')
            count=$(docker compose ps --all --format json | jq -rs 'length')
            if [ "$count" = "3" ] && [ -z "$bad" ]; then
              echo "all services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "services never became healthy:"
          docker compose ps --all
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v

  # The live-TLS boot job (packaging-and-configuration.md §9.6, assertion 1): the
  # stack completes a `verify-full` connection against a real TLS server. Every
  # guard docker-compose.external-db.yml ships is a claim about RUNTIME
  # behaviour, and no compose-file review can check one.
  #
  # It runs on every pull request. A path filter is refused: it is the classic
  # way to make a check not run on the change that breaks it, and a
  # `DATABASE_URL` edit in an unlisted file is exactly that change. A nightly
  # schedule is refused for decoupling the signal from its cause.
  #
  # The job is ADVISORY, by ruling rather than by oversight. A required status
  # check is a repository SETTINGS change rather than a file, so no pull request
  # can land one, and making it normative would create an obligation with no way
  # to discharge it. It follows the `compose` job above, which is also advisory.
  # Known cost: an advisory check can go red unnoticed. Promotion stays available
  # as a separate human step. The job gates no merge, so its wall-clock cost
  # blocks nobody.
  #
  # The job makes three runs over one fixture, and each run asserts one thing.
  # Run 1 boots the stack and proves a `verify-full` connection. Run 2 swaps an
  # unrelated CA root in at the mount source and proves the connection then
  # fails. Run 3 points the mount source at a missing path and proves `up`
  # refuses it.
  #
  # The two negatives fail at DIFFERENT LAYERS — run 2 inside the container at
  # connect time, run 3 in the engine before a container exists — so they stay
  # separate runs. Combined, one masks the other.
  #
  # Run 2 is what gives the job teeth. Run 1 alone passes with verification
  # switched off, so an `sslmode=disable` regression would boot happily and this
  # check would stay green.
  #
  # Neither negative passes on a non-zero exit alone. A broken image exits
  # non-zero too, so each negative greps for its own error text.
  #
  # Each negative also asserts PER SERVICE (#1021). The override repeats
  # PGSSLMODE, PGSSLROOTCERT and the CA bind for web and for worker, so one copy
  # can drift on its own. An assertion that reads both services at once passes
  # on either one, and the drifted service stays green.
  compose-external-db-tls:
    runs-on: ubuntu-latest
    env:
      # The shipped override is exercised VERBATIM. The CI overlay may add to
      # the merge set; it may not stand in for the file under test. COMPOSE_FILE
      # carries the set, so every `docker compose` below reads the same three
      # files with no repeated flags. The project directory is the first file's
      # directory, so it is the repository root.
      COMPOSE_FILE: docker-compose.yml:docker-compose.external-db.yml:.github/compose/docker-compose.ci-tls.yml
      # Compose interpolates the base file BEFORE it merges the others, so the
      # base's `${POSTGRES_PASSWORD:?}` fires whatever the override says (§9.4).
      # Like the `compose` job above, this one needs the variable set for every
      # invocation, so it lives at job level. The fixture database reuses the
      # same throwaway value.
      POSTGRES_PASSWORD: ci-only-password
      # The DSN names NO `sslmode`, or the job tests nothing: an explicit DSN
      # parameter beats `PGSSLMODE`, so a DSN carrying one would silently void
      # the dial under test (§9.5). The host is the fixture certificate's SAN,
      # and the password is POSTGRES_PASSWORD above.
      DATABASE_URL: postgres://verge:ci-only-password@verge-db:5432/verge
      # POSTGRES_SSLMODE is deliberately unset. The override defaults it to
      # `verify-full`, and the default is what an operator gets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: generate the CA root and the server certificate it signs
        run: |
          # Invoked through `bash`, because the repository stores its shell
          # scripts without the executable bit.
          bash .github/compose/gen-tls-fixture.sh "$RUNNER_TEMP/tls"
          # Postgres reads the key as its own uid (999 in the pinned image) and
          # refuses a group- or world-readable file. The runner wrote the file,
          # so hand that one file over; the certificates stay world-readable.
          sudo chown 999:999 "$RUNNER_TEMP/tls/server.key"
          # The CA root the override mounts, and the leaf the fixture serves.
          # Both are host paths, so they are bind sources rather than container
          # environment (§9.2).
          echo "VERGE_CI_TLS_DIR=$RUNNER_TEMP/tls" >> "$GITHUB_ENV"
          echo "POSTGRES_SSLROOTCERT_SRC=$RUNNER_TEMP/tls/root.crt" >> "$GITHUB_ENV"
      - run: docker compose build
      - name: docker compose up
        run: docker compose up -d
      - name: wait for a healthy stack
        run: |
          for i in $(seq 1 60); do
            bad=$(docker compose ps --all --format json | jq -r \
              'select(.State != "running" or (.Health != "" and .Health != "healthy")) | .Name')
            count=$(docker compose ps --all --format json | jq -rs 'length')
            if [ "$count" = "3" ] && [ -z "$bad" ]; then
              echo "all services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "services never became healthy:"
          docker compose ps --all
          docker compose logs
          exit 1
      - name: assert a verify-full connection from web and from worker
        run: |
          # Each binary's -healthcheck opens a live database connection under the
          # override's PGSSLMODE and PGSSLROOTCERT, so a failed verification
          # exits non-zero here rather than passing quietly.
          #
          # web's /healthz writes a heartbeat row and answers 503 when that write
          # fails, so a 200 is a completed round trip over the pool. worker's
          # opens a FRESH pgx pool and pings it, so it dials and verifies again
          # at assertion time rather than reporting a connection made at boot.
          docker compose exec -T web /app/web -healthcheck
          docker compose exec -T worker /app/worker -healthcheck
          echo "web and worker both completed a verify-full connection"
      - name: assert the server saw TLS on every client connection
        run: |
          # The step above proves each service reached the database. This one
          # proves the transport: `verify-full` is enforced client-side, so a
          # server-side count of unencrypted client connections is the
          # independent check that the dial was not quietly downgraded.
          #
          # `client_addr IS NOT NULL` drops this very psql, which arrives over
          # the container's unix socket and is never TLS.
          counts=$(docker compose exec -T verge-db psql -U verge -d verge -tAF' ' -c \
            "SELECT count(*) FILTER (WHERE s.ssl),
                    count(*) FILTER (WHERE NOT s.ssl),
                    count(DISTINCT a.client_addr)
               FROM pg_stat_activity a JOIN pg_stat_ssl s USING (pid)
              WHERE a.client_addr IS NOT NULL")
          read -r ssl plain hosts <<<"$counts"
          echo "client connections: $ssl over TLS, $plain in the clear, from $hosts host(s)"
          if [ "$plain" != "0" ] || [ "$hosts" -lt 2 ]; then
            docker compose exec -T verge-db psql -U verge -d verge -c \
              "SELECT a.client_addr, a.application_name, s.ssl, s.version
                 FROM pg_stat_activity a JOIN pg_stat_ssl s USING (pid)
                WHERE a.client_addr IS NOT NULL"
            exit 1
          fi
      - name: tear down run 1
        if: always()
        run: docker compose down -v

      # --- Run 2 (§9.6, assertion 2): an unrelated CA root must fail ---
      #
      # A step that fails is SKIPPED past by the steps after it, so a red run 1
      # stops here rather than reporting a second cause for the same break.
      - name: assert an unrelated CA root fails verification
        run: |
          # A second root, minted by the same fixture script from a fresh key,
          # under a label that reads clearly in the log below. It signs nothing
          # in the stack: verge-db still serves the leaf the FIRST root signed.
          # Only root.crt is read here. The server pair beside it is a
          # by-product of reusing the script rather than forking it.
          bash .github/compose/gen-tls-fixture.sh "$RUNNER_TEMP/wrong-ca" unrelated

          # Overrides the value the setup step wrote to GITHUB_ENV, for this
          # step alone. Nothing else about the run changes, so the mounted root
          # is the single variable under test.
          export POSTGRES_SSLROOTCERT_SRC="$RUNNER_TEMP/wrong-ca/root.crt"
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT

          # `up` SUCCEEDS here. This negative fails inside the container at
          # connect time, so the evidence is in the log rather than in an exit
          # code. web dials first, in migrateUp, and log.Fatalf ends the
          # process; `restart: unless-stopped` then dials again, so the string
          # keeps arriving until the poll below sees it.
          docker compose up -d

          # The Go error pgx wraps when the served leaf chains to a root the
          # client does not hold. Matching the text is the assertion: a run with
          # verification switched off connects instead, prints nothing like it,
          # and falls through to the failure at the bottom.
          #
          # Each service is collected and searched ALONE, and BOTH must report
          # the error (#1021). docker-compose.external-db.yml repeats PGSSLMODE,
          # PGSSLROOTCERT and the CA bind per service on purpose, so one copy
          # can drift on its own. One grep over a combined log passes on web's
          # error while worker verifies nothing.
          want='certificate signed by unknown authority'
          for i in $(seq 1 45); do
            silent=
            for svc in web worker; do
              log="$RUNNER_TEMP/run2-$svc.log"
              # Collected to a file first, rather than piped into `grep -q`.
              # grep closes the pipe on its first match, and `docker compose
              # logs` then dies of SIGPIPE. The workflow sets no
              # `defaults.run.shell`, so these steps run under `bash -e` with no
              # `pipefail`, and the pipeline still reports grep's own status
              # today. The file keeps the search correct if `pipefail` is ever
              # set, and gives each service a snapshot of its own.
              docker compose logs --no-color "$svc" >"$log" 2>&1 || true
              grep -qF "$want" "$log" || silent="$silent $svc"
            done
            if [ -z "$silent" ]; then
              echo "web and worker both refused the unrelated root: $want"
              exit 0
            fi
            sleep 2
          done
          # The step does not know WHY a service stayed silent, so it does not
          # say. A service that verified nothing and a service that died before
          # it reached the dial leave the same empty log, and a message that
          # named only the first would send the next reader hunting a
          # PGSSLROOTCERT drift that is not there. The state and the full logs
          # below separate the two.
          echo "no \"$want\" after 45 polls from:$silent"
          echo "either a silent service verified the root against nothing, or it"
          echo "never reached the dial. Read the state and the logs below."
          docker compose ps --all
          docker compose logs
          exit 1

      # --- Run 3 (§9.6, assertion 3): a missing bind source must fail ---
      - name: assert a missing bind source fails at compose up
        run: |
          missing="$RUNNER_TEMP/no-such-ca-dir/root.crt"
          export POSTGRES_SSLROOTCERT_SRC="$missing"
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT

          # `docker compose config` is no substitute for this run. It exits 0 on
          # a missing bind source (#995), so only `up` reaches the daemon check
          # that `create_host_path: false` arms.
          #
          # Each service is raised ALONE, and BOTH must be refused (#1021). One
          # `up` over the stack stops at whichever container the engine reaches
          # first, so worker's guard could be dropped and the step would still
          # go red on web. One service at a time also names the service in the
          # failure message. verge-db comes up with the first of the two and
          # stays up for the second, because `depends_on` still holds.
          for svc in web worker; do
            log="$RUNNER_TEMP/run3-$svc.log"
            if docker compose up -d "$svc" >"$log" 2>&1; then
              echo "compose up $svc SUCCEEDED on a missing bind source; create_host_path: false is not holding for $svc"
              cat "$log"
              exit 1
            fi
            cat "$log"

            # The non-zero exit above is not the assertion. A broken image exits
            # non-zero too. This is the wording troubleshooting.md quotes for the
            # same failure, so the assertion holds the guard and the doc together.
            if ! grep -qF 'bind source path does not exist' "$log"; then
              echo "compose up $svc failed for some reason other than the missing bind source"
              exit 1
            fi
            echo "compose up refused the missing bind source for $svc"
          done

          # `create_host_path` defaults to TRUE, and a short-syntax bind would
          # have created an empty DIRECTORY here. Nothing may appear.
          if [ -e "$missing" ] || [ -e "$RUNNER_TEMP/no-such-ca-dir" ]; then
            echo "docker created a path at $missing:"
            ls -la "$RUNNER_TEMP/no-such-ca-dir"
            exit 1
          fi
          echo "web and worker both refused the missing bind source, and nothing was created at $missing"

  # --- Supply-chain / SAST / secret scanning (#331) ---

  # Dependency vulnerability scan against the Go vulnerability database.
  # Blocking (#744): a known-vulnerable symbol reachable from our code fails
  # the build. The current tree is clean, so this blocks only newly-introduced
  # or newly-disclosed reachable advisories. If a pre-existing advisory must be
  # tolerated in future, prefer bumping/patching the dep; only as a last resort
  # add an explicit allowlist here (e.g. `govulncheck ... | grep -v <GO-ID>` or
  # a documented per-ID exclusion) so the accepted IDs stay visible and tracked.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck ./...
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  # Static application security testing. Blocking on a severity/confidence
  # threshold (#744): `-no-fail` is dropped and `-severity high -confidence high`
  # is added, so the job fails only on high-severity, high-confidence findings.
  # This is the tightest threshold that leaves the CURRENT tree at zero findings
  # (measured: high/high = 0; loosening confidence to medium = 11 CWE-190;
  # dropping to medium severity = 67, incl. ~56 CWE-400) — so pre-existing
  # lower-severity findings do not break the build while new high/high findings
  # do. All findings are still surfaced as SARIF in the repository's
  # code-scanning (Security) tab where code scanning is available. The upload is
  # best-effort (`continue-on-error`): on a repo without GitHub code scanning /
  # Advanced Security the code-scanning API is not accessible and the upload
  # would otherwise fail the job. Only this job is granted
  # `security-events: write`; the top-level default stays read-only.
  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run gosec
        # The v2.29.0 tag was cut 83 minutes before the commit that pointed
        # action.yml at the 2.29.0 image, so the tag still runs 2.28.0.
        uses: securego/gosec@57f161386e11e13e4c8a37255bc1a6502993d079 # v2.29.0 image sha256:a6cd2f30
        with:
          # -exclude-generated: sqlc/goose output carries the standard
          # "Code generated ... DO NOT EDIT." header; scanning it only yields G101
          # false positives on query consts whose names contain "token"/"secret"
          # (e.g. GetSessionByTokenHash). Generated code is not hand-written attack
          # surface, so exclude it and keep the gate meaningful for real code.
          # -severity high -confidence high: block only high/high findings (see
          # job comment) so new high-severity issues fail while the current tree
          # (zero at this threshold) stays green. No -no-fail: the job now fails
          # on any finding at or above the threshold.
          args: "-exclude-generated -severity high -confidence high -fmt sarif -out results.sarif ./..."
      - name: Upload gosec SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: results.sarif

  # Secret scan over the full git history. A detected secret fails the build
  # by design — a committed credential is a hard stop, not an advisory.
  #
  # On a pull_request event, gitleaks-action lists the PR's commits via the
  # GitHub API (GET /pulls/{n}/commits), which needs `pull-requests: read`.
  # The top-level default is `contents: read` only, so without this scoped
  # grant the call 403s ("Resource not accessible by integration") and the
  # action crashes. Scope it here, mirroring the gosec job; the top-level
  # default stays read-only.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
