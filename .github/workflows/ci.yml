name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for GITHUB_TOKEN (#329). No job here needs write
# access to repo contents; the only exception is the gosec job, which scopes
# `security-events: write` on itself to upload its SARIF (see below).
permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...

  # An architecture is in this matrix exactly where the golden corpus (a
  # later ticket) runs on it in CI (ADR-0001, packaging-and-configuration.md
  # §1.2) — amd64 and arm64 only.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: v1
      GOARM64: v8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build -o /dev/null ./cmd/web
      - run: go build -o /dev/null ./cmd/worker
      - run: go build -o /dev/null ./cmd/prober

  sqlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: sqlc-dev/setup-sqlc@bac53b7fb28c039a6c7f5736fd1e89744021bdd6 # v5
        with:
          sqlc-version: "1.31.1"
      - run: sqlc generate
      - run: git diff --exit-code -- internal/db

  # The golden corpus (golden-corpus.md §3): the resolution-walk leaf's pinning
  # rows, run hermetically (no network, no containers) against every matrix
  # architecture. Legs 1 and 2 are the architectures; leg 3 (GOAMD64=v3) is the
  # contraction differential and ships no artefact. A2 (expectation) and the
  # lock gate run inside `go test`; A5 (coverage) names any unpinned cell.
  golden-corpus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goamd64: v1
          - runner: ubuntu-24.04-arm
            goarm64: v8.0
          - runner: ubuntu-24.04
            goamd64: v3
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GOAMD64: ${{ matrix.goamd64 }}
      GOARM64: ${{ matrix.goarm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./internal/measure/...

  # A6, gate direction 2 (golden-corpus.md §3.2): a leaf version bump with no
  # moved corpus digest, no changed declared-parameter digest and no new
  # uncovered-move row fails. Evaluated against the PR base, since "the version
  # moved and nothing else did" is only visible across commits.
  corpus-version-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: refuse an unjustified leaf-version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          lock=internal/measure/resolutionwalk/corpus/corpus.lock.json
          base=$(git show "$BASE_SHA:$lock" 2>/dev/null || echo '{}')
          head=$(cat "$lock")
          field() { echo "$1" | jq -r "$2"; }
          bv=$(field "$base" '.leaf_version // ""')
          hv=$(field "$head" '.leaf_version // ""')
          bc=$(field "$base" '.corpus_digest // ""')
          hc=$(field "$head" '.corpus_digest // ""')
          bp=$(field "$base" '.params_digest // ""')
          hp=$(field "$head" '.params_digest // ""')
          bm=$(field "$base" '(.uncovered_moves // []) | length')
          hm=$(field "$head" '(.uncovered_moves // []) | length')
          if [ "$hv" != "$bv" ] && [ "$hc" = "$bc" ] && [ "$hp" = "$bp" ] && [ "$hm" = "$bm" ]; then
            echo "leaf version moved $bv -> $hv with no moved corpus row, no changed"
            echo "declared parameter and no new uncovered-move row. Refused (ADR-0021)."
            exit 1
          fi
          echo "version gate ok"

  compose:
    runs-on: ubuntu-latest
    # Every compose invocation in this job interpolates POSTGRES_PASSWORD —
    # build, up, the `docker compose ps` in the health loop below, and down.
    # It must be set for all of them, so it lives at job level: setting it
    # per-step once left the health loop's `ps` without it, and compose then
    # refuses to parse the file at all ("required variable ... is missing a
    # value"), so the loop never saw the running stack and the job always failed.
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker compose build
      - name: docker compose up
        run: docker compose up -d
      - name: wait for a healthy stack
        run: |
          for i in $(seq 1 30); do
            bad=$(docker compose ps --all --format json | jq -r \
              'select(.State != "running" or (.Health != "" and .Health != "healthy")) | .Name')
            count=$(docker compose ps --all --format json | jq -rs 'length')
            if [ "$count" = "3" ] && [ -z "$bad" ]; then
              echo "all services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "services never became healthy:"
          docker compose ps --all
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v

  # --- Supply-chain / SAST / secret scanning (#331) ---

  # Dependency vulnerability scan against the Go vulnerability database.
  # Informational: reports known-vulnerable symbols reachable from our code
  # without blocking the build on pre-existing advisories (`continue-on-error`).
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck ./...
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  # Static application security testing. Runs gosec with `-no-fail` so a
  # pre-existing finding does not break the build; results are surfaced as
  # SARIF in the repository's code-scanning (Security) tab where code scanning
  # is available. The upload is best-effort (`continue-on-error`): on a repo
  # without GitHub code scanning / Advanced Security the code-scanning API is
  # not accessible and the upload would otherwise fail an informational job.
  # Only this job is granted `security-events: write`; the top-level default
  # stays read-only.
  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: "-no-fail -fmt sarif -out results.sarif ./..."
      - name: Upload gosec SARIF
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef # codeql-bundle-v2.26.3
        with:
          sarif_file: results.sarif

  # Secret scan over the full git history. A detected secret fails the build
  # by design — a committed credential is a hard stop, not an advisory.
  #
  # On a pull_request event, gitleaks-action lists the PR's commits via the
  # GitHub API (GET /pulls/{n}/commits), which needs `pull-requests: read`.
  # The top-level default is `contents: read` only, so without this scoped
  # grant the call 403s ("Resource not accessible by integration") and the
  # action crashes. Scope it here, mirroring the gosec job; the top-level
  # default stays read-only.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
