name: doclint

# Four documentation jobs with different postures. `doclint` is the advisory style lint
# (SPEC docs/spec/doc-lint-tool.md §5.2, ticket #822). `citations` is the cited-path
# gate (#1436), and `adr-sections` is the `ADR-nnnn §n` gate (#1437, #1465) plus the ADR
# index and marker gates (#1738); both jobs fail on a violation, and both are required
# checks since 2026-09-07. `adr-review` is the ADR review gate of SPEC
# docs/spec/adr-governance.md §8 (#1739); it is a required check since 2026-09-08, when
# a human added it to the ruleset (#1740). `doclint` is not.
#
# THE `doclint` JOB. A dedicated, non-blocking job that runs the doclint tool on a pull
# request. It is SEPARATE from the docs-site build job (docs-site.yml), whose gates are
# blocking but likewise not required (#1438). This job is advisory: it is
# continue-on-error, so it never fails the workflow and never blocks a merge. The human
# review in the style standard §7 stays the acceptance path.
#
# SCOPE. The job lints the CHANGED docs on the pull request, not the whole tree
# (SPEC §5.2). It computes the diff against the base and hands the tool the changed
# files. The tool's --in-scope-only flag drops any path the SPEC §1.3 set does not
# cover, so an out-of-scope doc never reaches a rule.
#
# OUTPUT. The tool's --github flag prints one GitHub Actions annotation per violation,
# so each flag lands inline on the pull-request diff, plus a job-log summary of counts
# by rule and by severity (SPEC §5.2). There is no SARIF in v1.
#
# The other three jobs, `citations`, `adr-sections`, and `adr-review`, are different
# gates with different scopes. See their own headers below. The first two read the whole
# tree, so this workflow carries no paths filter: a PR that deletes a Go file and no
# document at all still breaks a citation (#1436). The doclint job below tolerates that;
# it lints the diff, which on such a PR is empty. `adr-review` must run on every PR for
# its own reason: a skipped required check counts as passed.

# `edited` is for `adr-review`: a PR body fix to the `## Decision` block must re-run the
# gate without a push (SPEC docs/spec/adr-governance.md §9, #1739). The default types are
# the first three; naming `edited` means naming all four. The other three jobs re-run on
# an edit too, and the concurrency group below cancels the superseded run.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Least-privilege default (matches ci.yml / docs-site.yml, #329). The annotations and
# the step summary are stdout and a runner file, so the job needs no extra grant.
permissions:
  contents: read

# Per-ref group so concurrent PRs run in parallel; a newer push to the SAME ref cancels
# the superseded run.
concurrency:
  group: doclint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doclint:
    runs-on: ubuntu-latest
    # ADVISORY. continue-on-error keeps the job from failing the workflow or blocking a
    # merge, whatever the tool reports. The tool's --github mode is also advisory (it
    # exits zero on a violation), so this is belt-and-suspenders (SPEC §5.2).
    continue-on-error: true
    steps:
      # fetch-depth: 0 is load-bearing: the diff below compares the changed files against
      # the pull-request base with a three-dot range, which needs the merge base in
      # history. A shallow clone has no merge base, so the diff would be wrong.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      # Lint the changed in-scope docs. The diff lists Added/Copied/Modified/Renamed/
      # Type-changed paths (a Deleted file cannot be linted, so --diff-filter drops it).
      # The tool runs from the repo root, so a repo-relative diff path resolves straight.
      # --in-scope-only filters the list to the SPEC §1.3 set; an empty result lints
      # nothing (the tool prints a note and exits zero).
      - name: doclint the changed docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          readarray -t changed < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA")
          echo "changed files in the diff: ${#changed[@]}"
          node docs-site/scripts/doclint.mjs --github --in-scope-only "${changed[@]}"

  # Cited-path gate (#1436). Every in-repo path a document cites must resolve, in the
  # working tree or on a ref the document names beside it. A dead path fails this job.
  #
  # NOT ADVISORY, and REQUIRED. The step exits non-zero on a dead path, so the job
  # goes red, and `main`'s ruleset requires `citations`, so a red run blocks the
  # merge (#1263, #1438, promoted 2026-09-07).
  #
  # WHOLE TREE, not the diff. A citation dies when the file it names is deleted, and
  # that PR need touch no document at all.
  #
  # ARM A, the line-anchor refusal (SPEC docs/spec/citation-anchors.md §5, §7.5, #1969). A
  # citation names no line. The job fails on every `path:NNN` or `#L247` token inside the
  # SPEC §1.2 boundary. The refusal is unconditional: the sweep emptied its burn-down list,
  # and #1980 retired the list with it, so there is nothing left to consult (SPEC §8.2).
  #
  # THE `Site` ARM (SPEC §6, #1974). This gate also asserts over ONE pull-request-body field:
  # the `Site` of a Decision proposal block, per SPEC docs/spec/adr-governance.md §2. It
  # reaches no other part of a body. The anchor resolves against the merge ref, which is the
  # tree the checkout above already hands this job. A missing block passes, and a bare path
  # passes forever. The burn-down list never gains a `Site` entry: the rule is new-blocks-only.
  #
  # ARM B, the anchor resolution (SPEC §7.1, §7.3, #1970). Every anchor a citation writes
  # must resolve against its row in the SPEC §3.2 table. A broken anchor exits 1. An
  # unparseable target, or an absent Go toolchain, exits 2: it is a claim the gate should
  # judge and could not (SPEC §7.7).
  #
  # setup-go IS LOAD-BEARING for Arm B. A column-0 regex verifies a Go anchor in neither
  # direction (SPEC §7.3), so the Go row shells out to cmd/godecls for a real go/parser
  # parse. The step reads go-version-file, as all nine other setup-go steps in this repo do:
  # scripts/check-go-pins.sh reads no workflow file, so a literal version would drift with
  # nothing to catch it. The job name does not move, so the ruleset needs no change.
  #
  # fetch-depth: 0 is load-bearing for the ref arm. raw-job-output.md §6 cites a path
  # that lives only on origin/research/843-rawoutput-prototype, and the gate resolves it
  # with `git cat-file -e <ref>:<path>`. A ref the clone cannot see is reported as an
  # unreachable ref, never counted as a pass and never counted as a dead path. The gate
  # fetches no ref of its own. Arm B's Go row runs `go run ./cmd/godecls`, which imports
  # the standard library alone, so it resolves no module over the network. The row still
  # caps that call with a timeout, because a cold module cache behind a slow proxy would
  # otherwise hang a required check rather than take the exit 2 SPEC §7.7 prescribes.
  citations:
    runs-on: ubuntu-latest
    # `pull-requests: read` is the grant that reads a PR body for the Site arm below. A
    # job-level block replaces the workflow default, so `contents: read` is restated.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .go-version

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      # `test:citations` runs its three suites in sequence, not as one `node --test` call.
      # `node --test` runs FILES in parallel, and the suites mutate the same tree: each
      # writes fixture documents under docs-site/, which another suite's whole-tree run then
      # walks. Parallel is a flaky red on a required check. Keep the `&&`.
      - name: Cited-path gate tests
        working-directory: docs-site
        run: npm run test:citations

      # THE SWEEP SUITES (#2279). `test:sweep` ran in no workflow, so no required check ever
      # executed its cases. Three ADRs name a case in
      # docs-site/scripts/sweep-line-anchors.test.mjs as their `proof`: ADR-2155, ADR-2277 and
      # ADR-2283. A later PR could contradict any of those rulings with every required check
      # green.
      #
      # #1975 keeps the sweep TOOL out of a required check's path, because a `--write` run
      # rewrites documents. These are the tool's unit tests, and they run no such conversion.
      # They import the modules and assert on return values. Their only residue is a
      # `.sweep-fixture-<pid>` directory, which `test.after` removes. It sits at the repo
      # ROOT, outside the six family directories the gate below walks (SPEC
      # docs/spec/citation-anchors.md §1.2), so a leftover fixture document reaches no
      # verdict even on the run that left it. Two cases do spawn the CLI, and each asserts a
      # refusal that exits 2 before the tool reads a document.
      #
      # THIS JOB, not `adr-sections`. The suite shells out to `go run ./cmd/godecls` for its
      # Go row, as Arm B above does, and `citations` is the only job in this workflow with
      # setup-go. A step inside a job the ruleset already requires needs no ruleset change. A
      # new job would sit on `Expected` until a human registered it.
      - name: Sweep derivation tests
        working-directory: docs-site
        run: npm run test:sweep

      # GITHUB_TOKEN is for the Site arm (SPEC docs/spec/citation-anchors.md §6, #1974). The
      # step reads the PR body from the REST API, never from GITHUB_EVENT_PATH: `gh run
      # rerun` replays a stale payload, so a body edit could otherwise never clear the gate.
      # A run with no pull-request context judges no body and says so.
      - name: Cited-path gate
        working-directory: docs-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:citations

  # `ADR-nnnn §n` gate (#1437, repaired and wired by #1465). A `§n` citation resolves
  # only against a numbered heading of the ADR it names. 91 of the 218 ADRs number no
  # heading, so a `§n` against one of those is wrong by construction (SPEC
  # docs/spec/comment-policy.md §4.7). The citation grammar is SPEC
  # docs/spec/adr-governance.md §9: `ADR-\d{4,}` must name a file, a `§` naming a
  # heading by word fails, and `ADR-nnnn #nnn` fails above ADR-0227 (#1735). The same step
  # also holds §9's Decision-block row: above ADR-0227 the first `##` must be Decision and its
  # block must not exceed 150 words. That row lived only in the index and marker steps below,
  # which an author running `npm run check:adr-sections` alone never reaches (#2193).
  #
  # NOT ADVISORY, and REQUIRED. The step exits non-zero on a violation, so the job
  # goes red, and `main`'s ruleset requires `adr-sections`, so a red run blocks the
  # merge (#1263, #1438, promoted 2026-09-07).
  #
  # WHOLE TREE, not the diff. The index is built from docs/adr/, so deleting a numbered
  # heading breaks a citation in a file the PR never touched. The index and marker gates
  # below read the whole tree for the same reason: a relation on one ADR writes a marker
  # into another, and the committed index.json is a function of every file.
  #
  # fetch-depth is the default: the gates read the working tree and `git ls-files`, and
  # need no history.
  adr-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: ADR section gate tests
        working-directory: docs-site
        run: npm run test:adr-sections

      # --github prints one annotation per violation and appends a summary table, so a
      # violation lands inline on the diff rather than only in the job log. The flag does
      # not soften the exit code.
      - name: ADR section gate
        working-directory: docs-site
        run: npm run check:adr-sections -- --github

      # The two regenerate-and-diff gates of SPEC docs/spec/adr-governance.md §9, added by
      # the legacy backfill (#1738). Each validates every ADR's front matter, then compares
      # the committed docs/adr/index.json, or every tool-written marker, against a fresh
      # regeneration. A hand-edited marker or a stale index goes red here. Each step runs
      # its own test suite first, because no other job runs them.
      - name: ADR index gate
        working-directory: docs-site
        run: |
          npm run test:adr-index
          npm run check:adr-index

      - name: ADR marker gate
        working-directory: docs-site
        run: |
          npm run test:adr-markers
          npm run check:adr-markers

  # ADR review gate (SPEC docs/spec/adr-governance.md §8 and §9, #1739, #2231). A PR that
  # adds a file under docs/adr/, or hand-edits one numbered above 227, is held until a
  # fresh-context reviewer, running the `adr-review` skill, has posted one comment that
  # opens with `<!-- adr-review sha=<head sha> verdict=pass -->`. The script also fails on
  # two markers for one SHA, on two reviewed ADR files, on a PR body whose `## Decision`
  # differs from the file's Decision block, and on a hand edit above 227 that falls
  # outside a legacy marker blockquote (§8 row M1).
  #
  # ALWAYS RUNS. A required check that an `if:` skips counts as passed, so this job has
  # no `if:` and no paths filter. On a PR with no ADR file to review the script passes at
  # once.
  #
  # REQUIRED since 2026-09-08. The `main protection` ruleset gained this job in the human
  # step of #1740. A red run here blocks the merge.
  #
  # A PR comment does not re-trigger a pull_request workflow, so the reviewer's last step
  # is `gh run rerun --failed` on this run. `edited` in the trigger above covers a PR body
  # fix without a push.
  #
  # Reads the PR's file list and its comments through the REST API with the job token.
  # `pull-requests: read` is the grant that reads a PR's comments; `issues: read` is named
  # beside it because the comments endpoint is the issues one. The ADR file itself is read
  # from the checkout, which is the PR's merge ref.
  adr-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: ADR review gate tests
        working-directory: docs-site
        run: npm run test:adr-review

      - name: ADR review gate
        working-directory: docs-site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:adr-review
