<link rel="stylesheet" href="../design-system-legacy/styles.css">
<!--
  PROTOTYPE — throwaway. Issue #123, "The Seeds screen: six jobs beyond listing, and three
  refusals with three different right answers". Not production code and not a component library.

  URL:  ?screen=seeds|declare|notqueue|extension
          &variant=A|B|C      (screen=seeds only — the three structures)
          &fill=zero|single|estate|cloud   (screen=seeds only)
          &refusal=none|cap4|cap6|ulabel|wildcard   (screen=declare only)
          &state=off|on|nothing|withdrawn          (screen=extension only)

  The six jobs beyond listing that this screen has to do:
    1. the two Seed kinds, and what differs downstream of each
    2. exclusions — three kinds, rendering when empty and saying why (#47)
    3. retained Proposal provenance on a confirmed Seed (ADR-0012)
    4. the custody extension declaration surface + its census (#51, ADR-0013 §7)
    5. #50's "what answered" panel — the no-false-absence rule for the propose half
    6. the range size cap as declaration-time validation (#81, ADR-0047 / ADR-0049)

  Two tables that look alike ship on this screen at once. The Proposal list legitimately IS an
  approval queue; the extension census must carry NO per-row control and NO nav badge.
  ?screen=notqueue draws both, and the forbidden one is drawn properly rather than described.

  Glossary is binding (CONTEXT.md). No "asset" as a modelled thing, no "host", no "finding",
  no "scan run", no "discovery"/"probe" as nouns. Design system is canonical for the visual
  layer only; where kit and glossary collide the glossary wins.

  Annotations in a dashed box marked PROTOTYPE NOTE are commentary for the reviewer and are not
  part of the design.
-->
<style>

<script>
/* ------------------------------------------------------------------ routing */
const SCREENS  = ["seeds", "declare", "notqueue", "extension"];
const VARIANTS = ["A", "B", "C"];
const FILLS    = ["zero", "single", "estate", "cloud"];
const REFUSALS = ["none", "cap4", "cap6", "ulabel", "wildcard"];
const STATES   = ["off", "on", "nothing", "withdrawn"];

function params() {
  const p = new URLSearchParams(location.search);
  const g = (k, list, d) => { const v = p.get(k); return list.includes(v) ? v : d; };
  return {
    screen:  g("screen",  SCREENS,  "seeds"),
    variant: g("variant", VARIANTS, "C"),
    fill:    g("fill",    FILLS,    "estate"),
    refusal: g("refusal", REFUSALS, "cap6"),
    state:   g("state",   STATES,   "on"),
  };
}
function go(next) {
  const s = { ...params(), ...next };
  history.replaceState(null, "", "?" + new URLSearchParams(s).toString());
  render();
}

/* ------------------------------------------------------------------ helpers */
const n   = x => x.toLocaleString("en-GB");
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const mo  = s => `<span class="mono">${esc(s)}</span>`;

function anno(label, html, bad) {
  return `<div class="anno${bad ? " no" : ""}"><span class="ml">${label}</span>${html}</div>`;
}

/* ------------------------------------------------------------------ the estate

   A fake estate chosen to exercise every job at once:
     - one name scope with a custody extension ON, including three flattened apex ALIAS
       records pointing at a CDN, which the census cannot flag and does not (#51 §4)
     - one IPv4 address scope confirmed from a Proposal, so it carries provenance
     - one IPv6 /128 address scope: the internal prober's own address, the route ADR-0049
       leaves open when the extension is barred from the Vantage class check
     - exclusions of all three kinds on one seed, and none at all on another
------------------------------------------------------------------------------- */

const EXT_ADDRESSES = [
  { addr: "203.0.113.17",  via: "www.example.com",       how: "A" },
  { addr: "203.0.113.18",  via: "www.example.com",       how: "A" },
  { addr: "203.0.113.41",  via: "api.example.com",       how: "A" },
  { addr: "203.0.113.42",  via: "api.example.com",       how: "A" },
  { addr: "2001:db8:4::11", via: "api.example.com",      how: "AAAA" },
  { addr: "198.51.100.12", via: "mail.example.com",      how: "A" },
  { addr: "198.51.100.13", via: "mail.example.com",      how: "A" },
  { addr: "203.0.113.90",  via: "vpn.example.com",       how: "A" },
  { addr: "18.164.52.11",  via: "example.com",           how: "A" },
  { addr: "18.164.52.72",  via: "example.com",           how: "A" },
  { addr: "18.164.52.140", via: "example.com",           how: "A" },
];
const EXT_OUTSIDE = [
  { name: "shop.example.com",   target: "d1x2y3.cloudfront.net" },
  { name: "help.example.com",   target: "example.zendesk.com" },
  { name: "status.example.com", target: "stspg-customer.com" },
  { name: "pay.example.com",    target: "checkout.stripe.com" },
];

const NAME_SEED = {
  kind: "name",
  key: "example.com",
  declared: "2026-06-02",
  extension: { on: true, addresses: EXT_ADDRESSES, outside: EXT_OUTSIDE },
  exclusions: {
    exact:   [{ v: "legacy.example.com", when: "2026-06-11", why: "sold with the product line", origin: "typed" }],
    subtree: [{ v: "partners.example.com", when: "2026-07-02", why: "run by the partner, not by you", origin: "typed" }],
    addr:    [],
  },
  provenance: null,
};

const V4_SEED = {
  kind: "address",
  key: "198.51.100.0/24",
  addresses: 256,
  declared: "2026-06-04",
  extension: null,
  exclusions: { exact: [], subtree: [], addr: [
    { v: "198.51.100.128/25", when: "2026-07-30", why: "the other half of the range is not yours", origin: "decline" },
    { v: "52.94.0.0/16", when: "2026-06-04", why: "Amazon's, not yours", origin: "decline", andMore: 176 },
  ] },
  provenance: {
    recordKind: "reassignment",
    holder: "Level 3 Parent, LLC",
    handle: "NET-198-51-100-0-1",
    reassignedTo: "Example Ltd",
    confirmed: "2026-06-04",
    lookupFrom: "the address you declared",
  },
};

const V6_SEED = {
  kind: "address",
  key: "2001:db8:4:1::c7/128",
  addresses: 1,
  declared: "2026-07-19",
  extension: null,
  exclusions: { exact: [], subtree: [], addr: [] },
  provenance: null,
  note: "the internal prober's own address — declared so its vantage verifies as internal",

const DECLINED = [

/* ── THE DATELINE — ADR-0075 (#131), applied by #144 ────────────────────────
   A prototype is a dated record of a READING, never of a RULE. The provenance
   has to be in what the browser DRAWS: every recorded instance of a prototype
   being wrongly believed happened in a browser, where an HTML comment is
   invisible. Drawn on all 22 combinations, because every one is a reading. */
function dateline() {
  return `
  <div class="anno">
    <span class="ml">prototype · not part of the design</span>
    <p><b>Issue #123 — "The Seeds screen: six jobs beyond listing, and three refusals with three
      different right answers". Drawn 2026-08-15</b>, with one superseded staleness-window line
      corrected the same day in the ten-ticket merge reconciliation. Throwaway: something to decide
      against, not production UI and not a component library.</p>
    <p><b>Every quantity on these screens is a dated reading, not a current value</b> — the corpus
      as it stood on that date, and nothing here has been re-filled since. The only live absolutes
      are the map's <code>THE CURRENT COMPOSED STATE</code> line (issue #1, <i>Notes</i>): read a
      figure there before believing one here. What is <i>not</i> a dated reading is the state these
      screens draw — the acts they offer, the populations they show as non-empty and the sentences
      they put in the product's mouth. A later ruling that makes one of those unreachable is marked
      here in place and never redrawn.</p>
  </div>`;
}

/* ------------------------------------------------------------------ shared parts */

function exclusionsSection(seed) {
  const e = seed.exclusions;
  const total = e.exact.length + e.subtree.length + e.addr.length;
  const group = (label, rows, emptyWhy, render) => `
    <div style="padding:var(--space-3) var(--space-4);border-top:var(--rule-soft)">
      <span class="ml">${label}</span>
      ${rows.length
        ? `<div style="margin-top:var(--space-2)">${rows.map(render).join("")}</div>`
        : `<div class="muted" style="margin-top:var(--space-2);font-size:var(--text-sm);line-height:var(--leading-body);max-width:76ch">${emptyWhy}</div>`}
    </div>`;

  const line = (v, r) => `<div style="margin-bottom:var(--space-2)">
      <span class="mono" style="font-weight:var(--weight-semibold)">${esc(v)}</span>
      ${r.origin === "decline" ? ` <span class="tag gone">from a decline</span>` : ``}
      ${r.andMore ? ` <span class="muted" style="font-size:var(--text-sm)">and ${r.andMore} more under the same holder</span>` : ``}
      <span class="rowsub">declared ${mo(r.when)} — ${esc(r.why)}</span></div>`;

  return `
  <div class="sect">
    <div class="sect-h">
      <span class="ml">Exclusions</span>
      <span class="hint">${total
        ? `${total} declared. An exclusion is a claim that something is not yours, not that it is not there. A decline writes one of these; this is the list, and the declined region below is this list filtered.`
        : `None declared on this seed.`}</span>
      <span class="sp"></span>
      <button class="btn ghost sm">Add an exclusion</button>
    </div>
    ${group("Exact names", e.exact,
      "No name inside this scope has been declared outside your estate. An excluded name is no longer queried, even if it still resolves.",
      r => line(r.v, r))}
    ${group("Subtrees", e.subtree,
      "No subtree has been excluded. A subtree covers the name itself as well as everything beneath it.",
      r => line(r.v, r))}
    ${group("Address scopes", e.addr,
      seed.kind === "name"
        ? "No address range has been excluded. On a name scope an address exclusion carves nothing unless the custody extension is on."
        : "No address range has been excluded from this scope.",
      r => line(r.v, r))}
  </div>`;
}

function extensionCensus(seed, opts = {}) {
  const ext = seed.extension;
  if (!ext) return "";
  const showControls = !!opts.forbidden;

  if (!ext.on) {
    return `
    <div class="sect">
      <div class="sect-h">
        <span class="ml">Custody extension</span>
        <span class="tag off">off</span>
        <span class="hint">The addresses ${esc(seed.key)} resolves to are treated as somebody else's.</span>
        <span class="sp"></span>
        <a href="?screen=extension&state=off" class="btn ghost sm" style="text-decoration:none;line-height:24px;display:inline-block">Open the declaration</a>
      </div>
      <div class="pad">
        <span class="note inert">
          <p>Their ports are not probed and no exposure is concluded for them.
          ${ext.outside.length ? `Four names inside this scope point at somebody else's name, so they would be outside the extension in any case.` : ``}</p>
          <p>If the machines behind your names are somebody else's — shared hosting, a CDN, a managed load
          balancer — this is the correct setting and there is nothing here to fix.</p>
        </span>
      </div>
    </div>`;
  }

  if (!ext.addresses.length) {
    return `
    <div class="sect">
      <div class="sect-h"><span class="ml">Custody extension</span><span class="tag ink">on</span>
        <span class="hint">0 addresses · 0 names</span></div>
      <div class="pad">
        <div class="empty">
          <span class="ml">Nothing is covered yet</span>
          <p>The extension is on, and no name inside ${esc(seed.key)} resolves directly to an address.
          That is a different state from having it off: the claim has been made and it currently reaches nothing.
          It will cover an address the moment a name inside this scope resolves to one directly.</p>
        </div>
      </div>
    </div>`;
  }

  const names = new Set(ext.addresses.map(a => a.via)).size;
  return `
  <div class="sect">
    <div class="sect-h">
      <span class="ml">Custody extension</span>
      <span class="tag ink">on</span>
      <span class="hint">${ext.addresses.length} addresses · ${names} names. Worked out again every cadence.</span>
      <span class="sp"></span>
      ${showControls
        ? `<span class="tag warn">7 pending</span><button class="btn sm">Approve all</button>`
        : `<a href="?screen=extension&state=on" style="font-size:var(--text-sm)">Change the declaration</a>`}
    </div>
    <table>
      <thead><tr>
        ${showControls ? `<th style="width:28px"></th>` : ``}
        <th class="m">Address</th><th class="m">Cited by</th><th>Record</th>
        ${showControls ? `<th></th>` : ``}
      </tr></thead>
      <tbody>
        ${ext.addresses.map(a => `<tr>
          ${showControls ? `<td><span class="cbx"></span></td>` : ``}
          <td class="m" style="font-weight:var(--weight-semibold)">${esc(a.addr)}</td>
          <td class="m">${esc(a.via)}</td>
          <td class="muted" style="font-size:var(--text-sm)">${esc(a.how)}</td>
          ${showControls ? `<td class="act"><button class="btn sm">Approve</button>
             <button class="btn ghost sm">Reject</button></td>` : ``}
        </tr>`).join("")}
      </tbody>
    </table>
    <div style="padding:var(--space-3) var(--space-4);border-top:var(--rule);background:var(--surface-sunken)">
      <span class="ml">Not covered — the chain leaves ${esc(seed.key)}</span>
      <div style="margin-top:var(--space-2);font-size:var(--text-sm);line-height:var(--leading-body)">
        ${ext.outside.map(o => `<div class="mono">${esc(o.name)} &rarr; ${esc(o.target)}</div>`).join("")}
      </div>
      <div class="muted" style="margin-top:var(--space-2);font-size:var(--text-sm);max-width:80ch;line-height:var(--leading-body)">
        A name pointing at somebody else's name is outside the extension, and so is everything past that point.
        These are shown so the boundary is visible; nothing about them is a task.
      </div>
    </div>
  </div>`;
}

function provenanceSection(seed) {
  const p = seed.provenance;
  if (!p) return "";
  const k = KIND[p.recordKind];
  return `
  <div class="sect">
    <div class="sect-h"><span class="ml">Confirmed from a proposal</span>
      <span class="hint">Kept as provenance. It records where the offer came from; it asserts nothing now.</span></div>
    <div class="prov">
      <div class="kv"><span class="ml">Record kind</span><span class="v"><span class="tag ${p.recordKind === "reassignment" ? "warn" : "ink"}">${k.label}</span></span></div>
      <div class="kv"><span class="ml">Registered holder</span><span class="v">${esc(p.holder)}</span></div>
      <div class="kv"><span class="ml">Handle</span><span class="v">${esc(p.handle)}</span></div>
      <div class="kv"><span class="ml">Reassigned to</span><span class="v">${esc(p.reassignedTo)}</span></div>
      <div class="kv"><span class="ml">Confirmed</span><span class="v">${esc(p.confirmed)}</span></div>
    </div>
    <div style="padding:0 var(--space-4) var(--space-4)">
      <span class="note inert">${esc(k.caveat)} The offer came from expanding ${esc(p.lookupFrom)}.
      Confirming it is what made this a seed; the record itself opens nothing.</span>
    </div>
  </div>`;
}

function seedBlock(seed) {
  const isName = seed.kind === "name";
  return `
  ${anno("withdrawn — #165 · ADR-0093",
    `<p><b>The <span class="mono">declared &lt;month&gt;</span> cell below is a field the product does
     not have</b>, and so are the <span class="mono">declared &lt;month&gt;</span> on every exclusion
     row and the date column in the declined region. An instant is not a field the Declared layer may
     carry: it is earned only where the term is replaced rather than edited <i>and</i> the act leaves
     no dated residue, and a <span class="mono">Seed</span> fails both — it is edited after creation,
     and #127 already dates it from the estate.</p>
     <p><b>What this surface would draw now:</b> the date read from the <b>earliest
     <span class="mono">revealed</span> beneath the scope</b>, labelled as what it is — when something
     was first seen there, not when you typed it — and nothing at all on a scope that has never
     yielded a subject. An exclusion is dated by the coverage-class message #130 · ADR-0074 fires at
     the scope, which carries the instant of the cause.</p>`, true)}
  <div class="seed">
    <div class="seed-h">
      <div>
        <div class="k">${esc(seed.key)}</div>
        <div class="meta">
          <span class="tag ${isName ? "ink" : ""}">${isName ? "name scope" : "address scope"}</span>
          &nbsp;declared ${mo(seed.declared)}
          ${seed.note ? ` — ${esc(seed.note)}` : ``}
        </div>
      </div>
      <span class="sp"></span>
      <div class="fig">
        ${isName
          ? `<div class="v" style="font-size:var(--text-md);color:var(--text-muted)">enumerates nothing</div>
             <span class="ml k">no coverage denominator</span>`
          : `<div class="v">${n(seed.addresses)}</div><span class="ml k">addresses, every one measured</span>`}
      </div>
      <button class="btn ghost sm">Withdraw</button>
    </div>
    <div class="origin">${isName
      ? `a name scope enumerates nothing &middot; its addresses are reached only by measured resolution, and only under a custody extension &middot; no coverage denominator`
      : `an address scope is its own complete extension &middot; every address in it is a subject from this declaration, walked every cadence whether or not anything has ever answered there &middot; <a href="#">coverage &rarr;</a>`}</div>
    ${exclusionsSection(seed)}
    ${isName ? extensionCensus(seed) : ""}
    ${provenanceSection(seed)}
  </div>`;
}

function proposalsRegion(props, fill) {
  if (!props.length) {
    return `
    <div class="empty">
      <span class="ml">No proposals</span>
      <p>Nothing is waiting. A registry lookup runs only when you ask for one — expanding an address
      scope you declared, or searching an organisation name — never on a schedule, so nothing
      accumulates here while you are away.</p>
      <p style="margin-top:var(--space-2)"><a href="?screen=seeds&fill=cloud&variant=${params().variant}">Search for an organisation name</a></p>
    </div>`;
  }
  return props.map(g => `
    <div class="card ${g.alarming ? "ink" : ""}">
      <div class="grp-h">
        <div class="who">
          <span class="ml">Registered holder</span>
          <div class="h">${esc(g.holder)}</div>
          <div class="hh">${esc(g.handle)}${g.upstream ? ` &middot; reassigned by ${esc(g.upstream)}` : ``}</div>
          <div style="margin-top:var(--space-3)"><span class="tag ${g.kind === "reassignment" ? "warn" : "ink"}">${KIND[g.kind].label}</span></div>
          <div class="muted" style="font-size:var(--text-sm);margin-top:var(--space-2);max-width:44ch;line-height:var(--leading-snug)">${esc(KIND[g.kind].caveat)}</div>
        </div>
        <span class="sp"></span>
        <div class="fig"><div class="v ${g.alarming ? "big" : ""}">${n(g.addresses)}</div><span class="ml k">addresses</span></div>
        <div class="fig"><div class="v">${n(g.scopes)}</div><span class="ml k">scopes</span></div>
      </div>
      <table>
        <thead><tr><th class="m">Scope</th><th class="num">Addresses</th><th>What else is on this record</th><th></th></tr></thead>
        <tbody>
          ${g.rows.map(r => `<tr>
            <td class="m" style="font-weight:var(--weight-semibold)">${esc(r.cidr)}</td>
            <td class="num">${n(r.addr)}</td>
            <td class="muted" style="font-size:var(--text-sm)">${esc(r.shares)}</td>
            <td class="act" ${r.addr > 1024 ? `style="white-space:normal;max-width:30ch"` : ``}>${r.addr > 1024
              ? `<button class="btn sm" disabled>Confirm <span class="n">${n(r.addr)}</span> addresses</button>
                 <span class="rowsub" style="text-align:right">Over the cap of 1,024 addresses per scope. Confirming is a declaration, and the cap is checked at the declaration.</span>`
              : `<button class="btn sm">Confirm <span class="n">${n(r.addr)}</span> addresses</button>`}</td>
          </tr>`).join("")}
          ${g.more ? `<tr><td colspan="4" class="muted" style="text-align:center;padding:var(--space-4)">
            <b class="mono">${n(g.more)}</b> more scopes under ${esc(g.handle)}. <a href="#">Show all</a></td></tr>` : ``}
        </tbody>
      </table>
      <div class="grp-act">
        <button class="btn ghost">Decline all <span class="n">${n(g.scopes)}</span> scopes</button>
        <span class="muted" style="font-size:var(--text-sm)">Declining writes an exclusion on the seed the lookup ran from. It opens nothing.</span>
      </div>
    </div>`).join("") + anno("surfaced by drawing this — a collision with a closed ticket's artefact", `
      <p><b>Confirming a proposal <i>is</i> the declaration the range cap validates</b>, so an over-cap
      proposal cannot carry a live confirm control. Most of the 177 AWS scopes are over the cap by
      several orders of magnitude, and the refusal renders in the row rather than after the click.</p>
      <p>This makes the AWS case more legible rather than less: the correct action was always
      <i>decline all</i>, and now the wrong action is not offered. It also means
      <span class="mono">prototypes/proposal-confirm</span> carries a stale example —
      <span class="mono">Confirm 8,388,608 addresses</span> is an act the shipped default now refuses.
      The control's shape and its <i>nothing branches on the number</i> rule both survive.
      <b>The example is not restated.</b> This paragraph previously read <i>the figure wants
      restating at an admissible size</i>; ADR-0075 supersedes that clause, because restating
      destroys the evidence and makes the record lie about when the ruling arrived. Left in place as
      that session's dated record, and now marked on its own rendered surface at
      <span class="mono">?fill=cloud</span> per ADR-0075 limb 3 (#145).</p>`);
}

function declinedRegion(rows) {
  if (!rows.length) {
    return `<div class="empty"><span class="ml">Nothing declined</span>
      <p>A declined proposal is listed here, dated and reversible. Nothing has been declined on this
      install, so the ledger is empty — not hidden.</p></div>`;
  }
  return `
  <div class="card">
    <table>
      <thead><tr><th class="m">Scope</th><th class="num">Addresses</th><th>What declining did</th><th class="m">Declined</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td class="m" style="font-weight:var(--weight-semibold)">${esc(r.cidr)}
            <span class="rowsub">${esc(r.holder)} &middot; from ${mo(r.from)}${r.andMore ? ` &middot; and ${r.andMore} more under this holder` : ``}</span></td>
          <td class="num">${n(r.addresses)}</td>
          <td style="font-size:var(--text-sm);line-height:var(--leading-body)">
            ${r.effect === "gate"
              ? `<span class="tag ink">closed the gate</span>
                 <span class="rowsub">128 addresses inside a scope you confirmed stopped being probed from this date. Their custody reads third-party.</span>`
              : `<span class="tag gone">nothing today</span>
                 <span class="rowsub">No seed covered this, so its custody was already third-party. The exclusion stops it being offered again.</span>`}</td>
          <td class="m">${esc(r.when)}</td>
          <td class="act"><button class="btn ghost sm">Undo</button></td>
        </tr>`).join("")}
      </tbody>
    </table>
    <div class="card-f"><span class="muted" style="font-size:var(--text-sm)">Undo returns the scope to the proposals. It never confirms it.</span></div>
  </div>`;
}

function answeredRegion(rows) {
  if (!rows.length) {
    return `<div class="empty"><span class="ml">Nothing has been asked</span>
      <p>This panel lists every registry that was asked and what it said, including the ones that
      answered. It is empty because no lookup has been run — not because every lookup came back empty.</p></div>`;
  }
  const key = { ok: "", zero: "", blind: "warnk", off: "inert" };
  return `<div class="col" style="gap:var(--space-3);max-width:92ch">
    ${rows.map(r => `<span class="note ${key[r.state]}">
      <p><b>${esc(r.head)}</b></p>
      <p>${esc(r.body)}</p>
      <p class="muted mono" style="font-size:var(--text-xs)">${esc(r.who)} &middot; ${esc(r.q)}</p>
    </span>`).join("")}
  </div>`;
}

function seedsZero() {
  return `
  ${anno("empty state — #47's rule, applied to four groups at once",
    `<p>Every group that renders when populated renders here, and each says <b>why</b> it is empty in its
     own terms. Four different empties, and the wording of each is the whole point: nothing declared;
     no lookup asked for; nothing declined; nothing asked. A heading that disappeared when its contents
     were empty would leave you unable to tell <i>there is nothing here</i> from <i>this tool has no such idea</i>.</p>`)}
  <div class="empty" style="margin-bottom:var(--space-5)">
    <span class="ml">Nothing is declared</span>
    <p>Nothing is measured until something here says where your estate ends. Start with the domain you

  </div>
  ${region("Proposed scopes", "A registry's guess at what else you hold. Real only once you confirm it.", proposalsRegion([], "zero"))}
  ${region("Declined scopes", "Durable claims that something is not yours. Reversible.", declinedRegion([]))}
  ${region("What answered", "Which registries were asked, and what each of them said.", answeredRegion([]))}`;
}

function variantC(fill) {
  const seeds = seedsFor(fill), props = proposalsFor(fill), dec = declinedFor(fill), ans = answeredFor(fill);
  if (!seeds.length && !props.length) return seedsZero();
  return `
  ${anno("variant C — ships",
    `<p><b>The seed is the block, and everything about it is inside it.</b> A seed's exclusions, its
     custody extension and its retained provenance are properties of that seed, so they are sections of
     its block rather than screens of their own. The three regions below it are #50's ruling drawn out:
     confirming writes a seed, declining writes a seed exclusion, and there is no third outcome.</p>
     <p>The two lookalike tables are separated <b>structurally</b>, not by styling: the census sits
     <i>inside</i> a seed block with no controls in any row, the queue sits in its own region with a
     group header and actions. See <a href="?screen=notqueue">?screen=notqueue</a>.</p>`)}
  ${region("Declared scopes", `${seeds.length} declared. Each carries its own cap; the cap is per scope and is never summed across them.`,
    seeds.map(seedBlock).join(""))}
  ${region("Proposed scopes", "A registry's guess at what else you hold. Real only once you confirm it, one scope at a time.", proposalsRegion(props, fill))}
  ${region("Declined scopes", "Durable claims that something is not yours. Listed, dated, reversible.", declinedRegion(dec))}
  ${region("What answered", "Which registries were asked, and what each of them said — including the ones that answered.", answeredRegion(ans))}`;
}

function variantA(fill) {
  const seeds = seedsFor(fill), props = proposalsFor(fill), dec = declinedFor(fill);
  if (!seeds.length && !props.length) return seedsZero();

  const rows = [];
  seeds.forEach(s => {
    rows.push({ k: s.key, kind: s.kind === "name" ? "name scope" : "address scope",
      state: "declared", size: s.kind === "name" ? "—" : n(s.addresses), act: "Withdraw", ghost: true });
    Object.entries(s.exclusions).forEach(([t, list]) => list.forEach(x =>
      rows.push({ k: x.v, kind: "exclusion (" + t + ")", state: "excluded", size: "—", act: "Remove", ghost: true, sub: s.key })));
    if (s.extension && s.extension.on) s.extension.addresses.forEach(a =>
      rows.push({ k: a.addr, kind: "covered by the extension", state: "covered", size: "1", act: "Approve", ghost: false, sub: a.via }));
  });
  props.forEach(g => g.rows.forEach(r =>
    rows.push({ k: r.cidr, kind: "proposal (" + KIND[g.kind].label + ")", state: "proposed", size: n(r.addr), act: "Confirm", ghost: false, sub: g.holder })));
  dec.forEach(d => rows.push({ k: d.cidr, kind: "declined", state: "declined", size: n(d.addresses), act: "Undo", ghost: true, sub: d.holder }));

  return `
  ${anno("variant A — drawn in order to lose", `
    <p>One table, one <span class="mono">state</span> column, one action column. Nothing about the
    layout is wrong and the affordance is fatal: an <b>address covered by the custody extension</b> and
    a <b>proposed scope</b> become two rows of one table, distinguished by a word in a column, each
    carrying a button. That is the per-address approval queue ADR-0002 rejected and ADR-0013 re-rejected,
    arriving through a shared component rather than through a decision.</p>
    <p>It also has nowhere to put a seed's <i>properties</i>. Exclusions and covered addresses are
    facts about the seed above them, and a flat table has no way to say so — so
    <span class="mono">198.51.100.128/25</span> sits at the same rank as the scope it carves a hole in.</p>`, true)}
  <div class="card">
    <table>
      <thead><tr><th style="width:28px"></th><th class="m">Scope</th><th>Kind</th><th>State</th><th class="num">Addresses</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td><span class="cbx"></span></td>
          <td class="m" style="font-weight:var(--weight-semibold)">${esc(r.k)}${r.sub ? `<span class="rowsub">${esc(r.sub)}</span>` : ``}</td>
          <td class="muted" style="font-size:var(--text-sm)">${esc(r.kind)}</td>
          <td><span class="tag">${esc(r.state)}</span></td>
          <td class="num">${r.size}</td>
          <td class="act"><button class="btn ${r.ghost ? "ghost " : ""}sm">${esc(r.act)}</button></td>
        </tr>`).join("")}
      </tbody>
    </table>
    <div class="grp-act">
      <button class="btn">Confirm selected</button>
      <button class="btn ghost">Decline selected</button>
      <span class="muted" style="font-size:var(--text-sm)">4 selected &middot; 1,114,368 addresses</span>
    </div>
  </div>`;
}

function variantB(fill) {
  const seeds = seedsFor(fill), props = proposalsFor(fill), dec = declinedFor(fill);
  if (!seeds.length && !props.length) return seedsZero();
  const sel = seeds[0];
  return `
  ${anno("variant B — the interesting loss", `
    <p>A rail of every scope, and one detail pane. It separates the census from the queue by <b>screen</b>,
    which is the strongest separation available, and it satisfies #51's requirement that the census sit
    beside the declaration it is the extension of.</p>
    <p><b>It loses on what the screen is for.</b> <i>Where does my estate end</i> is a question about the
    whole boundary, and a rail answers it one row at a time — you cannot read the seed, its exclusions
    and the hole a decline carved in it in one look. Worse, a rail entry is a <i>durable</i> place, and
    proposals are not durable: they exist only in answer to an act you just took. Giving them a permanent
    rail slot is the inbox #50 refused, wearing navigation.</p>`, true)}
  <div class="rail-wrap">
    <div class="rail">
      <div class="rail-sect"><span class="ml">Declared</span></div>
      ${seeds.map((s, i) => `<a href="#" class="${i === 0 ? "on" : ""}"><span class="k">${esc(s.key)}</span>
        <span class="s">${s.kind === "name" ? "name scope" : n(s.addresses) + " addresses"}</span></a>`).join("")}
      <div class="rail-sect"><span class="ml">Proposed</span></div>
      ${props.length ? props.map(g => `<a href="#"><span class="k">${esc(g.handle)}</span>
        <span class="s">${n(g.scopes)} scopes &middot; ${n(g.addresses)} addresses</span></a>`).join("")
        : `<a href="#" style="pointer-events:none"><span class="s">Nothing proposed. A lookup runs only when you ask.</span></a>`}
      <div class="rail-sect"><span class="ml">Declined</span></div>
      ${dec.length ? `<a href="#"><span class="k">${n(dec.length)} scopes</span><span class="s">reversible</span></a>`
        : `<a href="#" style="pointer-events:none"><span class="s">Nothing declined.</span></a>`}
    </div>
    <div>${sel ? seedBlock(sel) : ""}</div>
  </div>`;
}

function screenSeeds(p) {
  const body = p.variant === "A" ? variantA(p.fill) : p.variant === "B" ? variantB(p.fill) : variantC(p.fill);
  return pageHead(p.fill) + body;
}

function screenDeclare(p) {
  const r = p.refusal;

  const c = ok ? null : REFUSAL_COPY[r];
  const typed = ok ? "198.51.100.0/24" : c.typed;
  const live = ok ? "address scope · 256 addresses · within the cap of 1,024 addresses per scope" : c.live;

  return `
  <h1 class="page">Declare a scope</h1>
  <p class="sub">A registrable domain, or a range of addresses. Everything measured is inside something
  you declare here.</p>

  ${anno("the shape all four refusals share", `
    <p><b>The refusal names a route and never takes it.</b> A route may move this tool's configuration;
    it may never move your claim. So the IPv4 cap refusal offers its route — raising the cap declares
    exactly the range you typed — and the other three name a route and stop, because in each of them the
    route reaches a <b>different set</b> from the thing typed. Nothing is pre-filled, nothing is
    corrected, and the box keeps what you wrote.</p>

    <label><span class="ml">Domain or address range</span></label>

      <div style="margin-top:var(--space-4)">

          denominator and a domain does not.</p>

      <p><b>Nothing was removed.</b> All 11 are still in your estate — your names still resolve to them —
      and they still appear under <span class="mono">example.com</span>.</p>
      <p><b>Their ports are no longer probed.</b> What was already measured stays on screen for up to
      <span class="mono">2 cadences</span> — two days on the daily tier — labelled as last measured and
      shown beside <span class="mono">third-party</span>, never as current. After that it goes blank rather
      than reading as absent, because ceasing to look is not measuring absence.</p>
      <p><b><span class="mono">sensitive-port-reached-from-internet</span> can no longer be evaluated</b>
      for the 30 services on these addresses. That is this tool having stopped looking, not those services
      having improved.</p>
      <p><b>Turning it back on before the next cadence completes changes nothing.</b> No gap opens, no
      history is re-baselined and no message is sent. After that, switching it back on starts measurement
      again, and anything measured for the first time is recorded as newly looked at rather than newly
      appeared.</p>
    </div></div>
  </div>`;

  return `
  <h1 class="page">Custody extension &mdash; <span class="mono" style="font-size:var(--text-lg)">example.com</span></h1>
  <p class="sub">A property of this name scope, opened from its block on <a href="?screen=seeds&variant=C&fill=estate">Seeds</a>.
  The declaration and the census are one pair: the declaration says what is being asserted, the census
  shows what the assertion currently reaches.</p>

  ${anno("three empties, and they are three different facts", `
    <p><span class="mono">state=off</span> — no claim has been made. <span class="mono">state=nothing</span>
    — the claim is made and currently reaches nothing, because no name resolves directly to an address.
    <span class="mono">state=on</span> — the claim reaches 11 addresses. A group that renders when populated
    renders when empty and says <b>why</b>, and here the why differs in kind between the two empty states.</p>`)}

  ${st === "withdrawn" ? withdrawn : tick}
  <div class="card" style="padding:0">${extensionCensus(seed)}</div>
  ${st === "on" ? `<div class="row"><button class="btn ghost">Turn the extension off</button>
    <span class="muted" style="font-size:var(--text-sm)">Applies immediately. Off is the safe direction, so there is no confirmation step.</span></div>` : ``}`;
}

/* ------------------------------------------------------------------ switcher */

const GROUPS = [
  { key: "screen",  label: "screen",  list: SCREENS,  on: () => true },
  { key: "variant", label: "variant", list: VARIANTS, on: p => p.screen === "seeds" },
  { key: "fill",    label: "fill",    list: FILLS,    on: p => p.screen === "seeds" },
  { key: "refusal", label: "refusal", list: REFUSALS, on: p => p.screen === "declare" },
  { key: "state",   label: "state",   list: STATES,   on: p => p.screen === "extension" },
];

function buildSwitch(p) {
  document.getElementById("switch").innerHTML = GROUPS.filter(g => g.on(p)).map(g => `
    <div class="grp"><span>${g.label}</span>${g.list.map(v =>
      `<button data-k="${g.key}" data-v="${v}" class="${p[g.key] === v ? "on" : ""}">${v}</button>`).join("")}</div>`).join("");
  document.querySelectorAll("#switch button").forEach(b =>
    b.onclick = () => go({ [b.dataset.k]: b.dataset.v }));
}

/* ------------------------------------------------------------------ render */

function render() {
  const p = params();
  const body =
    p.screen === "declare"   ? screenDeclare(p) :
    p.screen === "notqueue"  ? screenNotQueue()  :
    p.screen === "extension" ? screenExtension(p) :
                               screenSeeds(p);
  document.getElementById("app").innerHTML = chrome(body);
  buildSwitch(p);
}

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  const p = params();
  const g = GROUPS.filter(x => x.on(p));
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const last = g[g.length - 1];
    const i = last.list.indexOf(p[last.key]);
    const d = e.key === "ArrowRight" ? 1 : -1;
    go({ [last.key]: last.list[(i + d + last.list.length) % last.list.length] });
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const i = SCREENS.indexOf(p.screen);
    const d = e.key === "ArrowDown" ? 1 : -1;
    go({ screen: SCREENS[(i + d + SCREENS.length) % SCREENS.length] });
  }
});

render();
</script>
</body>
</html>
