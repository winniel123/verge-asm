<!doctype html>
<!--
  PROTOTYPE — throwaway. Issue #10: "Core UI screens and the landing view".

  Three variants of the verge-asm landing view, switchable via ?variant=A|B|C
  and a floating bottom bar. Each is a different answer to the question the
  ticket exists to force: what does the operator see first?

    A — Inventory first      "here is everything you own"
    B — Changes first        "here is what changed since Tuesday"
    C — Exposure board       "here is the shape of your exposure, and what moved"

  Secondary question, ?state=empty : what day one looks like, before any batch
  has completed. Each variant answers it differently, on purpose.

  Not production code. No tests, no error handling, no abstractions. Visual
  language is the real design system (../../design-system); vocabulary is
  CONTEXT.md, which overrides the kit where they disagree.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>verge-asm — landing view prototype</title>
<link rel="stylesheet" href="../../design-system/styles.css">
<style>
  /* ── prototype-local layout only; all values come from tokens ───────── */
  * { box-sizing: border-box; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .shell { flex: 1; width: 100%; max-width: var(--page-max); margin: 0 auto; padding: var(--page-pad); }

  /* micro-label — the signature motif */
  .ml { font: var(--weight-semibold) var(--text-2xs)/1 var(--font-mono);
        text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); }
  .mono { font-family: var(--font-mono); font-size: var(--text-sm); }
  .muted { color: var(--text-muted); }
  .faint { color: var(--text-faint); }

  /* top nav */
  header.nav { background: var(--surface); border-bottom: var(--rule-ink-heavy); }
  .nav-in { max-width: var(--page-max); margin: 0 auto; padding: 0 var(--page-pad);
            height: 52px; display: flex; align-items: center; gap: var(--space-6); }
  .wordmark { display: flex; align-items: baseline; gap: var(--space-2); }
  .wordmark b { font-size: var(--text-lg); font-weight: var(--weight-bold);
                letter-spacing: var(--tracking-tight); color: var(--ink); }
  .chip { background: var(--ink); color: var(--text-on-ink); padding: 2px 5px;
          font: var(--weight-semibold) var(--text-2xs)/1.2 var(--font-mono); letter-spacing: var(--tracking-label); }
  nav.items { display: flex; gap: var(--space-1); margin-left: var(--space-4); }
  nav.items a { padding: 6px var(--space-3); font-size: var(--text-base); color: var(--text-muted); }
  nav.items a.on { color: var(--ink); font-weight: var(--weight-semibold); box-shadow: inset 0 -2px 0 var(--accent); }
  nav.items a:hover { background: var(--surface-sunken); text-decoration: none; }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: var(--space-4); }

  .dot { width: 8px; height: 8px; border-radius: var(--radius-dot); flex: none; display: inline-block; }
  .dot.live { background: var(--ok); animation: verge-pulse 1.6s infinite; }
  .status { display: inline-flex; align-items: center; gap: 7px;
            font: var(--weight-medium) var(--text-xs)/1.2 var(--font-mono); color: var(--ok); }

  /* buttons */
  .btn { height: var(--control-h); padding: 0 var(--control-pad-x); border: 1px solid var(--border-ink);
         background: var(--ink); color: var(--text-on-ink); font: var(--weight-medium) var(--text-base)/1 var(--font-sans);
         cursor: pointer; border-radius: var(--radius); transition: background var(--duration) var(--ease); }
  .btn:hover { background: #3a3a30; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--border); }
  .btn.ghost:hover { background: var(--surface-sunken); }
  .btn.sm { height: var(--control-h-sm); font-size: var(--text-sm); }

  /* cards + tables */
  .card { background: var(--surface); border: var(--rule); }
  .card-h { display: flex; align-items: center; gap: var(--space-3);
            padding: var(--space-3) var(--space-4); border-bottom: var(--rule); }
  .card-h h2 { margin: 0; font-size: var(--text-md); font-weight: var(--weight-semibold); }
  .card-h .sp { margin-left: auto; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); }
  th { padding: var(--space-2) var(--table-cell-pad-x); text-align: left;
       font: var(--weight-semibold) var(--text-2xs)/1.2 var(--font-mono);
       text-transform: uppercase; letter-spacing: var(--tracking-label);
       color: var(--text-muted); border-bottom: var(--rule-ink-heavy); white-space: nowrap; }
  td { padding: var(--table-row-pad-y) var(--table-cell-pad-x); border-top: var(--rule-soft);
       font-size: var(--text-base); line-height: var(--leading-snug); vertical-align: middle; }
  tbody tr:first-child td { border-top: none; }
  tbody tr:hover { background: var(--surface-sunken); }
  td.m, th.m { font-family: var(--font-mono); font-size: var(--text-sm); }
  td.num { text-align: right; font-family: var(--font-mono); font-size: var(--text-sm); }

  /* stat strip */
  .stats { display: flex; background: var(--surface); border: var(--rule); }
  .stat { padding: var(--space-4) var(--space-5); flex: 1; border-left: var(--rule-soft); }
  .stat:first-child { border-left: none; }
  .stat .v { font: var(--weight-semibold) var(--text-2xl)/var(--leading-tight) var(--font-mono); color: var(--ink); margin-top: var(--space-2); }
  .stat .v.danger { color: var(--danger); }
  .stat .d { font: var(--weight-medium) var(--text-xs)/1.2 var(--font-mono); margin-top: var(--space-1); }
  .up { color: var(--danger); } .down { color: var(--ok); } .flat { color: var(--text-muted); }

  /* severity + tags */
  .sev { display: inline-block; padding: 2px 6px; color: #fff;
         font: var(--weight-semibold) var(--text-2xs)/1.4 var(--font-mono);
         text-transform: uppercase; letter-spacing: var(--tracking-label); }
  .sev.critical { background: var(--sev-critical); }
  .sev.high     { background: var(--sev-high); }
  .sev.medium   { background: var(--sev-medium); color: var(--sev-medium-text); }
  .sev.low      { background: var(--sev-low); }
  .sev.info     { background: var(--sev-info); }

  .tag { display: inline-block; padding: 1px 6px; border: var(--rule);
         font: var(--weight-medium) var(--text-2xs)/1.5 var(--font-mono);
         text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-muted); }
  .tag.owned { border-color: var(--border-ink); color: var(--ink); }
  .tag.third { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }

  /* exposure state pills */
  .st { display: inline-block; padding: 1px 6px;
        font: var(--weight-semibold) var(--text-2xs)/1.5 var(--font-mono);
        text-transform: uppercase; letter-spacing: var(--tracking-label); }
  .st.exposed      { background: var(--danger); color: #fff; }
  .st.firewalled   { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
  .st.internal     { background: var(--surface-sunken); color: var(--text-muted); border: var(--rule); }
  .st.edge         { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .st.unreachable  { background: transparent; color: var(--text-faint); border: 1px dashed var(--border); }

  /* change verbs */
  .verb { display: inline-block; min-width: 78px; padding: 1px 6px;
          font: var(--weight-semibold) var(--text-2xs)/1.5 var(--font-mono);
          text-transform: uppercase; letter-spacing: var(--tracking-label); }
  .verb.appeared    { background: var(--ink); color: var(--text-on-ink); }
  .verb.disappeared { background: transparent; color: var(--text-muted); border: 1px dashed var(--border); }
  .verb.changed     { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }

  /* ink panel — evidence / citation blocks */
  .ink { background: var(--surface-ink); color: var(--text-on-ink); border: var(--rule-ink);
         padding: var(--space-3) var(--space-4); font-family: var(--font-mono); font-size: var(--text-sm);
         line-height: var(--leading-snug); }
  .ink .k { color: #9a9a90; }

  /* empty state */
  .empty { background: var(--surface); border: var(--rule); padding: var(--space-12) var(--space-8);
           text-align: center; }
  .empty h2 { margin: 0 0 var(--space-2); font-size: var(--text-xl); font-weight: var(--weight-semibold);
              letter-spacing: var(--tracking-tight); }
  .empty p { margin: 0 auto var(--space-6); max-width: 520px; color: var(--text-muted); }
  .empty .acts { display: flex; gap: var(--space-2); justify-content: center; }

  /* callout — the scope-completeness warning */
  .warn-box { border: var(--rule-ink); background: var(--warn-soft); padding: var(--space-3) var(--space-4);
              display: flex; gap: var(--space-3); align-items: flex-start; }
  .warn-box .body { font-size: var(--text-base); line-height: var(--leading-body); }

  .row { display: flex; gap: var(--space-4); }
  .col { flex: 1; min-width: 0; }
  .stack > * + * { margin-top: var(--space-4); }
  .toolbar { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4);
             border-bottom: var(--rule); background: var(--surface); }
  .input { height: var(--control-h-sm); padding: 0 var(--space-2); border: var(--rule);
           background: var(--surface); font: 400 var(--text-sm)/1 var(--font-mono); border-radius: var(--radius); }
  h1.page { margin: 0 0 var(--space-1); font-size: var(--text-xl); font-weight: var(--weight-semibold);
            letter-spacing: var(--tracking-tight); }
  .sub { font-size: var(--text-base); color: var(--text-muted); margin-bottom: var(--space-5); }

  footer.ft { border-top: var(--rule); background: var(--surface); }
  .ft-in { max-width: var(--page-max); margin: 0 auto; padding: var(--space-4) var(--page-pad);
           display: flex; align-items: center; gap: var(--space-4);
           font: 400 var(--text-xs)/1.2 var(--font-mono); color: var(--text-muted); }
  .ft-in .sp { margin-left: auto; }

  /* ── the switcher: deliberately NOT part of the design being judged ── */
  #switch { position: fixed; left: 50%; bottom: var(--space-6); transform: translateX(-50%);
            z-index: 99; display: flex; align-items: stretch;
            background: var(--ink); border: var(--rule-ink); box-shadow: var(--shadow-hard); }
  #switch button { background: transparent; border: none; color: var(--text-on-ink); cursor: pointer;
                   font: var(--weight-semibold) var(--text-base)/1 var(--font-mono); padding: 0 var(--space-3); }
  #switch button:hover { background: #3a3a30; }
  #switch .lbl { padding: var(--space-2) var(--space-4); color: var(--text-on-ink); white-space: nowrap;
                 font: var(--weight-medium) var(--text-sm)/1.5 var(--font-mono);
                 border-left: 1px solid #3a3a30; border-right: 1px solid #3a3a30; }
  #switch .lbl b { font-weight: var(--weight-semibold); }
  #switch .st-toggle { padding: 0 var(--space-3); display: flex; align-items: center; gap: var(--space-2);
                       border-left: 1px solid #3a3a30; }
  #switch .st-toggle span { color: #9a9a90; font: var(--weight-semibold) var(--text-2xs)/1 var(--font-mono);
                            text-transform: uppercase; letter-spacing: var(--tracking-label); }
  #switch .st-toggle button { padding: 4px 8px; color: #9a9a90; font-size: var(--text-2xs);
                              text-transform: uppercase; letter-spacing: var(--tracking-label); }
  #switch .st-toggle button.on { background: var(--paper); color: var(--ink); }

  /* ── THE DATELINE — ADR-0075 (#131), applied by #144 ──────────────────
     prototypes/seeds/'s dashed accent annotation box, already declared "not
     part of the design". No new token. */
  .anno { border: 1px dashed var(--accent); background: var(--accent-soft);
          padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5);
          font-size: var(--text-sm); line-height: var(--leading-body); max-width: 92ch; }
  .anno .ml { display: block; margin-bottom: var(--space-2); color: var(--accent); }
  .anno.no { border-color: var(--danger); background: var(--danger-soft); }
  .anno.no .ml { color: var(--danger); }
  .anno p { margin: 0 0 var(--space-2); }
  .anno p:last-child { margin-bottom: 0; }
  .anno code { font-family: var(--font-mono); font-size: var(--text-sm); }
</style>
</head>
<body>

<div id="app"></div>

<div id="switch">
  <button id="prev" title="Previous variant (←)">←</button>
  <div class="lbl"><b id="vkey">A</b> — <span id="vname"></span></div>
  <button id="next" title="Next variant (→)">→</button>
  <div class="st-toggle">
    <span>day</span>
    <button data-state="populated">populated</button>
    <button data-state="empty">one</button>
  </div>
</div>

<script>
/* ─────────────────────────── fake estate ───────────────────────────
   Vocabulary is CONTEXT.md: Seed, Name, Address, Service, Endpoint,

const NAV_ON  = (l) => `<a href="#" class="on">${l}</a>`;
const NAV_OFF = (l) => `<a href="#">${l}</a>`;

function chrome(items, body, empty) {
  const status = empty
    ? `<span class="status" style="color:var(--text-muted)"><span class="dot" style="background:var(--text-faint)"></span>no batches yet</span>`
    : `<span class="status"><span class="dot live"></span>batch b-8851 running</span>`;
  return `
  <header class="nav"><div class="nav-in">
    <div class="wordmark"><b>Verge</b><span class="chip">ASM</span></div>
    <nav class="items">${items.map((it,i) => i===0 ? NAV_ON(it) : NAV_OFF(it)).join("")}</nav>
    <div class="nav-right">
      ${status}
      <button class="btn sm"${empty ? ` disabled style="opacity:.45"` : ``}>Run scan</button>
    </div>
  </div></header>
  <main class="shell">${dateline()}${body}</main>
  <footer class="ft"><div class="ft-in">
    <span>v0.9.2</span><span>AGPL-3.0</span><span>self-hosted</span>
    <span class="sp"></span><span>★ Star on GitHub</span><span>Report an issue</span>
  </div></footer>`;
}

/* ── THE DATELINE — ADR-0075 (#131), applied by #144 ────────────────────────
   A prototype is a dated record of a READING, never of a RULE. The provenance
   has to be in what the browser DRAWS: every recorded instance of a prototype
   being wrongly believed happened in a browser, where an HTML comment is
   invisible. Drawn on every variant, because every variant is a reading. */
function dateline() {
  return `
  <div class="anno">
    <span class="ml">prototype · not part of the design</span>
    <p><b>Issue #10 — "Core UI screens and the landing view". Drawn 2026-08-13.</b> Throwaway:
      something to decide against, not production UI and not a component library.</p>
    <p><b>Every quantity on these screens is a dated reading, not a current value</b> — the corpus
      as it stood on that date, and nothing here has been re-filled since. The only live absolutes
      are the map's <code>THE CURRENT COMPOSED STATE</code> line (issue #1, <i>Notes</i>): read a
      figure there before believing one here. What is <i>not</i> a dated reading is the state these
      screens draw — the acts they offer, the populations they show as non-empty and the sentences
      they put in the product's mouth. A later ruling that makes one of those unreachable is marked
      here in place and never redrawn.</p>
  </div>`;
}

const sigTags = (sigs) => sigs.length
  ? sigs.map(([s,n]) => `<span class="sev ${s}">${s}</span> <span class="mono">${n}</span>`).join("<br>")
  : `<span class="faint mono">—</span>`;

const ownTag = (o) => o === "owned"       ? `<span class="tag owned">owned</span>`
                    : o === "third-party" ? `<span class="tag third">third-party</span>`
                                          : `<span class="tag">unknown</span>`;

const stPill = (s) => `<span class="st ${s}">${DATA.matrix.label[s]}</span>`;

/* ══════════════════════════════════════════════════════════════════════

   "Here is everything you own." The estate is the object; change is a

   ══════════════════════════════════════════════════════════════════════ */

  name: "Inventory first",
  nav: ["Inventory","Changes","Signals","Seeds","Settings"],
  populated() {
    return `

/* ─────────────────────────── switcher ─────────────────────────── */
const VARIANTS = { A, B, C };
const KEYS = ["A","B","C"];

function params() {
  const p = new URLSearchParams(location.search);
  const v = (p.get("variant") || "A").toUpperCase();
  return { v: KEYS.includes(v) ? v : "A", s: p.get("state") === "empty" ? "empty" : "populated" };
}
function go(v, s) {
  const p = new URLSearchParams();
  p.set("variant", v); p.set("state", s);
  history.replaceState(null, "", "?" + p.toString());
  render();
}
function render() {
  const { v, s } = params();
  const V = VARIANTS[v];
  const empty = s === "empty";
  document.getElementById("app").innerHTML = chrome(V.nav, empty ? V.empty() : V.populated(), empty);
  document.getElementById("vkey").textContent = v;
  document.getElementById("vname").textContent = V.name;
  document.querySelectorAll("#switch .st-toggle button").forEach(b =>
    b.classList.toggle("on", b.dataset.state === s));
}
const cycle = (d) => { const { v, s } = params();
  go(KEYS[(KEYS.indexOf(v) + d + KEYS.length) % KEYS.length], s); };

document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.querySelectorAll("#switch .st-toggle button").forEach(b =>
  b.onclick = () => go(params().v, b.dataset.state));
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
