  a subject's rules and its closed timelines." Not production code and not a component library.

  URL: ?key=<one of the seven below>          (also settable from the floating switcher / ←→)

    api.example.com          a live Name, baseline — two in-domain rules, an undatable DNS pair
    ci.example.com           a live Name whose own resolution fires a rule

    legacy.example.com       a WITHDRAWN Name — closed timelines, and a rule frozen at its last

  THE QUESTION (#161): what does a single subject's page render? Named in #10's brief, cited by
  #74 decision 7 as where a row's key link lands, never drawn.

  CARRIED, not re-derived:
    - it is the only surface holding both a subject's RULES and its CLOSED timelines (ADR-0072)
    - a withdrawn subject still has one, reached by key, and nothing on it is current state (ADR-0082)
    - "why is this here" is answerable for every subject by walking Citation back to a Seed or a
      declared source (#10)
    - a Gap cell shows its cause with the prior reading demoted beneath it; a census row shows the
      last known outcome with an as-of — #118 read these as two objects, and this page is the first
      one, not the second (old.example.com is the worked example)
    - no per-row control anywhere; the floor and undatable-pair obligations both bind (ADR-0075's
      dateline binds too)

  the seven keys share names with prototypes/subjects/index.html's #122 fixture on purpose — this

function params() {
  const p = new URLSearchParams(location.search);
  const k = p.get("key");
  return { key: KEYS.includes(k) ? k : KEYS[0] };
}
function go(next) {
  const s = { ...params(), ...next };
  history.replaceState(null, "", "?" + new URLSearchParams(s).toString());
  render();
}

/* ------------------------------------------------------------------ helpers */
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function anno(label, html, bad) {
  return `<div class="anno${bad ? " no" : ""}"><span class="ml">${label}</span>${html}</div>`;
}
function tagFor(member) {
  if (member === "fired")        return `<span class="tag bad">fired</span>`;
  if (member === "did-not-fire") return `<span class="tag">did not fire</span>`;
  if (member === "not-evaluable") return `<span class="tag warn">not-evaluable</span>`;
  return `<span class="tag gone">${esc(member)}</span>`;
}

      { who: "restated", label: "198.51.100.202's own citation (ADR-0031)", detail: "a Service's membership is its Address's membership restated — this is not a new membership event" },
    ],
    citationHistorical: true,
    timelines: [
      { facet: "reachability (internet leg)", state: "gap", cause: "a closed custody gate",
        prior: "last read reached · 2026-06-20 04:07",
        cites: "sensitive-port-reached-from-internet already reports this address below — no second fault is raised here" },
    ],
    rules: [
      { name: "sensitive-port-reached-from-internet", member: "not-evaluable",
        note: "fired until 2026-06-22, then the evidence aged past currency as the gate stayed shut — the coverage-class move is fired → not-evaluable, fired at the cause" },
    ],
    rulesTotal: 17,
    calloutAged: true,
  },
};

/* ------------------------------------------------------------------ chrome */

/* ADR-0075: a prototype is a dated record of a READING, never of a RULE. */
function dateline() {
  return anno("prototype · not part of the design", `
    <p><b>Issue #161 — a subject's own page. Drawn 2026-08-15.</b> Throwaway: something to decide
    against, not production UI and not a component library.</p>
    <p><b>Every quantity on these screens is a dated reading, not a current value</b> — the corpus
    as it stood on that date, and nothing here has been re-filled since. The only live absolutes
    are the map's <code>THE CURRENT COMPOSED STATE</code> line (issue #1, <i>Notes</i>): read a
    figure there before believing one here. What is <i>not</i> a dated reading is the state these
    screens draw — the acts they offer, the populations they show as non-empty and the sentences
    they put in the product's mouth. A later ruling that makes one of those unreachable is marked
    here in place and never redrawn.</p>`);
}

function chrome(body) {
  return `
  <header class="nav"><div class="nav-in">
    <span class="wordmark"><b>Verge</b><span class="chip">ASM</span></span>
    <nav class="items">
      <a href="#">Exposure</a><a href="#" class="on">Subjects</a><a href="#">Signals</a>
      <a href="#">Seeds</a><a href="#">Coverage</a><a href="#">Settings</a>
    </nav>
    <span class="nav-right"><span class="status"><span class="dot live"></span>batch 04:07</span></span>
  </div></header>
  <div class="shell">${dateline()}
    <div class="crumb"><a href="index.html">Subjects</a><span class="muted"> / a row's key link lands here</span></div>
    ${body}
  </div>
  <footer class="ft"><div class="ft-in">
    <span>PROTOTYPE — issue #161</span><span>invented estate, every count computed</span>
    <span>design system: visual layer canonical, vocabulary is CONTEXT.md's</span>
  </div></footer>`;
}

/* ------------------------------------------------------------------ page pieces */

function chain(hops, historical) {
  const html = hops.map((h, i) => `
    <div class="hop${h.terminal ? " terminal" : ""}">
      <span class="hopwho">${esc(h.who)}</span>
      <span class="hoplabel">${esc(h.label)}</span>
      <span class="hopdetail">${esc(h.detail)}</span>
    </div>${i < hops.length - 1 ? `<div class="hoparrow">↓</div>` : ""}`).join("");
  return `<div class="chain${historical ? " historical" : ""}">${html}</div>`;
}

function timelineTable(rows) {
  const trs = rows.map(r => {
    let cell;
    if (r.state === "value") {
      cell = `<td class="m">${esc(r.value)}${r.note ? `<span class="rowsub">${esc(r.note)}</span>` : ""}</td>`;
    } else if (r.state === "gap") {
      cell = `<td class="gapcell"><span class="cause">${esc(r.cause)}</span>
                <span class="prior">${esc(r.prior)}</span>
                ${r.cites ? `<span class="prior">${esc(r.cites)}</span>` : ""}</td>`;
    } else if (r.state === "closed") {
      cell = `<td class="closedcell"><span class="cause">closed · ${esc(r.reason)}</span>
                <span class="last">${esc(r.last)}</span></td>`;
    } else if (r.state === "undatable") {
      cell = `<td class="undatecell"><span class="move">${esc(r.before)} → ${esc(r.after)}</span>
                <span class="undate">undatable — a Gap sits between them</span>
                <span class="rowsub">${esc(r.note)}</span></td>`;
    } else {
      cell = `<td class="muted">${esc(r.note || "")}</td>`;
    }
    const since = r.since ? (r.floor ? `≥ ${esc(r.since)} <span class="faint">(floor)</span>` : esc(r.since)) : `<span class="faint">—</span>`;
    return `<tr><td class="mono">${esc(r.facet)}</td>${cell}<td class="num muted">${since}</td></tr>`;
  }).join("");
  return `<table><thead><tr><th>Facet</th><th>Reading</th><th class="num">Since</th></tr></thead><tbody>${trs}</tbody></table>`;
}

function rulesTable(subj) {
  if (!subj.rules.length) {
    return `<div class="pad"><div class="empty">
      <span class="ml">No rule reads this subject directly</span>
      <p>No v1 signal is named for a fact about a bare <code>Address</code> — every rule below a TCP
      connect is scoped to a <code>Service</code>, and the DNS rules are scoped to a <code>Name</code>.
      This is not an omission: an <code>Address</code>'s own <code>Predicate domain</code> is empty by
      construction, and an empty domain renders as a no-population panel rather than as a row for every
      rule that does not apply.</p>
      ${subj.childService ? `<p>The rule that reads this address's exposed port lives on
        <a href="?key=${encodeURIComponent(subj.childService)}">${esc(subj.childService)}</a> —
        its own subject, one hop down.</p>` : ""}
    </div></div>`;
  }
  const trs = subj.rules.map(r => `
    <tr><td class="rulename">${esc(r.name)}</td>
        <td>${tagFor(r.member)}${r.frozen ? ` <span class="tag gone">frozen</span>` : ""}</td>
        <td class="muted">${esc(r.note || "")}</td></tr>`).join("");
  return `<table><thead><tr><th>Rule</th><th>Member</th><th>Evidence</th></tr></thead><tbody>${trs}</tbody></table>`;
}

/* ------------------------------------------------------------------ page */

function page(key) {
  const s = SUBJECTS[key];
  const withdrawn = s.status === "withdrawn";

  let out = `
    <div class="subhead">
      <div>
        <span class="k">${esc(key)}</span>
        <div class="kindrow">
          <span class="tag blue">${esc(s.kind)}</span>
          ${withdrawn ? `<span class="tag gone">withdrawn</span>` : `<span class="tag ok">live</span>`}
          ${s.custody ? `<span class="tag${s.custody.startsWith("third-party") ? "" : " blue"}">${esc(s.custody)}</span>` : ""}
        </div>
      </div>
      <div class="asof">
        ${withdrawn
          ? `<span class="v">left ${esc(s.left)}${s.leftFloor ? " (floor)" : ""}</span><span class="ml">no open span</span>`
          : `<span class="v">as of ${esc(s.instant)}</span><span class="ml">the open span · not a comparison</span>`}
      </div>
    </div>`;

  if (withdrawn) {
    out += `<div class="banner"><span class="ml">withdrawn</span>
      <p><b>This subject withdrew on ${esc(s.left)}.</b> ${esc(s.how)}. Its timelines are closed —
      not held open and aged, closed — and the period since carries no value and no Gap; it is on no
      timeline at all (ADR-0082). Nothing below is current state. It is reachable only because you
      have its key.</p></div>`;
  }

  out += `<div class="card"><div class="card-h"><h2>Why is this here</h2>
    <span class="hint">walking Citation back to a Seed or a declared source (#10)</span></div>
    ${chain(s.citation, s.citationHistorical || withdrawn)}
    ${s.citationHistorical ? `<div class="card-f">This chain restates another subject's own citation
      rather than adding a new hop, per ADR-0031: a <code>Service</code>'s membership is its
      <code>Address</code>'s restated, so it has no root of its own.</div>` : ""}
    ${withdrawn ? `<div class="card-f">Shown for provenance. It no longer admits anything — the
      subject it named is gone, and this is a record of why it was once here, not a claim that it
      still is.</div>` : ""}
  </div>`;

  out += `<div class="card"><div class="card-h"><h2>${withdrawn ? "Closed timelines" : "Timelines"}</h2>
    <span class="hint">${withdrawn ? "every timeline this subject held, closed at every key" : "one row per facet this subject holds"}</span></div>
    ${timelineTable(s.timelines)}
    <div class="card-f"><b>Since</b> declares itself a floor wherever the membership timeline
    composes a <code>Derivation</code> vector a release could <code>Break</code>. A
    <code>Seed</code>-covered <code>Address</code> composes nothing at all, so its date would be
    exact on this same column.</div>
  </div>`;

  out += `<div class="card"><div class="card-h"><h2>Rules</h2>
    <span class="hint">${s.rules.length} of ${s.rulesTotal} v1 rules read this subject${withdrawn ? " · frozen at the last instant that touched it" : ""}</span></div>
    ${rulesTable(s)}
    ${withdrawn && s.rules.length ? `<div class="card-f"><b>Frozen, not recomputed.</b> A
      <code>Signal</code>'s lifecycle is its evidence's, never its subject's membership — so a rule
      whose evidence was current when this subject last held a span keeps its verdict here. Nothing
      will ever evaluate this subject again, so this page renders it as of that last instant rather
      than pretending to read it live.</div>` : ""}
  </div>`;

  /* --- per-key annotations, argued and ruled ------------------------------------------------ */
  if (s.calloutGap) out += anno("the Gap cell and the census row are two objects, not one (#118)", `
    <p><code>old.example.com</code>'s <code>resolution</code> cell above states its cause and demotes
    the prior reading beneath it — the <b>cell</b> treatment. The census row for
    <code>lame-delegation</code> on <code>Signals</code> would instead show the last known outcome
    with an as-of. Both are true at once and neither substitutes for the other: the cell is <i>what
    happened to this subject's resolution</i>, the census row is <i>what this rule concludes about
    the estate right now</i>. This page renders the first. It never re-derives the second, and the
    <code>cites the rule already reporting it</code> line under the cell is the seam between them —
    it names <code>lame-delegation</code> rather than raising a second fault, and the Rules section
    below is where that naming resolves.</p>`);

  if (s.calloutWithdrawn) out += anno("argued: recompute live, hide, or freeze — this rules FREEZE", `
    <p><b>Recompute against today's currency bound.</b> Rejected. The evidence is six weeks stale by
    today, so a live recompute would silently read <code>not-evaluable</code> and erase the fact that
    a real rule fired on real evidence before this subject left — which is exactly the information
    <code>ADR-0072</code> says this page exists to carry, since the board's <code>withdrawn</code>
    column carries only the comparison window and not the story.</p>
    <p><b>Hide the Rules section entirely once withdrawn.</b> Rejected on the same ground as an empty
    <code>Predicate domain</code> rendering as a no-population panel rather than nothing: a withdrawn
    subject is not an <i>outside-the-domain</i> subject, and hiding a section that has content is a
    stronger claim than not drawing an empty one.</p>
    <p><b>Freeze at the last instant that touched it — the ruling.</b> Precedent already exists one
    level up: #74 decision 5 renders a census member view "at the evaluation instant of the census it
    came from, never one of its own." The same discipline applied to a single subject is to state the
    instant and stop, which is what the <code>frozen</code> tag and the card footer above do.</p>`);

  if (s.calloutNoRules) out += anno("argued: roll up the descendant Services' rules onto the Address, or leave it empty — this rules EMPTY", `
    <p><b>Roll up every <code>Service</code> beneath this address into a summary here</b> — "1 of 1
    exposed ports fires <code>sensitive-port-reached-from-internet</code>." Rejected on #74's own
    finding against roll-ups: composed drawn, a roll-up "does not render the member at all" — the
    subjects are gone and the count's basis is not shown — and it manufactures a second, unversioned
    population the same way a screen-side filter would (ADR-0024). It would also duplicate content
    that already has an honest home: the <code>Service</code>'s own page, one hop down.</p>
    <p><b>Leave it empty and point down — the ruling.</b> An <code>Address</code>'s
    <code>Predicate domain</code> is empty for every v1 rule, structurally, so the empty state is not
    a gap in this page — it is the correct answer, rendered the same way an empty domain renders
    everywhere else in the product: a stated reason, never a bare blank.</p>`);

  if (s.calloutHeld) out += anno("held: the port did not close, only the licence to look did (#118)", `
    <p>The custody extension over <code>198.51.100.201</code> was withdrawn 2026-08-13, two days
    before this reading. The reachability timeline is still current — the gate stopped feeding it,
    it did not blank it — so <code>sensitive-port-reached-from-internet</code> keeps firing beside
    the <code>third-party</code> marker for exactly as long as the value is held: 2 cadences, 2 days
    on the daily <code>Scan</code>. Compare <code>198.51.100.202:22/tcp</code>, the same shape one
    step further on.</p>`);

  if (s.calloutAged) out += anno("aged: the same Service, past the retention window", `
    <p>Same shape as <code>198.51.100.201:22/tcp</code>, gate closed 2026-06-20 instead of
    2026-08-13 — well past the 2-day hold. The reachability cell has aged to a <code>Gap</code>
    naming <code>a closed custody gate</code>, never a fault band and never a countdown: nothing
    failed, and a deadline would imply an act available before it that the operator does not have
    (#118 §4, rejected treatment R1). The Rules row moved with it: <code>fired</code> →
    <code>not-evaluable</code>, a coverage-class move fired at the cause rather than a silent
    disappearance.</p>`);

  return out;
}

/* ------------------------------------------------------------------ render */
function render() {
  const p = params();
  document.getElementById("app").innerHTML = chrome(page(p.key));

  const sw = document.getElementById("switch");
  sw.innerHTML = `<span>key</span>` + KEYS.map(k =>
    `<button data-k="${esc(k)}" class="${k === p.key ? "on" : ""}">${esc(k)}</button>`).join("");
  sw.querySelectorAll("button").forEach(b => b.onclick = () => go({ key: b.dataset.k }));
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='?key=']");
  if (!a) return;
  e.preventDefault();
  go({ key: new URLSearchParams(a.getAttribute("href").slice(1)).get("key") });
});

document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const p = params();
  const i = KEYS.indexOf(p.key);
  const j = (i + (e.key === "ArrowRight" ? 1 : KEYS.length - 1)) % KEYS.length;
  go({ key: KEYS[j] });
});

render();
</script>
</body>
</html>
