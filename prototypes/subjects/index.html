<!--
  PROTOTYPE — throwaway. Issue #122, "The Subjects screen: which populations render alongside the
  living?" Not production code and not a component library.

  URL:  ?screen=subjects|search|vsmember|cells
          &variant=A|B|C                                  (screen=subjects only)
          &fill=estate|custodyless|declared               (screen=subjects, variant=C only)

  Arrow keys step the variant on ?screen=subjects; the floating bar switches everything.

  THE QUESTION
    Which populations render alongside the living, and which can be listed without a comparison
    at all? Plus #74's question nobody had asked: what distinguishes a rule's census member list
    from `Subjects` filtered by that rule, given both are lists of bare subjects.

  THE SIX ABSENCE POPULATIONS the map's fog patch handed this screen (#42, every `Gap` states
  its cause):
      withdrawn · `Shadowed` · we never looked · we stopped looking · you stopped answering ·
      a closed custody gate
  Five of them are CELL states on a living row. One — withdrawn — is a population, and it is
  the only one that cannot be read off current state. ?screen=cells draws all six.

  CARRIED, not re-derived:
    - every duration and count must be able to declare itself a floor (#18, #28)
    - a value arriving after a `Gap` cannot be dated (#42 / ADR-0014)
    - rendering the custody extension here as a `custody: operator` filter is WRONG (#51)
    - no per-row controls, ever, or this is ADR-0002's rejected approval queue (#51, #74)
    - a row's subject is a link and a link is not a control (#74 decision 7)
    - only two of the four subjects can be a root (ADR-0031)

  FIXTURE WARNING. The estate below is invented for this prototype and every count on screen is
  computed from it (`list.length`), never authored. No figure is copied from another prototype:
  #72's 412/403, #74's 2,904/3,204 and #44's 616/409 are that session's fixtures and two of them
  were superseded by #118. Nothing here restates the map's composed state either.

  Annotations in a dashed box marked PROTOTYPE NOTE are commentary for the reviewer and are not
  part of the design.
-->

<script>
/* ------------------------------------------------------------------ routing */
const SCREENS  = ["subjects", "search", "vsmember", "cells"];
const VARIANTS = ["A", "B", "C"];
const FILLS    = ["estate", "custodyless", "declared"];

function params() {
  const p = new URLSearchParams(location.search);
  const g = (k, list, d) => { const v = p.get(k); return list.includes(v) ? v : d; };
  return {
    screen:  g("screen",  SCREENS,  "subjects"),
    variant: g("variant", VARIANTS, "C"),
    fill:    g("fill",    FILLS,    "estate"),
  };
}
function go(next) {
  const s = { ...params(), ...next };
  history.replaceState(null, "", "?" + new URLSearchParams(s).toString());
  render();
}

/* ------------------------------------------------------------------ helpers */
const n   = x => x.toLocaleString("en-GB");
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const mo  = s => `<span class="mono">${esc(s)}</span>`;
function anno(label, html, bad) {
  return `<div class="anno${bad ? " no" : ""}"><span class="ml">${label}</span>${html}</div>`;
}

/* ==================================================================== FIXTURE

   An invented estate. Every count printed anywhere on this prototype is computed from these
   arrays — nothing is authored as a number. That is #28's rule ("a census is derived from its
   own partition") and #74's ("every census scalar is list.length") implemented rather than
   described, and it is also this ticket's central argument standing up in code: a list that
   states a denominator has to be able to produce it.

   Chosen to exercise all six absence populations at once, plus the two presentational
   obligations and the disjunctive Address membership limbs (ADR-0047).
------------------------------------------------------------------------------- */

const TODAY = "2026-08-15";

/* --- Names. `state` is the row's own membership; `cells` are per-facet. -------------------- */
const NAMES = [

    cite: "seed example.com · declared 2026-06-02",

    res: { v: "Resolved · 3 addresses", note: "18.164.52.11 · .72 · .140" } },

    cite: "zone file example.com.zone · supplied 2026-06-04",
    since: "2026-06-04", sinceFloor: true,
    res: { v: "Resolved · 1 address", note: "203.0.113.44" } },

    cite: "zone file example.com.zone · supplied 2026-06-04",
    since: "2026-06-04", sinceFloor: true,

    cite: "resolution-walk under example.com · 2026-08-15 04:07",
    since: "2026-07-19", sinceFloor: false,
    res: { v: "Resolved · 2 addresses", note: "via stspg-customer.com" } },

  /* --- absence population 2: `Shadowed`. A value, not a Gap — and the one absence that is a
         statement about MEMBERSHIP while the subject is alive. ------------------------------ */

    cite: "crt.sh · 2026-07-28",
    since: "2026-07-28", sinceFloor: false,
    res: { v: "Shadowed", shadow: true,
           note: "the authority answers every label beneath its parent — the control probe could not tell this name's answer from a synthesised one" },
    membershipNote: "cannot be measured absent · supply coverage or exclude it" },

  /* --- absence population 5: you stopped answering (#35's lame delegation) ------------------ */
  { k: "old.example.com",    state: "live",
    cite: "zone file example.com.zone · supplied 2026-06-04",
    since: "2026-06-04", sinceFloor: true,
    res: { gap: true, cause: "you stopped answering",

           extra: "every authority for old.example.com was reached and none serves the zone — lame-delegation is firing on this name" } },

/* --- Service and Endpoint: derived populations, never listed as peers (ADR-0031) ----------- */
const TCP_PAIRS_IN_SCOPE = 131;               /* verge-core's TCP half; UDP is outside v1's aperture */
const SERVICE_COUNT  = ADDR_TOTAL * TCP_PAIRS_IN_SCOPE;
const ENDPOINT_COUNT = 46;                    /* fixture */
/* What variant A's header would have to say if all four kinds were peers. Two of the four terms
   are the other two's membership restated, which is the whole objection. */
const FLAT_TOTAL = NAMES.length + ADDR_TOTAL + SERVICE_COUNT + ENDPOINT_COUNT;

/* --- The rule used for the side-by-side. Subject is the `Name` (ADR-0071 / #128). ---------- */
const RULE = {
  name: "non-globally-reachable-address-resolved-from-internet",
  gloss: "fires where the address's most specific IANA special-purpose allocation is marked not globally reachable",
  domainWords: "Names whose internet-class resolution holds an answer — Resolved or Shadowed",
  instant: "2026-08-15 04:07",
  leaf: "resolution-walk v4 · availability v2",
};
const liveNames = () => NAMES.filter(x => x.state === "live");
const goneNames = () => NAMES.filter(x => x.state === "withdrawn");

/* The census, computed. A name is:
     outside the domain — resolution holds no answer at all (Lame)
     not-evaluable      — Shadowed, or a Gap where the answer would be
     fired / did not fire otherwise                                                            */
function census() {
  const outside = [], ne = [], fired = [], notFired = [];
  for (const x of liveNames()) {
    if (x.res.gap && x.res.cause === "you stopped answering") { outside.push(x); continue; }
    if (x.res.gap)     { ne.push(x); continue; }
    if (x.res.shadow)  { ne.push(x); continue; }
    if (x.fires)       { fired.push(x); continue; }
    notFired.push(x);
  }
  return { outside, ne, fired, notFired, domain: ne.length + fired.length + notFired.length };
}

  rows.push({ kind: "Service", k: "203.0.113.17:80/tcp",  state: "live", why: "" });

      <code>Endpoint</code>'s is two subjects' restated (ADR-0031). And a subject in two absences

        detection exists in this scope at all.</p></div></div>
    </div>

    <div class="card">
      <div class="card-h"><h3>Addresses</h3>
        <span class="hint">${n(SCOPE_SIZE)} from the declaration · ${n(SCOPE_SIZE)} holding
        <code>not-reached</code></span></div>
      <table><thead><tr><th>Address</th><th>Custody</th><th>Reach</th></tr></thead>
        <tbody>${ADDR_SCOPE_SAMPLE.map(a => `<tr>
          <td><a class="k" href="#">${esc(a.k)}</a><span class="rowsub cite">${esc(a.cite)}</span></td>
          <td><span class="tag blue">operator</span></td>
          <td class="m">not-reached<span class="rowsub">a measured value from the declaration, not a
            gap and not nothing at all</span></td></tr>`).join("")}
        <tr><td colspan="3" class="muted">… and ${n(SCOPE_SIZE - ADDR_SCOPE_SAMPLE.length)} more</td></tr>
        </tbody></table>
      <div class="card-f">This is the one place in the product where a subject exists and a
      measurement does not, and it is deliberate: the declaration <i>is</i> the enumeration
      (ADR-0047), so the coverage denominator for this scope is ${n(SCOPE_SIZE)} from the moment it
      was typed.</div>
    </div>`;
}

/* ==================================================================== SCREEN: search ======= */

function screenSearch(p) {
  const gone = goneNames()[0];
  return `
    <h1 class="page">Search — the one lookup that reaches outside the estate</h1>
    <p class="sub">The finding this screen exists for. A list of the living, on its own, manufactures
    a false absence at the search box — and the repair is not a listing.</p>

    ${anno("the defect, drawn", `
      <p>An operator types <code>legacy.example.com</code>. It withdrew on 2026-07-02, measured
      properly: our own resolver got a Name Error from every available vantage. If search runs over
      the estate list, the answer is <b>no results</b>.</p>
      <p><code>No results</code> reads as <i>we have no record of this</i>. The truth is
      <i>we measured it gone, on this date, this way</i>. That is a source erroring and producing an
      observation of absence — the failure the project refuses everywhere else, arriving through a
      text box.</p>`, true)}

    <div class="hit bad">
      <div class="hh"><span class="k">legacy.example.com</span><span class="tag gone">what a living-only search says</span></div>
      <div class="hb"><p class="muted">No results.</p></div>
    </div>

    <div class="inkp">
      <span class="ml">the ruling</span>
      <h3>Search answers over the estate and the withdrawn. The listing is the estate alone.</h3>
      <p>Search takes a <b>key</b> and returns at most one subject, so it is a lookup and not a
      list — no ordering to choose, no length that grows, no partition to state a denominator for.
      That is the whole of why it can safely reach a population a listing may not.</p>
      <p>And it is the only surface that has to: <i>is this still here?</i> is the one question an
      operator brings a key to, and it is unanswerable from a list of what is here.</p>
    </div>

    <div class="hit">
      <div class="hh"><span class="k">${esc(gone.k)}</span><span class="tag gone">withdrawn</span></div>
      <div class="hb">
        <p><b>Withdrawn on ${esc(gone.left)}</b>${gone.leftFloor ? ` <span class="muted">(floor — a
          release moved <code>resolution-walk</code> since, so nothing crosses back past the
          re-baseline)</span>` : ""}.</p>
        <p>${esc(gone.how)}. Nothing left because time passed, and nothing left by a state we
        invented.</p>
        <p class="muted mono">last value: ${esc(gone.lastValue)} · ${esc(gone.cite)}</p>
        <p>Its timelines are closed. It has no current state, so it appears in no count and no list
        on this screen — and if it is ever measured back, it returns as <code>returned</code> and
        the estate list is where you will find it.</p>
      </div>
    </div>

    ${anno("what lost, and it lost on arithmetic", `
      <p><b>A <i>withdrawn</i> listing.</b> The obvious answer, and the one a usability pass will
      propose. It cannot be rendered honestly in any ordering:</p>
      <p>— <b>Ordered by when it left</b>, it is a reverse-chronological feed of change, which is
      #10's rejected variant B rebuilt on the second screen.<br>
      — <b>Ordered by the subject</b>, it is the complete list of everything that has ever left this
      install, which grows monotonically for the instance's whole life and never shrinks. The
      <code>Span</code> corpus is never compacted (ADR-0041), so nothing ever bounds it. That is a
      screen whose length is a function of the install's <b>age</b> — the defect #74 removed from
      <code>Signals</code>, where it was a function of estate size.<br>
      — <b>Truncated</b>, it is #74's refused row threshold, a number on a screen that nothing
      versions.<br>
      — <b>Filtered to the last 30 days</b>, it is a screen-side partition of a population, which is
      ADR-0024's refused object with a date in it instead of a predicate.</p>
      <p><b>Four renderings, four different refusals already on the books.</b> That is what makes
      this a ruling rather than a preference.</p>`)}

    <div class="note">
      <p><b>The operator is not left without a record, and the record is not this screen.</b>
      A withdrawal fires a membership message at the cause, and the message store is written and
      rendered unconditionally — it is not a <code>Channel</code>, has no configuration, cannot be
      disabled and cannot fail. Ordered by time, which is correct for a log and wrong for an
      inventory. The exposure board carries the <code>withdrawn</code> column for the comparison
      window. The subject's own page still exists and renders its closed timelines.</p>
      <p><b>Three carriers, and this ruling leans on the first.</b> If the message store ever
      acquires a retention horizon, the durable record of departures goes with it and this refusal
      needs re-pricing. v1 ships it unbounded, so the debt is not due — but it is named.</p>
    </div>

    ${anno("a second false absence, repaired the same way", `
      <p><code>198.51.100.61</code> is <i>in</i> the estate — it is inside a declared address scope,
      so it is a subject from the declaration — and <code>legacy.example.com</code>, which used to
      resolve there, is not. Searching either key has to say something true about the other, or the
      operator concludes the address left too. The address row carries it as a note; the name's hit
      carries its last value. Neither is a link between two live rows, because one of them is not a
      row.</p>`)}`;
}

/* ============================================================== SCREEN: vsmember =========== */

function screenVsMember(p) {
  const c = census();
  const est = liveNames();

  const memberRows = c.notFired.map(x => `<div class="r">${esc(x.k)}</div>`).join("");
  const estateRows = est.map(x =>
    `<div class="r">${esc(x.k)}<span class="cite">${esc(x.cite)}</span></div>`).join("");

  return `
    <h1 class="page">A census member, and <code>Subjects</code>, side by side</h1>
    <p class="sub">#74's question nobody had asked. Both are lists of bare
    <code>Name</code>s; #74 ruled they may not be the same object and nobody had drawn them
    together. Drawn, five things separate them and two of them are visible from across the room.</p>

    <div class="two">
      <div class="lane">
        <div class="lh">
          <div class="who">Signals → <code>${esc(RULE.name)}</code> → did not fire</div>
          <div class="den"><b>${n(c.notFired.length)}</b> of <b>${n(c.domain)}</b> in the domain ·
            fired ${n(c.fired.length)} · not-evaluable ${n(c.ne.length)}<br>
            as evaluated ${esc(RULE.instant)} · ${esc(RULE.leaf)}</div>
        </div>
        <div class="barestack">${memberRows}</div>
        <div class="lf"><b>Domain:</b> ${esc(RULE.domainWords)}. The rows are bare because the
        evidence is constant across the member — what is the same on every row belongs above them
        (#74 decision 4). No search box: forty rows under a header reading
        <code>${n(c.notFired.length)}</code> would be two numbers over one population disagreeing on
        screen.</div>
      </div>

      <div class="lane">
        <div class="lh">
          <div class="who">Subjects → Names</div>
          <div class="den"><b>${n(est.length)}</b> names<br>
            as of 2026-08-15 04:07 · the open span</div>
        </div>
        <div class="barestack">${estateRows}</div>
        <div class="lf">No denominator, because the estate has none — <i>how many names ought there
        to be</i> is estate completeness, and the operator is the only source for it. A search box
        instead, and every row carries the one thing the member list may never carry: why it is
        here.</div>
      </div>
    </div>

    <table class="disc">
      <thead><tr><th>Discriminator</th><th>A census member</th><th><code>Subjects</code></th></tr></thead>
      <tbody>
        <tr><td>Header</td>
          <td>States a <b>denominator</b> — it is a cell of a stated partition, and its count is the
            length of its own list</td>
          <td>States <b>counts and no denominator</b> — the estate is not a fraction of anything
            measurable</td></tr>
        <tr><td>Search</td>
          <td><b>None, ever.</b> A visible subset under a stated total is two numbers over one
            population (#74 decision 8)</td>
          <td><b>Required.</b> #10 made this screen searchable and complete; with no denominator
            there is no total for a subset to contradict</td></tr>
        <tr><td>Row content</td>
          <td>Bare — and never a <code>Citation</code>. Provenance is constant per seed and says
            nothing about what the rule concluded</td>
          <td><b>Carries the <code>Citation</code></b>. <i>Why is this here</i> is answerable for
            every subject by walking back to a <code>Seed</code>, and it is this screen's job</td></tr>
        <tr><td>Which subject kinds</td>
          <td>Whatever the rule's subject is — including <code>Endpoint</code> and
            <code>Service</code>, which have no listing anywhere else</td>
          <td>Only the two that can be the root of an entering sub-tree (ADR-0031)</td></tr>
        <tr><td>An absent row means</td>
          <td><b>One of three things</b> — not in the estate, outside the domain, or in another
            member. The census states all three, which is why every member is drillable</td>
          <td><b>One thing</b> — it is not in your estate</td></tr>
        <tr><td>Instant</td>
          <td>The evaluation instant of the census it came from, never one of its own</td>
          <td>Now — the open span</td></tr>
        <tr><td>Version</td>
          <td>Inside the rule's leaf; the population <code>Break</code>s when the leaf moves</td>
          <td>None. There is no rule, so there is nothing to version</td></tr>
      </tbody>
    </table>

    ${anno("the arithmetic that proves they are different populations", `
      <p>The estate holds <b>${n(est.length)}</b> living names. The rule's domain holds
      <b>${n(c.domain)}</b>. The difference is <code>${esc(c.outside.map(x => x.k).join(", "))}</code>,
      which is <b>in the estate and outside the rule's domain</b> — its delegation is lame, so it has
      no address set and the question the rule asks does not arise.</p>
      <p>Neither list is a subset of the other in general, either. A member list can hold a subject
      that has withdrawn since the census instant; <code>Subjects</code> cannot hold one at all.</p>`)}

    ${anno("so what is `Subjects` filtered by that rule?", `
      <p><b>There is no such object, and the reason is not fussiness.</b> To filter this screen by a
      rule, the screen would have to evaluate the rule — and a filter on a screen is unversioned by
      construction (ADR-0024), so the same population would exist twice, once inside a leaf that
      <code>Break</code>s and once on a page that does not. The two copies disagree the first time
      the leaf moves and nothing on screen can say why.</p>
      <p><b>The general rule that falls out, and it is the useful part:</b> a filter on
      <code>Subjects</code> is legal exactly where its predicate is a value the row already renders.
      <code>custody</code> is a column, so <code>custody: third-party</code> is a legal filter and
      narrows to rows whose visible cell says so. A rule's verdict is not a column and may not
      become one. That single test also discharges #51's warning without a special case: the custody
      extension's population is <i>addresses a name inside the scope resolves to directly</i>, which
      is not a cell on any row here, and whose honest rendering includes rows this screen does not
      have.</p>`)}`;
}

/* ================================================================= SCREEN: cells =========== */

function screenCells(p) {
  const rows = [
    { pop: "withdrawn", what: "The subject left the estate, measured (ADR-0006). Its timelines are closed.",
      where: "<b>Not a cell and not a row.</b> The only one of the six that is a population, and the only one that cannot be read off current state — there is no open span to read. Reached by key, on search.",
      cmp: "yes" },
    { pop: "<code>Shadowed</code>", what: "The resolution holds a value we cannot discriminate from a synthesised answer.",
      where: "A living row, with a <b>membership</b> annotation: <i>cannot be measured absent · supply coverage or exclude it</i>. The only absence that says something about membership while the subject is alive.",
      cmp: "no" },
    { pop: "we never looked", what: "No vantage of that class was ever configured. The timeline never existed.",
      where: "A cell in the absence treatment, cause stated, and <code>never evaluated · no prior value</code> beneath it. Nothing failed, so no fault keying.",
      cmp: "no" },
    { pop: "we stopped looking", what: "A configured leg went silent — our vantage, our batch, our currency bound, our gate.",
      where: "A cell, cause stated, the last value in the muted role with an explicit as-of, and the fault keying <b>only</b> where something failed.",
      cmp: "no" },
    { pop: "you stopped answering", what: "A lame delegation beneath the operator's own infrastructure (#35).",
      where: "A cell that <b>cites the rule already reporting it</b> rather than raising a second fault. The only one of the six carrying an action the operator can take.",
      cmp: "no" },
    { pop: "a closed custody gate", what: "A withdrawn extension, or a decline carving a confirmed scope.",
      where: "During the retention window: <b>an ordinary current value</b>, with <code>third-party</code> above the table rather than per row, because one act covers every row identically. After it: a cell.",
      cmp: "no" },
  ];

  return `
    <h1 class="page">The six absence populations, sorted</h1>
    <p class="sub">The map's fog patch handed this screen six populations read off one record. Sorted
    by <i>what the absence is an absence of</i>, five of them turn out not to be populations of this
    screen at all.</p>

    <div class="inkp">
      <span class="ml">the cut</span>
      <h3>Absence is a property of a cell, not of a row — and <code>withdrawn</code> is the
      exception, on both halves of the question at once.</h3>
      <p>Five of the six are states of one facet timeline on a subject that is fully alive and
      already in the list. Only <code>withdrawn</code> changes whether a row exists.</p>
      <p>And the ticket's second half has the same answer. A <code>Gap</code> is a span, and it
      records its cause — so every one of the five is read off <b>current state</b>, exactly like the
      living. <code>withdrawn</code> has no open span, so it is found by reading a <b>closed</b> span
      with nothing after it. It is the one population that cannot be listed without a comparison,
      and it is the one population that is not a cell. The two halves of the question cut in the same
      place, which is what makes this a cut rather than two rulings.</p>
    </div>

    <table class="disc">
      <thead><tr><th>Population</th><th>What it is</th><th>How it renders</th><th>Needs history?</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${r.pop}</td><td>${r.what}</td><td>${r.where}</td>
        <td class="m">${r.cmp === "yes" ? "<b>yes</b>" : "no"}</td></tr>`).join("")}</tbody>
    </table>

    ${anno("one correction to the vocabulary the fog handed over", `
      <p>The patch says <i>six populations read off one record, since every <code>Gap</code> states
      its cause</i>. The record is right and the object named is not: <code>Shadowed</code> is
      <b>not a <code>Gap</code></b>. It is a value the model holds on <code>resolution</code>, and
      what is absent is a rule's ability to apply a predicate to it — #44's fourth cause,
      <i>we measured; this rule cannot read the answer</i>, which is a <code>Gap</code> on the
      <b>signal's</b> timeline sitting above a perfectly good value on the facet's.</p>
      <p>The record all six are read off is therefore <b>the open span</b>, not the <code>Gap</code>.
      That is a strictly wider claim and it is the one that makes the ruling work: reading the open
      span is what every living row already does.</p>`)}

    <div class="card">
      <div class="card-h"><h3>Drawn: five cells on rows that are alive</h3></div>
      <table>
        <thead><tr><th>Name</th><th>Resolution</th><th class="num">In the estate since</th></tr></thead>
        <tbody>
          <tr><td><a class="k" href="#">wild.example.com</a>
                <span class="rowsub"><span class="tag warn">cannot be measured absent · supply coverage or exclude it</span></span></td>
              <td><span class="tag warn">Shadowed</span>
                <span class="rowsub">the authority answers every label beneath its parent</span></td>
              <td class="num muted">2026-07-28</td></tr>
          <tr><td><a class="k" href="#">old.example.com</a></td>
              <td class="gapcell"><span class="cause">you stopped answering</span>
                <span class="prior">last read Resolved · 1 address · 2026-08-02 04:07</span>
                <span class="prior">lame-delegation is firing on this name — no second fault is raised here</span></td>
              <td class="num muted">≥ 2026-06-04 <span class="faint">(floor)</span></td></tr>
          <tr><td><a class="k" href="#">stage.example.com</a></td>
              <td class="gapcell fault"><span class="cause">we stopped looking</span>
                <span class="prior">last read Resolved · 1 address · 2026-08-12 04:07</span>
                <span class="prior">vantage-fra1 has been unavailable since 2026-08-12</span></td>
              <td class="num muted">≥ 2026-06-02 <span class="faint">(floor)</span></td></tr>
          <tr><td><a class="k" href="#">arch.example.com</a></td>
              <td class="gapcell"><span class="cause">we never looked</span>
                <span class="prior">never evaluated · no prior value</span>
                <span class="prior">no internal-class vantage has ever been configured</span></td>
              <td class="num muted">2026-08-14</td></tr>
          <tr><td><a class="k" href="#">edge.example.com</a>
                <span class="rowsub">its addresses sit behind a gate you shut on 2026-08-14</span></td>
              <td class="m">Resolved · 2 addresses
                <span class="rowsub">a current value. The gate stopped us feeding the reachability
                timelines; this one was never gated, and the ports below are held for 2 cadences
                and then age out</span></td>
              <td class="num muted">2026-06-02</td></tr>
        </tbody>
      </table>
      <div class="card-f">Four cells and one ordinary value. The closed-gate row is drawn as a
      <b>value</b> because during the retention window it is one — the gate stopped the feed, and the
      reading ages out under the currency bound rather than being retracted. No countdown, no fault
      band, no strike-through and no <code>stale</code>: all four say <i>this reading no longer
      counts</i>, and it counts.</div>
    </div>

    ${anno("the undatable pair, which only bites here", `
      <p>A value arriving after a <code>Gap</code> cannot be dated (#42). On this screen that lands
      in exactly one place: a cell whose gap has just closed shows both values and <b>no date for the
      move</b> — <code>not-reached → reached · undatable (a gap sits between them)</code>. It may
      never render as <code>changed 3 days ago</code>, and it may never be silently dropped either,
      because a genuine escalation that happened while a vantage was down would then vanish without
      trace.</p>
      <p>Note what it is <i>not</i>: a <code>Break</code>. Across a break we lack the licence to
      compare; across a gap both values are the same kind of thing under one derivation and what we
      lack is <i>when</i>. Same shape as the floor beside it in the <code>since</code> column, and
      the two are deliberately worded differently so a reader does not fuse them.</p>`)}`;
}

/* ------------------------------------------------------------------ render */
function render() {
  const p = params();
  let body;
  if (p.screen === "search")   body = screenSearch(p);
  else if (p.screen === "vsmember") body = screenVsMember(p);
  else if (p.screen === "cells")    body = screenCells(p);
  else body = screenSubjects(p);

  document.getElementById("app").innerHTML = chrome(body);

  const grp = (label, key, list, cur) => `<div class="grp"><span>${label}</span>` +
    list.map(v => `<button data-k="${key}" data-v="${v}" class="${v === cur ? "on" : ""}">${v}</button>`).join("") +
    `</div>`;

  let bar = grp("screen", "screen", SCREENS, p.screen);
  if (p.screen === "subjects") {
    bar += grp("variant", "variant", VARIANTS, p.variant);
    if (p.variant === "C") bar += grp("fill", "fill", FILLS, p.fill);
  }
  const sw = document.getElementById("switch");
  sw.innerHTML = bar;
  sw.querySelectorAll("button").forEach(b =>
    b.onclick = () => go({ [b.dataset.k]: b.dataset.v }));
}

document.addEventListener("keydown", e => {
  const p = params();
  if (p.screen !== "subjects") return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const i = VARIANTS.indexOf(p.variant);
  const j = (i + (e.key === "ArrowRight" ? 1 : VARIANTS.length - 1)) % VARIANTS.length;
  go({ variant: VARIANTS[j] });
});

render();
</script>
</body>
