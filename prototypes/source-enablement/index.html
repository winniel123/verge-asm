<!doctype html>
<!--
  PROTOTYPE — throwaway. Issue #47: "What does the source-enablement prompt
  render, now that it carries two groups of unresolved questions?"

  #28 drew this surface as ONE LINE inside `Coverage`'s "scopes you have not
  declared" panel — asked, nobody replied, accept the terms yourself — and that
  was right at the time. (#57 has since withdrawn the "asked" half: no reply has
  ever come, and no record of an approach exists. The copy here reflects that.) #34 made the toggle load-bearing: the operator flips it
  by taking on a reading the project declined to make, and that reading is only
  honest if they are told what is unresolved, in the project's own words, in two
  marked groups. A two-group document is not a caption.

  Four screens, ?screen=coverage|prompt|accept|stored :

    coverage  the propose panel from #28 variant D, trimmed to the five
              registries — the ENTRANCE, drawn three ways
    prompt    the document itself
    accept    the moment of acceptance: the install has just retrieved and
              stored the terms (or the retrieval failure) — ?stage=ok|fail
    stored    the stored copy, verbatim and unannotated, on its own view

  Three placements, ?variant=A|B|C — the "where does it live" fork:

    A  expands in place, inside the Coverage panel
    B  opens from Coverage as a dialog
    C  opens from Coverage as its own addressable surface   ← ships

  Six registries, ?source=arin|afrinic|apnic|ripestat|ripedb|lacnic .
  They are NOT symmetric and the asymmetry is the finding:

    arin      no prompt at all — nothing is unresolved
    ripestat  both groups populated
    apnic     both groups populated
    ripedb    actionable group EMPTY, unanswerable group enumerable
    afrinic   actionable group EMPTY, unanswerable group enumerable
    lacnic    actionable group EMPTY, unanswerable group NOT ENUMERABLE

  So three prompt shapes, not four, and the empty groups render rather than
  disappearing: an omitted heading is an absence the operator cannot read.

  CONSTRAINTS HONOURED, all from the ticket:
    · no figure, no bar, no percentage anywhere on this surface (#28)
    · no clause of any source is quoted or paraphrased as a verdict (#34)
    · the two-group document and the terms document are never on screen
      together — our words and their words in one view manufactures a mapping
      between them, which is the verdict the project refused to give
    · no terms text is bundled here. #27: anything the project SHIPS is a
      build-time act by us, and no registry grants a licence for it. The
      stored-copy view renders the record's shape, never a third party's bytes.

  Not production code. No tests, no error handling, no abstractions. Visual
  language is the real design system (../../design-system). Vocabulary is
  CONTEXT.md, which overrides the kit where they disagree.
-->

<script>
/* ═══════════════════════════════════════════════════════════════════════
   THE FIVE REGISTRIES — SIX TOGGLES, FOUR RENDERINGS

   #34's five-registry ship-state table is settled and is not re-opened. Its
   unresolved-question table is followed row for row, with two additions this
   prototype had to make to render anything honest:

     · RIPE is TWO toggles, not one. RIPEstat and the RIPE Database have
       different terms documents, different open questions and — after #34 —
       different stored records, so the prompt is per SOURCE, which is where
       CONTEXT.md puts `consent`. Taken on its own the RIPE Database's
       actionable group is EMPTY, which #34's region-level reading hid.
     · AFRINIC gains one actionable row. #24 measured a commercial-service
       prohibition in AFRINIC's own prohibited list and read it as "a resale
       clause of exactly ARIN's shape [that] does not disqualify the modal
       operator" — true, and a statement about the MODAL operator. Whether
       this operator is the modal one is precisely a group-1 question.

   That yields four renderings, not two: no prompt (ARIN), both groups
   populated (RIPEstat, APNIC, AFRINIC), actionable group empty (RIPE
   Database, LACNIC), and unanswerable group not enumerable (LACNIC).

   NO ASK DATE IS RENDERED ANYWHERE. #19/#23/#24/#25 all closed "asked, no
   answer", and between them they record no send date, no send confirmation,
   and a recipient for one of the four. #24 says it outright — "with the email
   unsent-or-unanswered this stays unreported". A prompt printing "asked on
   2026-06-02" would assert a fact the project does not hold, in a product
   whose spine is that we never assert what we did not measure. What IS held
   is the determination, and it is dated as one.

   Every string below is the PROJECT's words about what is unresolved. No
   clause of any registry is quoted, excerpted or characterised as a verdict:
   #34's rider is that quoting invites the operator to read our summary as our
   reading, which is the one thing `operator-accepted` exists to avoid.
   ═══════════════════════════════════════════════════════════════════════ */

/* The one date this surface may render. Not a send date: #57 established there is
   no send to evidence, and no ask date will ever be renderable unless #59 files a
   sent message under docs/correspondence/. */
const DETERMINED = "2026-08-13";   /* when the project settled the question */

const R = {

  arin: {
    key:"arin", name:"ARIN", region:"North America", consent:"unencumbered",
    toggle:false,
    /* No prompt. Not an empty prompt — no prompt. The empty-group rule below
       governs groups INSIDE a document that exists; it does not manufacture a
       document where there is nothing to say. */
    coverageLine:"On by default. It is working and it returns nothing for this estate — your resources are delegated by RIPE, not ARIN.",
    settled:"An operator inventorying their own estate is inside the permission ARIN publishes for operational and technical research. Nothing about its terms was left unresolved, so there is nothing here for you to read and nothing for you to take on.",
  },

  ripestat: {
    key:"ripestat", name:"RIPEstat", region:"RIPE", consent:"operator-accepted",
    toggle:true, shape:"both",
    buys:"RIPEstat and the RIPE Database are the only way to ask which address blocks are registered under your organisation's name in the RIPE region. The keyless substitute used elsewhere carries no RIPE organisation names at all, so with both of these off there is no organisation-name path here — not a shallower one, none.",
    actionable:[
      { t:"Whether you resell.",
        w:"RIPEstat's terms turn in part on whether its data ends up inside something you sell. Running verge-asm over your own estate is not that; selling a service built on verge-asm to other people is. Which of those you are is a fact about you, and the project has no way to know it." },
    ],
    unanswerable:[
      { t:"Whether writing prefixes into an inventory database is a use RIPEstat's terms restrict.",
        w:"This reads the same for every install — it does not depend on who you are, so nobody who runs this software is in a better position to answer it than anybody else. Reading it is what the project declined to do." },
    ],
    asked:{ who:"RIPE NCC" },
    terms:{ url:"https://www.ripe.net/about-us/legal/ripestat-service-terms-and-conditions/",
            ok:true, status:"HTTP 200", bytes:"48,213", type:"text/html",
            hash:"9f2c41ab7e0d5c83a1b6ef94d20738c5b7ac6e18f0d3925471aa8c6d2b31f0e7" },
  },

  ripedb: {
    key:"ripedb", name:"RIPE Database", region:"RIPE", consent:"operator-accepted",
    toggle:true, shape:"constant-only",
    buys:"Queries the RIPE Database directly for the objects registered under your organisation's name, rather than through RIPEstat's layer over it. Either one opens the organisation-name path for this region; neither is a substitute for a keyless mirror, because for RIPE there is not one.",
    actionable:[],
    unanswerable:[
      { t:"Whether inventorying your own estate is one of the purposes the Database's terms permit access for at all.",
        w:"Its terms permit access only for a listed set of purposes, and none of them describes an operator cataloguing their own exposed estate. This is the binding one: it goes to whether access is permitted at all, not to how much may be kept. It reads the same for every install, so no operator is better placed to answer it than the project was." },
      { t:"Whether one organisation's own records are a small enough part of the Database to be taken, and whether keeping them between runs counts as re-use.",
        w:"Two documents set that boundary in two different wordings and neither one defines where it falls. Constant across every install." },
    ],
    asked:{ who:"RIPE NCC" },
    terms:{ url:"https://docs.db.ripe.net/HTML-Terms-And-Conditions",
            ok:true, status:"HTTP 200", bytes:"21,904", type:"text/html",
            hash:"c1d8046b93e5f27a0c4ba1e8f6539d7284cb0a1e5f7d3298b64ce017a2d95f38" },
  },

  apnic: {
    key:"apnic", name:"APNIC", region:"Asia-Pacific", consent:"operator-accepted",
    toggle:true, shape:"both",
    buys:"Asks APNIC directly instead of the third-party mirror the keyless path uses. The mirror carries most APNIC organisations but not all, so this reaches the remainder — and it reads the registry as it stands rather than as it was last published. It does not reach an assignment a provider made to you; no APNIC interface does, at any tier.",

/* ═══════════════════════════════════════════════════════════════════════
   THE DOCUMENT
   Four blocks, in this order and no other:
     1  what enabling does, and what it buys        — no figure, ever
     2  what you may be able to resolve             — always renders
     3  what nobody has been able to resolve        — always renders
     4  the act: what is recorded, and the control  — one control, one act
   ═══════════════════════════════════════════════════════════════════════ */

/* Block 1. Two halves, and the second half is the one the ticket's fourth
   bullet turns on. #34's carry-onward calls enabling one of these a
   "zero→full aperture widening, the largest the product can make". Post
   ADR-0012 and #43 that is false for all five: every one of them PROPOSES,
   none of them observes, and a proposer may be added or dropped with no
   drift consequence whatever — no `revealed`, no `Break`, no version bump.
   So the prompt states what enabling does NOT do, in terms, because an
   operator of a drift product who is told their aperture just widened will
   read the next cadence as their estate growing overnight. */
function blockWhat(s) {
  return `
  <div class="card">
    <div class="card-h"><h2>What enabling ${s.name} does</h2>
      <span class="sp"></span><span class="ml">no figure applies here</span></div>
    <div class="pad">
      <p style="margin:0 0 var(--space-3);line-height:var(--leading-body);max-width:720px">${s.buys}</p>
      <div class="note">
        <span class="ml">and what it does not do</span>
        Nothing enters your estate. ${s.name} proposes address scopes; a proposal is read by nothing
        until you confirm it into a seed. Until then nothing is probed, nothing appears, and no
        timeline moves — so enabling this cannot make anything in your estate look like it changed.
        The act that changes your estate is confirming a proposal, and it is a separate act on a
        separate screen.
      </div>
    </div>
  </div>`;
}

/* Blocks 2 and 3. Both headings are fixed furniture. An empty group renders
   its emptiness as a sentence, because a heading that vanishes when its
   contents are empty leaves the operator unable to tell "there is nothing
   here" from "this product has no such idea" — which is the same failure as
   an unmeasured absence rendered as a zero. */
function groupActionable(s) {
  const n = s.actionable.length;
  return `
  <div class="grp act">
    <div class="hd">
      <h3>What you may be able to resolve</h3>
      <span class="sp"></span>
      <span class="cnt">${n === 0 ? "nothing" : n === 1 ? "1 question" : n + " questions"}</span>
    </div>
    ${n === 0 ? `
      <div class="none">
        <div class="n">—</div>
        <div class="t"><b>Nothing.</b> Every question left open under ${s.name} reads the same
          whoever is running this software, so there is nothing here that being you rather than
          anybody else would settle. This group is empty, and it is empty because it was checked,
          not because it was skipped.</div>
      </div>`
    : s.actionable.map((q, i) => `
      <div class="q">
        <div class="n">${i + 1}</div>
        <div class="b"><div class="t">${q.t}</div><div class="w">${q.w}</div></div>
      </div>`).join("")}
  </div>`;
}

function groupUnanswerable(s) {
  const listable = s.unanswerable !== null;
  const n = listable ? s.unanswerable.length : 0;
  return `
  <div class="grp non">
    <div class="hd">
      <h3>What nobody has been able to resolve</h3>
      <span class="sp"></span>
      <span class="cnt">${listable ? (n === 1 ? "1 question" : n + " questions") : "cannot be listed"}</span>
    </div>
    ${listable ? s.unanswerable.map((q, i) => `
      <div class="q">
        <div class="n">${i + 1}</div>
        <div class="b"><div class="t">${q.t}</div><div class="w">${q.w}</div></div>
      </div>`).join("")
    : `
      <div class="unlist">
        <span class="ml">this group is not a list</span>
        <div class="t">${s.unlistable}</div>
      </div>`}
    <div class="asked">
      <div class="n">·</div>
      <div class="t">No reply from ${s.asked.who} has ever come. Whether anything was ever sent to
        them cannot be established: the project keeps no record of outbound communications, so it
        can produce no message, no recipient and no date. ${s.name} ships off either way — not
        pending, not a refusal, and no length of silence will turn into one.
        <div class="muted" style="margin-top:var(--space-2);font-size:var(--text-sm)">
          What leaves this to you is the project's refusal to read ${s.name}'s terms on your behalf,
          and that refusal stands whether or not anything was ever sent. Recorded
          <span class="mono">${DETERMINED}</span> and unchanged since — the date the question was
          settled, not the date of any send.</div>
      </div>
    </div>
  </div>`;
}

/* Block 4. One control, one act.

   The two-step was drawn and refused. The second act it wanted to gate —
   the estate consequence — already exists one hop downstream, at confirming
   a `Proposal` into a `Seed` (#50), which is where ADR-0012 put it and where
   the operator actually opens the probing gate. A second confirmation here
   would gate a widening that does not happen, and a step that always says
   yes teaches the operator to click through the step that matters. */
function blockAct(s) {
  return `
  <div class="act-blk">
    <div class="hd">
      <span class="ml">the act</span>
      <h3>What accepting records</h3>
    </div>
    <div class="bd">
      <ul>
        <li><b>${s.name} is set to <span class="mono">operator-accepted</span>.</b> That does not
          record that you are inside ${s.name}'s terms, and it is not read as your certifying so.
          It records that the project would not read a stranger's terms on your behalf, and that
          you — the party they bind — made the reading and hold it.</li>
        <li><b>The terms themselves are fetched and stored, here, now.</b> Not a link to them: the
          bytes, their hash and the time they were fetched. A link can be rewritten after you
          accept, with nothing left to compare against. If the fetch fails, the failure is stored
          in the same slot, and that is a record too.</li>
        <li><b>Nothing else changes.</b> No scope is added, no address is probed, and no proposal
          is confirmed. You can turn this off again at any time; turning a proposer off removes
          nothing you already confirmed.</li>
      </ul>
      ${s.recordCaveat ? `<div class="note" style="margin-top:var(--space-3)">
        <span class="ml">about the copy that will be stored</span>${s.recordCaveat}</div>` : ``}
      <div class="note invite" style="margin-top:var(--space-3)">
        <span class="ml">you may get an answer the project could not</span>
        ${s.asked.who} did not reply to the project. You hold resources in their region and the
        project does not, which is standing the project has no way to borrow. Nothing here expires:
        leaving this off costs you nothing you cannot come back for.
      </div>
    </div>
    <div class="bar">
      <a href="${s.terms.url}" class="mono" target="_blank" rel="noreferrer">Read ${s.name}'s terms on their site →</a>
      <span class="muted" style="font-size:var(--text-sm)">Not fetched yet. That link is their live page.</span>
      <span class="sp"></span>
      <button class="btn ghost">Leave off</button>
      <button class="btn accent">Accept and enable ${s.name}</button>
    </div>
  </div>`;
}

/* ARIN. Not an empty prompt — no prompt. */
function noPrompt(s) {
  return `
  <div class="card">
    <div class="card-h"><h2>${s.name} has no prompt</h2><span class="sp"></span>
      <span class="tag on">${s.consent}</span></div>
    <div class="pad">
      <p style="margin:0 0 var(--space-3);line-height:var(--leading-body);max-width:720px">${s.settled}</p>
      <div class="note">
        <span class="ml">what coverage says about ${s.name} instead</span>${s.coverageLine}
      </div>
      <p class="muted" style="margin:var(--space-3) 0 0;line-height:var(--leading-body);max-width:720px;font-size:var(--text-sm)">
        An empty group inside a prompt is written down, because you could not otherwise tell it from
        an omission. A prompt with nothing in either group is not written at all — there is no act to
        take and no reading to hold, and a page saying so would invent a decision where there is none.
      </p>
    </div>
  </div>`;
}

function promptDoc(s) {
  if (!s.toggle) return noPrompt(s);
  return `
  <div class="stack">
    ${blockWhat(s)}
    ${groupActionable(s)}
    ${groupUnanswerable(s)}
    ${blockAct(s)}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN: coverage — the entrance, three ways
   ═══════════════════════════════════════════════════════════════════════ */

/* ── THE DATELINE — ADR-0075 (#131), applied by #144 ────────────────────────
   A prototype is a dated record of a READING, never of a RULE. The provenance
   has to be in what the browser DRAWS: every recorded instance of a prototype
   being wrongly believed happened in a browser, where an HTML comment is
   invisible. Drawn on every screen and variant, because every one is a reading. */
function dateline() {
  return `
  <div class="anno">
    <span class="ml">prototype · not part of the design</span>
    <p><b>Issue #47 — "What does the source-enablement prompt render, now that it carries two groups
      of unresolved questions?". Drawn 2026-08-13</b>, with the APNIC group-1 row restated by
      <b>#52</b> and the invitation copy restated by <b>#57</b>, both the same day. Throwaway:
      something to decide against, not production UI and not a component library.</p>
    <p><b>Every quantity on these screens is a dated reading, not a current value</b> — the corpus
      as it stood on that date, and nothing here has been re-filled since. The only live absolutes
      are the map's <code>THE CURRENT COMPOSED STATE</code> line (issue #1, <i>Notes</i>): read a
      figure there before believing one here. What is <i>not</i> a dated reading is the state these
      screens draw — the acts they offer, the populations they show as non-empty and the sentences
      they put in the product's mouth. A later ruling that makes one of those unreachable is marked
      here in place and never redrawn.</p>
  </div>`;
}

function coverageScreen(variant, srcKey) {
  const s = R[srcKey];
  const rows = ORDER.map(k => {
    const r = R[k];
    const open = variant === "A" && k === srcKey && r.toggle;
    return `
    <div class="reg-row">
      <div class="top">
        <span class="nm">${r.name}</span>
        ${r.toggle ? `<span class="tag invite">off</span>` : `<span class="tag on">on</span>`}
        <span class="mono faint" style="font-size:var(--text-xs)">${r.consent}</span>
        <span class="sp"></span>
        ${r.toggle
          ? `<button class="btn sm accent" onclick="go('source','${k}')">${
              variant === "A" ? (open ? "Close" : "Review what is unresolved")
            : variant === "B" ? "Review what is unresolved"
            : "Review what is unresolved →"}</button>`
          : ``}
      </div>
      <div class="line">${r.toggle
        ? `No reply from ${r.asked.who} has ever come, and no record of an approach exists. You can
           read ${r.name}'s terms and decide for
           yourself — ${r.actionable.length > 0
             ? `one part of what is unresolved turns on facts about you`
             : `nothing left unresolved here turns on who you are`}.`
        : r.coverageLine}</div>
      ${open ? `<div class="inline-doc">${promptDoc(r)}</div>` : ``}
    </div>`;
  }).join("");

  return `
  <div class="shell">
    ${dateline()}
    <h1 class="page">Coverage</h1>
    <div class="sub">99.3% of what you declared was measured this cycle. What you declared is
      narrower than it could be.</div>
    <div class="stack">
      <div class="card" style="border-left:3px solid var(--accent)">
        <div class="card-h"><h2>Scopes you have not declared</h2><span class="sp"></span>
          <span class="ml" style="color:var(--accent)">no figure applies here</span></div>
        <div class="pad" style="padding-bottom:var(--space-2)">
          <p class="muted" style="margin:0;max-width:780px;line-height:var(--leading-body)">
            These registries propose address scopes for you to confirm. None of them can raise the
            percentage above — coverage is measured against what you declared, so enabling one cannot
            make us more complete. It can only tell you the estate was larger than you said. That is
            why nothing here carries a number.</p>
        </div>
        ${rows}
      </div>
      <div class="note invite">
        <span class="ml">why four of these are off</span>
        Four registries were asked whether verge-asm may query them on an operator's behalf by
        default. None replied, so they ship off. Each one leaves something unresolved, and the
        unresolved part is written out before you are asked to take it on — some of it you may be
        able to settle, some of it nobody has settled.
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN: accept — the moment of acceptance

   The install has just retrieved and stored the document, or the failure.
   What renders is the RECEIPT, never the document: our two groups and their
   terms in one view manufactures a mapping between them, and the operator
   reads our questions as annotations of their clauses. That is the verdict
   `operator-accepted` exists to refuse.

   Success and failure render in the same slot at the same weight. For LACNIC
   the failure IS what was accepted, so a failure treatment that looked like
   an error would be reporting the expected outcome as a fault.
   ═══════════════════════════════════════════════════════════════════════ */

function acceptScreen(srcKey, stage) {
  const s = R[srcKey];
  if (!s.toggle) return `<div class="shell narrow">${dateline()}${noPrompt(s)}</div>`;
  const ok = stage === "ok" && s.terms.ok;
  const t = s.terms;
  const surprise = stage === "fail" && t.ok;   /* the fetch failed where the prompt said it would work */

  const receipt = ok ? `
<span class="k">requested</span>${t.url}
<span class="k">at</span>2026-08-13 14:02:31 UTC
<span class="k">status</span>${t.status}
<span class="k">bytes</span>${t.bytes}
<span class="k">content-type</span>${t.type}
<span class="k">sha-256</span>${t.hash}
<span class="k">stored</span>the document` : surprise ? `
<span class="k">requested</span>${t.url}
<span class="k">at</span>2026-08-13 14:02:31 UTC
<span class="k">status</span><span class="bad">connection reset after 30s</span>
<span class="k">bytes</span><span class="bad">0</span>
<span class="k">stored</span><span class="bad">the failure</span>` : `
<span class="k">requested</span>${t.url}
<span class="k">at</span>2026-08-13 14:02:31 UTC
<span class="k">status</span>${t.status}
<span class="k">bytes</span>${t.bytes}
<span class="k">content-type</span><span class="bad">${t.type}</span>
<span class="k">sha-256</span>${t.hash}
<span class="k">stored</span>the failure`;

  return `
  <div class="shell narrow">
    ${dateline()}
    <div class="crumb"><a href="#" onclick="go('screen','coverage')">Coverage</a> ›
      <a href="#" onclick="go('screen','prompt')">${s.name}</a> › accepted</div>
    <h1 class="page">${s.name} is on</h1>
    <div class="sub">Consent is <span class="mono">operator-accepted</span>. It is your reading, and
      this is the record of what you read it against.</div>

    <div class="stack">
      <div class="card">
        <div class="card-h"><h2>Retrieval</h2><span class="sp"></span>
          <span class="ml">${ok ? "the document was stored" : "the failure was stored"}</span></div>
        <div style="padding:var(--space-4)"><div class="ink">${receipt}</div></div>
        <div class="card-f">
          ${ok ? `
            <span class="muted" style="font-size:var(--text-sm)">This copy is what the address served
              at the moment you accepted. If it is rewritten later, this copy does not change.</span>
            <div style="margin-top:var(--space-3)">
              <button class="btn ghost sm" onclick="go('screen','stored')">Open the stored copy →</button>
            </div>`
          : surprise ? `
            <span style="font-size:var(--text-base);line-height:var(--leading-body)">
              <b>This is not what the prompt said would happen.</b> ${s.name}'s terms were readable
              when they were last checked, and the fetch at your acceptance failed. What is recorded
              is the failure, because that is what happened. ${s.name} is on and you can turn it off.</span>
            <div style="margin-top:var(--space-3)">
              <button class="btn ghost sm">Retry the fetch</button>
              <button class="btn ghost sm">Turn ${s.name} back off</button>
            </div>`
          : `
            <span style="font-size:var(--text-base);line-height:var(--leading-body)">
              This is the expected result and it is not an error. ${s.name}'s terms could not be
              retrieved before you accepted and they could not be retrieved now. The record holds
              what came back instead, which is a more honest account of what you accepted than a
              working link to a page with no terms in it would have been.</span>
            <div style="margin-top:var(--space-3)">
              <button class="btn ghost sm" onclick="go('screen','stored')">Open what was stored →</button>
            </div>`}
        </div>
      </div>

      <div class="anno no">
        <span class="ml">withdrawn — two cells, two rulings</span>
        <p><b><span class="mono">accepted by</span> is refused outright.</b>
          <a href="https://github.com/winniel123/verge-asm/issues/127">#127</a> ruled operator
          attribution out of v1 and ADR-0073 §1 made it total: <i>no account, no name, no initials,
          no avatar, no &ldquo;declared by&rdquo; cell &mdash; not stored and not rendered</i>. This
          drawing predates both. <b>What it would draw now:</b> nothing &mdash; the row is gone, and
          no cell replaces it.</p>
        <p><b><span class="mono">accepted at</span> is refused as a property of the declaration</b>
          &mdash; <a href="https://github.com/winniel123/verge-asm/issues/165">#165</a> · ADR-0093.
          An instant is not a field the Declared layer may carry, and a <span class="mono">Source</span>
          toggle fails both limbs: it is flipped in place, and the <span class="mono">Batch</span>'s
          recorded source set already dates it. <b>What it would draw now:</b> the retrieval receipt
          above, unchanged &mdash; <span class="mono">requested &hellip; at</span> dates <i>our</i>
          fetch, which is an operational fact about what the project did and is correct as drawn. The
          rest of this record &mdash; the stored copy, the questions shown &mdash; is untouched.</p>
      </div>

      <div class="card">
        <div class="card-h"><h2>The consent record</h2></div>
        <table class="kv">
          <tr><td class="k">source</td><td class="v">${s.name}</td></tr>
          <tr><td class="k">consent</td><td class="v">operator-accepted</td></tr>
          <tr><td class="k">accepted by</td><td class="v">l.winnie</td></tr>
          <tr><td class="k">accepted at</td><td class="v">2026-08-13 14:02:31 UTC</td></tr>
          <tr><td class="k">terms held</td><td class="v">${ok ? "stored copy · " + t.bytes + " B"
            : surprise ? "none — retrieval failed" : "none — retrieval failed, failure stored"}</td></tr>
          ${t.documented ? `<tr><td class="k">documented address</td>
            <td class="v">${t.documented} · ${t.documentedStatus}</td></tr>` : ``}
          <tr><td class="k">questions shown</td>
            <td class="v">${s.actionable.length} resolvable · ${
              s.unanswerable === null ? "not enumerable" : s.unanswerable.length + " unresolved"}</td></tr>
        </table>
        <div class="card-f muted" style="font-size:var(--text-sm);line-height:var(--leading-body)">
          The record holds what you were shown as well as what you accepted. If the wording of either
          group changes in a later release, this record still says what the wording was on the day.
        </div>
      </div>

      <div class="note">
        <span class="ml">what happens next, and what does not</span>
        ${s.name} will be queried on the next cadence and will propose address scopes for you to
        confirm. Nothing it proposes is in your estate, nothing is probed, and no timeline moves
        until you confirm one. If it comes back with nothing, you will be told whether that means
        it found nothing or could not be reached — those are different answers and they are not
        rendered alike.
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN: stored — the copy, on its own view

   Deliberately reachable only from the record, and deliberately not on the
   same view as the two groups. Verbatim, unannotated, no anchors, no
   highlighting: annotating a stored document is the reading the project
   declined to do, arriving through a scrollbar.

   The prototype ships no registry's terms text. #27: anything the project
   ships is a build-time act by us and no registry licenses it. The record's
   SHAPE is what is being designed here; the bytes belong to the operator's
   own install.
   ═══════════════════════════════════════════════════════════════════════ */

function storedScreen(srcKey) {
  const s = R[srcKey];
  if (!s.toggle) return `<div class="shell narrow">${dateline()}${noPrompt(s)}</div>`;
  const t = s.terms;
  return `
  <div class="shell narrow">
    ${dateline()}
    <div class="crumb"><a href="#" onclick="go('screen','coverage')">Coverage</a> ›
      <a href="#" onclick="go('screen','prompt')">${s.name}</a> ›
      <a href="#" onclick="go('screen','accept')">accepted</a> › stored copy</div>
    <h1 class="page">${s.name} — the copy stored at your acceptance</h1>
    <div class="sub">Exactly as it was fetched on <span class="mono">2026-08-13</span>. Nothing here is
      highlighted, indexed or summarised, and nothing on this page is verge-asm's reading of it.</div>
    <div class="stack">
      <table class="kv card">
        <tr><td class="k">from</td><td class="v">${t.url}</td></tr>
        <tr><td class="k">fetched</td><td class="v">2026-08-13 14:02:31 UTC</td></tr>
        <tr><td class="k">status</td><td class="v">${t.status} · ${t.bytes} B · ${t.type}</td></tr>
        <tr><td class="k">sha-256</td><td class="v">${t.hash}</td></tr>
      </table>
      ${t.ok ? `
      <div class="stored-body">
        <code>[ ${t.bytes} bytes of ${s.name}'s terms, as fetched ]</code>
        <div style="margin-top:var(--space-3);max-width:520px;margin-left:auto;margin-right:auto">
          The running product renders the stored bytes here. This prototype does not carry them:
          shipping a third party's document inside this repository is a build-time act by the
          project, and none of these registries licenses it.
        </div>
      </div>`
      : `
      <div class="stored-body">
        <code>[ ${t.bytes} bytes — ${t.type} ]</code>
        <div style="margin-top:var(--space-3);max-width:560px;margin-left:auto;margin-right:auto">
          What was stored is not terms. It is what the address served, kept because a record that
          cannot produce what was consented to is not a record — and because <b>nothing was
          retrieved</b> is a claim that has to be evidenced like any other.
        </div>
      </div>`}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN: prompt — the document, at its three placements
   ═══════════════════════════════════════════════════════════════════════ */

function promptScreen(variant, srcKey) {
  const s = R[srcKey];

  /* A — expands in place. Drawn so the cost is visible rather than argued:
     the document is a screen's worth of reading nested two levels inside a
     card that also has to render five other registries, and the operator
     loses the Coverage page they were on. */
  if (variant === "A") return coverageScreen("A", srcKey);

  /* B — a dialog. Correct-looking, and it dies on the record: a dialog has no
     afterlife, so there is nowhere to come back to and read what you accepted,
     and nowhere for onboarding to link to. It also has to host a network fetch
     that can fail. */
  if (variant === "B") return `
    ${coverageScreen("B", srcKey)}
    ${s.toggle ? `
    <div class="scrim"></div>
    <div class="dlg">
      <div class="dh"><h2>${s.name}</h2>
        <span class="mono faint" style="font-size:var(--text-xs)">operator-accepted</span>
        <span class="sp"></span><button class="btn ghost sm">✕</button></div>
      <div class="db">${promptDoc(s)}</div>
    </div>` : ``}`;

  /* C — its own addressable surface, opened from Coverage. Ships. */
  return `
  <div class="shell narrow">
    ${dateline()}
    <div class="crumb"><a href="#" onclick="go('screen','coverage')">Coverage</a> ›
      scopes you have not declared › ${s.name}</div>
    <h1 class="page">${s.name}</h1>
    <div class="sub">${s.toggle
      ? `Off. Turning it on means taking on a reading of ${s.name}'s terms that this project would not
         make for you. What that reading leaves open is below — the part you may be able to settle
         first, then the part nobody has settled.`
      : `On, and nothing about it was left unresolved.`}</div>
    ${promptDoc(s)}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════════════════ */

const SCREENS  = ["coverage","prompt","accept","stored"];
const VARIANTS = ["A","B","C"];
const STAGES   = ["ok","fail"];

function q(k, d) { const v = new URLSearchParams(location.search).get(k); return v || d; }
function go(k, v) {
  const p = new URLSearchParams(location.search); p.set(k, v);
  location.search = p.toString(); return false;
}

function render() {
  const screen  = SCREENS.includes(q("screen"))   ? q("screen")  : "prompt";
  const variant = VARIANTS.includes(q("variant")) ? q("variant") : "C";
  const source  = ORDER.includes(q("source"))     ? q("source")  : "ripestat";
  const stage   = STAGES.includes(q("stage"))     ? q("stage")   : "ok";

  const body =
      screen === "coverage" ? coverageScreen(variant, source)
    : screen === "prompt"   ? promptScreen(variant, source)
    : screen === "accept"   ? acceptScreen(source, stage)
    :                         storedScreen(source);

  document.getElementById("app").innerHTML =
    nav(screen === "coverage" || (screen === "prompt" && variant !== "C") ? "coverage" : "")
    + body + foot();

  const opts = { screen: SCREENS, variant: VARIANTS, source: ORDER, stage: STAGES };
  const cur  = { screen, variant, source, stage };
  document.querySelectorAll("#switch .g").forEach(g => {
    const k = g.dataset.key;
    g.querySelectorAll("button").forEach(b => b.remove());
    opts[k].forEach(o => {
      const b = document.createElement("button");
      b.textContent = o; b.className = cur[k] === o ? "on" : "";
      b.onclick = () => go(k, o);
      g.appendChild(b);
    });
  });
}
render();
</script>
</body>
</html>
