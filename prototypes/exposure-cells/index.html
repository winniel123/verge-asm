<!doctype html>
<!--
  PROTOTYPE — throwaway. Issue #45: "Which of the four unnamed Exposure cells
  need names, and what does the board render for the rest?"

  ADR-0010 composed `Exposure` from two `Reach`es and left a 3x3 grid with five
  names on it, four cells unnamed, and one of the unnamed cells reading
  `unreachable` — "no vantage reaches it" — while nobody had looked from
  outside. This prototype draws the three candidate answers so the axis can be
  read rather than argued.

    A — Name the holes     eight states, one per cell of the 3x3
    B — Fold (status quo)  five states, the one-legged readings absorbed
    C — Two legs required  four states, one-legged readings are not Exposure

  Second axis, ?fill= : which vantage classes the install actually runs.

    both         internet + internal, the two-legged case
    no-internet  the default no-prober install (#14's internal inventory)
    no-internal  the whole-stack-on-a-VPS install (#14 s7)
    gap          the internet leg existed and went silent (#28's `blind`)

  Switch with ?variant=A|B|C&fill=..., the floating bar, or the arrow keys.

  Not production code. No tests, no error handling, no abstractions. Visual
  language is the real design system (../../design-system); vocabulary is
  CONTEXT.md, which overrides the kit where they disagree.
-->

  /* the group rules: 2px ink is this system's structural weight */

<div id="app"></div>

<div id="switch">
  <button id="prev" title="Previous variant (left arrow)">&larr;</button>
  <div class="lbl"><b id="vkey">A</b> &mdash; <span id="vname"></span></div>
  <button id="next" title="Next variant (right arrow)">&rarr;</button>
  <div class="fills" id="fills"></div>

<script>
/* ═══════════════════════════ the estate ═══════════════════════════════
   Vocabulary is CONTEXT.md. Reach, Exposure, Vantage class, Service,
   Batch, Gap, Break, Span. No "asset" as a modelled thing, no "host",
   no "finding".

   Every total on every board below is SUMMED FROM ITS CELLS, never
   authored — #28 found that two independently-counted numbers disagree on
   screen the moment a Batch dead-letters, and both present as facts.
*/

/* ── the two-legged board: 4 real states, ADR-0010's 2x2 of valued legs ──
   Order is deliberate. Both axes run internet-`reached` first, so the
   internet leg's boundary is one rule across the whole matrix. */
const FOUR = {
  order: ["exposed", "edge", "firewalled", "unreachable"],
  label: { exposed: "exposed", edge: "edge-only", firewalled: "firewalled", unreachable: "unreachable" },
  legs:  { exposed: "internet reached · internal reached",
           edge: "internet reached · internal not-reached",
           firewalled: "internet not-reached · internal reached",
           unreachable: "internet not-reached · internal not-reached" },
  /* the group split falls after index 1 on both axes */
  split: 2,
  /* rows = was, cols = is now. `nc` and `withdrawn` are #28's two extra columns. */
  cells: {
    exposed:     { exposed: 130, edge:  2, firewalled:   7, unreachable:   4, nc: 12, withdrawn: 0 },
    edge:        { exposed:   1, edge: 14, firewalled:   1, unreachable:   0, nc:  2, withdrawn: 0 },
    firewalled:  { exposed:   3, edge:  2, firewalled: 890, unreachable:   5, nc: 74, withdrawn: 1 },
    unreachable: { exposed:   1, edge:  0, firewalled:   3, unreachable: 122, nc: 13, withdrawn: 0 },
    entered:     { exposed:   2, edge:  0, firewalled:   4, unreachable:   1, nc:  0, withdrawn: 0 },
  },
};

/* ── variant A's eight states: the 3x3 with every hole named ────────────
   The four new names are the point of the variant. Read them aloud. */
const EIGHT = {
  order: ["exposed", "edge", "netonly_r", "firewalled", "unreachable", "netonly_nr", "internal", "intunreach"],
  label: {
    exposed: "exposed", edge: "edge-only", netonly_r: "internet-reached-only",
    firewalled: "firewalled", unreachable: "unreachable", netonly_nr: "internet-unreached-only",
    internal: "internal-only", intunreach: "internally-unreachable",
  },
  /* which of the eight are two-legged verdicts and which are one-legged readings */
  oneLegged: { netonly_r: 1, netonly_nr: 1, internal: 1, intunreach: 1 },
  split: 3,
  cells: {
    exposed:     { exposed: 130, edge:  2, netonly_r:  0, firewalled:   7, unreachable:   4, netonly_nr:  0, internal:  0, intunreach:  0, nc: 12, withdrawn: 0 },
    edge:        { exposed:   1, edge: 14, netonly_r:  0, firewalled:   1, unreachable:   0, netonly_nr:  0, internal:  0, intunreach:  0, nc:  2, withdrawn: 0 },
    netonly_r:   { exposed:   5, edge:  0, netonly_r: 41, firewalled:   0, unreachable:   0, netonly_nr:  6, internal:  0, intunreach:  0, nc:  3, withdrawn: 0 },
    firewalled:  { exposed:   3, edge:  2, netonly_r:  0, firewalled: 890, unreachable:   5, netonly_nr:  0, internal:  0, intunreach:  0, nc: 74, withdrawn: 1 },
    unreachable: { exposed:   1, edge:  0, netonly_r:  0, firewalled:   3, unreachable: 122, netonly_nr:  0, internal:  0, intunreach:  0, nc: 13, withdrawn: 0 },
    netonly_nr:  { exposed:   0, edge:  0, netonly_r:  4, firewalled:  12, unreachable:   0, netonly_nr: 88, internal:  0, intunreach:  0, nc:  5, withdrawn: 0 },
    internal:    { exposed:   0, edge:  0, netonly_r:  0, firewalled:  19, unreachable:   0, netonly_nr:  0, internal: 96, intunreach:  2, nc:  4, withdrawn: 0 },
    intunreach:  { exposed:   0, edge:  0, netonly_r:  0, firewalled:   0, unreachable:  31, netonly_nr:  0, internal:  1, intunreach: 60, nc:  6, withdrawn: 0 },
    entered:     { exposed:   2, edge:  0, netonly_r:  1, firewalled:   4, unreachable:   1, netonly_nr:  2, internal:  3, intunreach:  1, nc:  0, withdrawn: 0 },
  },
  /* Moves in and out of the four one-legged names. A leg's timeline can only
     ever OPEN into one of these blocks — once it exists and stops, the value
     ages out under the currency bound and the Exposure timeline holds a
     `Gap`, which is not a cell. So the traffic is one-way, and every unit of
     it is our own aperture rather than the estate. */
  apertureMoves: [
    ["internal", "firewalled", 19, "the internet <span class='mono'>Reach</span> timeline opened — the weekly tier got round to this port", true],
    ["intunreach", "unreachable", 31, "the same opening, one row down", true],
    ["netonly_nr", "firewalled", 12, "the internal <span class='mono'>Reach</span> timeline opened", true],
    ["netonly_r", "exposed", 5, "the same opening, one row up", true],
    ["internal", "intunreach", 2, "the internal leg moved — a real world event, sharing the block", false],
    ["firewalled", "internal", 0, "cannot happen: a timeline that existed and stopped ages into a <span class='mono'>Gap</span>, never back into a one-legged name", false],
  ],
};

/* ── variant B's five states: the status quo, with U1 folded ───────────── */
const FIVE = {
  order: ["exposed", "edge", "firewalled", "internal", "unreachable"],
  label: { exposed: "exposed", edge: "edge-only", firewalled: "firewalled",
           internal: "internal-only", unreachable: "unreachable" },
  split: 2,
  cells: {
    exposed:     { exposed: 130, edge:  2, firewalled:   7, internal:  0, unreachable:   4, nc: 12, withdrawn: 0 },
    edge:        { exposed:   1, edge: 14, firewalled:   1, internal:  0, unreachable:   0, nc:  2, withdrawn: 0 },
    firewalled:  { exposed:   3, edge:  2, firewalled: 890, internal: 19, unreachable:   5, nc: 74, withdrawn: 1 },
    internal:    { exposed:   0, edge:  0, firewalled:  11, internal: 96, unreachable:   2, nc:  4, withdrawn: 0 },
    unreachable: { exposed:   1, edge:  0, firewalled:   3, internal:  1, unreachable: 209, nc: 19, withdrawn: 0 },
    entered:     { exposed:   2, edge:  0, firewalled:   4, internal:  3, unreachable:   2, nc:  0, withdrawn: 0 },
  },
  /* the 87 services inside `unreachable` that were never looked at from
     outside — the cell reads "no vantage reaches it" and one leg has no
     timeline at all. */
  falseReassurance: 87,
};

/* ── the one-legged board: a Reach matrix, two values ───────────────────
   ADR-0010 made `Reach` a named Derivation leaf, so there is a modelled
   object to build this over. Before ADR-0010 there was not. */
const REACH = {
  order: ["reached", "notreached"],
  label: { reached: "reached", notreached: "not-reached" },
  split: 99,
  cells: {
    reached:    { reached: 331, notreached:   9, nc: 22, withdrawn: 1 },
    notreached: { reached:   6, notreached: 848, nc: 76, withdrawn: 0 },
    entered:    { reached:   3, notreached:   4, nc:  0, withdrawn: 0 },
  },
};

const N = (n) => n.toLocaleString();

/* ── generic matrix renderer ────────────────────────────────────────────
   One function for every board in the prototype, because a board whose
   totals are authored per variant is a board whose variants can silently
   disagree. Everything below is summed from `M.cells`. */
function matrix(M, opts) {
  const o = opts || {};
  const ord = M.order;
  const cols = ord.concat(["nc", "withdrawn"]);
  const colLabel = (c) => c === "nc" ? "not comparable" : c === "withdrawn" ? "withdrawn" : M.label[c];

  const rowTotal = (r) => cols.reduce((a, c) => a + (M.cells[r][c] || 0), 0);
  const colTotal = (c) => ord.concat(["entered"]).reduce((a, r) => a + (M.cells[r][c] || 0), 0);

  const before   = ord.reduce((a, r) => a + rowTotal(r), 0);
  const entered  = rowTotal("entered");
  const withdrew = colTotal("withdrawn");
  const notComp  = colTotal("nc");
  const now      = cols.filter(c => c !== "withdrawn").reduce((a, c) => a + colTotal(c), 0);

  /* quadrant sums, only meaningful where the axes are grouped by a leg */
  const inA = (s) => ord.indexOf(s) < M.split;          /* internet leg reached */
  const quad = (fromIn, toIn) => ord.filter(f => inA(f) === fromIn)
    .reduce((a, f) => a + ord.filter(t => inA(t) === toIn)
      .reduce((b, t) => b + (f === t ? 0 : (M.cells[f][t] || 0)), 0), 0);

  const cellCls = (f, t) => {
    if (t === "nc") return "nc";
    if (t === "withdrawn") return "wd";
    if (f === t) return "held";
    if (!o.quadrants) return "";
    if (!inA(f) && inA(t)) return "q-esc";       /* internet leg opened */
    if (inA(f) && !inA(t)) return "q-de";        /* internet leg closed */
    return "";
  };

  const head = `<tr><th style="width:190px"></th>` +
    cols.map((c, i) => {
      const g = (o.quadrants && i === M.split) ? " gcol" : "";
      const dash = c === "nc" ? ` style="border-left:1px dashed var(--border)"` : "";
      return `<th class="ch${g}"${dash}>${colLabel(c)}</th>`;
    }).join("") +
    `<th class="ch" style="border-left: var(--rule)">was</th></tr>`;

  const body = ord.concat(["entered"]).map((f, ri) => {
    const grow = (o.quadrants && ri === M.split) ? " grow" : "";
    const isEnt = f === "entered";
    const rl = isEnt
      ? `<th class="rh" style="border-top: var(--rule)"><span class="muted">entered</span></th>`
      : `<th class="rh"${o.legs ? ` title="${M.legs ? M.legs[f] : ""}"` : ""}>${M.label[f]}</th>`;
    return `<tr class="${grow}">${rl}` + cols.map((t, ci) => {
      const v = M.cells[f][t] || 0;
      const g = (o.quadrants && ci === M.split) ? " gcol" : "";
      const hot = (o.quadrants && !isEnt && !inA(f) && inA(t) && v > 0) ? " hot" : "";
      const cls = (isEnt ? (t === "nc" ? "nc" : t === "withdrawn" ? "wd" : "") : cellCls(f, t)) + g + hot;
      const txt = v === 0 ? `<span class="zero">&middot;</span>` : N(v);
      return `<td class="${cls}">${txt}</td>`;
    }).join("") +
      `<td style="border-left: var(--rule)" class="muted">${isEnt ? N(entered) : N(rowTotal(f))}</td></tr>`;
  }).join("");

  const foot = `<tr class="grow"><th class="rh" style="border-top: var(--rule-ink-heavy)"><span class="muted">is now</span></th>` +
    cols.map((c, i) => {
      const g = (o.quadrants && i === M.split) ? " gcol" : "";
      return `<td class="muted${g}" style="border-top: var(--rule-ink-heavy)">${c === "withdrawn" ? N(withdrew) : N(colTotal(c))}</td>`;
    }).join("") +
    `<td style="border-top: var(--rule-ink-heavy); border-left: var(--rule)" class="muted">${N(now)}</td></tr>`;

  const recon = `${N(before)} before + ${N(entered)} entered &minus; ${N(withdrew)} withdrawn = <b>${N(now)} now</b>, of which ${N(notComp)} not comparable`;

  return {
    html: `<table class="board"><thead>${head}</thead><tbody>${body}${foot}</tbody></table>`,
    recon, before, entered, withdrew, notComp, now, colTotal,
    escalated: o.quadrants ? quad(false, true) : null,
    deescalated: o.quadrants ? quad(true, false) : null,
    /* the two on-diagonal blocks: the internet leg held, the internal one moved */
    sameLeg: o.quadrants ? quad(true, true) + quad(false, false) : null,
  };
}

/* the vantage panel — which classes this install actually runs */
function vantages(fill) {
  const line = (nm, cls, state) => {
    const col = state === "ok" ? "var(--ok)" : state === "down" ? "var(--danger)" : "var(--text-faint)";
    const txt = state === "ok" ? "verified 2m" : state === "down" ? "unavailable 3d" : "not configured";
    return `<div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
      <span class="dot" style="background:${col}"></span>
      <span class="mono">${nm}</span>
      <span class="ml" style="margin-left:auto">${cls}</span>
      <span class="mono faint" style="width:110px;text-align:right">${txt}</span></div>`;
  };
  const rows = {
    both:         line("internet-01", "internet", "ok") + line("internal-01", "internal", "ok"),
    "no-internet": line("&mdash;", "internet", "none") + line("internal-01", "internal", "ok"),
    "no-internal": line("internet-01", "internet", "ok") + line("&mdash;", "internal", "none"),
    gap:          line("internet-01", "internet", "down") + line("internal-01", "internal", "ok"),
  }[fill];
  return `<div class="card"><div class="card-h"><h2 style="font-size:var(--text-base)">Vantage classes</h2></div>
    <div style="padding: var(--space-3) var(--space-4)">${rows}</div></div>`;
}

        <p>#28's third density is <i>the</i> <span class="mono">precond</span> <i>treatment: no board

        <p>So the third density splits by what the precondition costs. <b>The value is gone</b>

        <span class="mono">Subjects</span> screen never to render alike get one shape and two
        statements: <i>we never looked</i> and <i>we stopped looking</i>.</p>
        <p><b>And there is no state to name.</b> The question the ticket asked &mdash; what does the
        board render in a cell with no name &mdash; dissolves, because the one-legged readings were
        never cells of this board. They are cells of a different, smaller board over the leg that
        exists.</p>
      </div>
    </div>`;
  },

  render(fill) {
    if (fill === "both") return this.twoLegged();
    if (fill === "no-internet") return this.oneLegged("internal", false);
    if (fill === "no-internal") return this.oneLegged("internet", false);
    return this.oneLegged("internal", true);
  },
};

/* ─────────────────────────── switcher ─────────────────────────── */
const VARIANTS = { A, B, C };
const KEYS = ["A", "B", "C"];
const FILLS = ["both", "no-internet", "no-internal", "gap"];

function read() {
  const q = new URLSearchParams(location.search);
  const v = (q.get("variant") || "A").toUpperCase();
  const f = q.get("fill") || "both";
  return { v: KEYS.includes(v) ? v : "A", f: FILLS.includes(f) ? f : "both" };
}

function draw() {
  const { v, f } = read();
  const V = VARIANTS[v];
  document.getElementById("vkey").textContent = v;
  document.getElementById("vname").textContent = V.name;
  document.getElementById("fills").innerHTML =
    FILLS.map(x => `<button data-fill="${x}" class="${x === f ? "on" : ""}">${x}</button>`).join("");
  document.getElementById("fills").querySelectorAll("button").forEach(b =>
    b.onclick = () => go(v, b.dataset.fill));

  /* A and B are drawn only for the two-legged install: the whole point of
     them is what they do to the state axis, and the axis is the same
     regardless of fill. C is the variant with something to say per fill. */
  const eff = (v === "C") ? f : "both";
  const note = (v !== "C" && f !== "both")
    ? `<div class="d1" style="margin-bottom:var(--space-4)">Variant ${v} is drawn for the two-legged install only &mdash; switch to C to see the <span class="mono">${f}</span> case.</div>`
    : "";
  document.getElementById("app").innerHTML =
    chrome(note + V.render(eff), "prototype &mdash; issue #45");
  document.title = `verge-asm — ${v}: ${V.name}`;
}

function go(v, f) {
  history.replaceState(null, "", `?variant=${v}&fill=${f}`);
  draw();
}

document.getElementById("prev").onclick = () => {
  const { v, f } = read(); go(KEYS[(KEYS.indexOf(v) + KEYS.length - 1) % KEYS.length], f);
};
document.getElementById("next").onclick = () => {
  const { v, f } = read(); go(KEYS[(KEYS.indexOf(v) + 1) % KEYS.length], f);
};
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "ArrowRight") document.getElementById("next").click();
});

draw();
</script>
</body>
</html>
