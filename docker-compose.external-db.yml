# Point web and worker at an external Postgres, over a connection they verify.
#
#   docker compose -f docker-compose.yml -f docker-compose.external-db.yml up -d
#
# The base docker-compose.yml is never edited. Everything this mode needs is
# here (packaging-and-configuration.md §9).
#
# Needs Docker Compose v2.24.0 or newer, for the `!reset` merge tag.
#
# POSTGRES_PASSWORD is STILL REQUIRED, and nothing reads it. Compose
# interpolates the base file before it merges this one, so the base guard fires
# either way (docker/compose#11925). Set it to a random throwaway value.
#
# Do NOT put sslmode in DATABASE_URL. An explicit DSN parameter beats PGSSLMODE
# below, and turns verification off with no error at all (§9.5).

services:
  # The bundled Postgres goes away. That takes two edits, not one: `depends_on`
  # merges additively, so the edges below must be cleared as well, or the merged
  # model fails with `service "web" depends on undefined service "postgres"`.
  postgres: !reset null

  web:
    depends_on: !reset null
    environment:
      # Fail-closed. The DSN carries the database credential (§3).
      DATABASE_URL: ${DATABASE_URL:?}
      # pgx reads both of these from the environment. PGSSLROOTCERT is not a
      # dial: the operator supplies the file, the path inside is ours.
      PGSSLMODE: ${POSTGRES_SSLMODE:-verify-full}
      PGSSLROOTCERT: /etc/verge/ca/root.crt
    volumes:
      # The CA root that anchors verification: read-only, single file,
      # operator-supplied from the host, in no image (ADR-0132).
      #
      # Two guards layer here, and neither replaces the other. `:?` fails at
      # interpolation when the variable is unset. `create_host_path: false`
      # fails at `up` when it is set but wrong — the default is `true`, and a
      # short-syntax bind would silently create an empty DIRECTORY at a
      # mistyped path. `docker compose config` exits 0 on a missing source, so
      # no parse-time gate stands in for the second guard.
      - type: bind
        source: ${POSTGRES_SSLROOTCERT_SRC:?}
        target: /etc/verge/ca/root.crt
        read_only: true
        bind:
          create_host_path: false

  # web and worker repeat the same three variables and the same bind. A YAML
  # anchor would fold them, and the tidy form is the risky one: an alias over a
  # fragment holding `!reset` puts a compose-go custom tag inside an alias node,
  # in the one file whose whole risk surface is merge tags. `<<` also does not
  # deep-merge, so a later service-local `environment:` would drop the aliased
  # mapping without a word. The repetition is cheaper than either failure.
  worker:
    depends_on: !reset null
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      PGSSLMODE: ${POSTGRES_SSLMODE:-verify-full}
      PGSSLROOTCERT: /etc/verge/ca/root.crt
    volumes:
      # Both services open the pool, so both mount the anchor (ADR-0132 §3).
      - type: bind
        source: ${POSTGRES_SSLROOTCERT_SRC:?}
        target: /etc/verge/ca/root.crt
        read_only: true
        bind:
          # SCRATCH ONLY (#1021): worker's guard is flipped. This is the
          # single-service drift under test. Never merge this line.
          create_host_path: true

# The bundled Postgres is gone, so its data volume is too. web-state,
# worker-state and transcript-key still come from the base file.
volumes:
  pgdata: !reset null
