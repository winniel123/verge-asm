<!-- @dsCard group="Spacing" viewport="700x170" subtitle="4px grid, 2 → 64" name="Spacing scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.wrap{padding:18px 20px;display:flex;align-items:flex-end;gap:14px}
.s{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--accent-soft);border:1px solid var(--accent);width:28px}
.s code{font:400 10px var(--font-mono);color:var(--text-muted)}
</style></head><body>
<div class="wrap">
  <div class="s"><div class="bar" style="height:2px"></div><code>2</code></div>
  <div class="s"><div class="bar" style="height:4px"></div><code>4</code></div>
  <div class="s"><div class="bar" style="height:8px"></div><code>8</code></div>
  <div class="s"><div class="bar" style="height:12px"></div><code>12</code></div>
  <div class="s"><div class="bar" style="height:16px"></div><code>16</code></div>
  <div class="s"><div class="bar" style="height:20px"></div><code>20</code></div>
  <div class="s"><div class="bar" style="height:24px"></div><code>24</code></div>
  <div class="s"><div class="bar" style="height:32px"></div><code>32</code></div>
  <div class="s"><div class="bar" style="height:40px"></div><code>40</code></div>
  <div class="s"><div class="bar" style="height:48px"></div><code>48</code></div>
  <div class="s"><div class="bar" style="height:64px"></div><code>64</code></div>
  <div style="margin-left:auto;font:400 11px/1.6 var(--font-mono);color:var(--text-muted)">card pad 16<br>page pad 24<br>row pad 9/16</div>
</div>
</body></html>
