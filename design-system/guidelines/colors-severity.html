<!-- @dsCard group="Colors" viewport="700x170" subtitle="Critical → Info. The loudest color on any screen" name="Severity scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.row{display:flex;gap:8px;padding:16px}
.sw{flex:1}
.chip{height:56px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.badge{font:600 10px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;color:#fff}
.sw b{display:block;font:var(--weight-semibold) 11px/1.4 var(--font-sans);margin-top:6px}
.sw code{font:400 10px/1.4 var(--font-mono);color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--sev-critical)"><span class="badge" style="background:#fff;color:var(--sev-critical)">Critical</span></div><b>sev-critical</b><code>#c92a2a</code></div>
  <div class="sw"><div class="chip" style="background:var(--sev-high)"><span class="badge" style="background:#fff;color:var(--sev-high)">High</span></div><b>sev-high</b><code>#e8590c</code></div>
  <div class="sw"><div class="chip" style="background:var(--sev-medium)"><span class="badge" style="background:var(--ink);color:var(--sev-medium)">Medium</span></div><b>sev-medium</b><code>#ffd43b · ink text</code></div>
  <div class="sw"><div class="chip" style="background:var(--sev-low)"><span class="badge" style="background:#fff;color:var(--sev-low)">Low</span></div><b>sev-low</b><code>#1971c2</code></div>
  <div class="sw"><div class="chip" style="background:var(--sev-info)"><span class="badge" style="background:#fff;color:var(--sev-info)">Info</span></div><b>sev-info</b><code>#868e96</code></div>
</div>
</body></html>
