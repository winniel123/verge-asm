<!-- @dsCard group="Colors" viewport="700x170" subtitle="ok / warn / danger with soft fills" name="Status semantics" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.row{display:flex;gap:8px;padding:16px}
.pair{flex:1;border:1px solid var(--border)}
.top{height:44px}
.bot{height:32px;display:flex;align-items:center;padding:0 10px;font:500 11px var(--font-mono)}
.lab{font:var(--weight-semibold) 11px/1.4 var(--font-sans);margin:6px 0 0}
code{font:400 10px/1.4 var(--font-mono);color:var(--text-muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
</style></head><body>
<div class="row">
  <div style="flex:1"><div class="pair"><div class="top" style="background:var(--ok)"></div><div class="bot" style="background:var(--ok-soft);color:var(--ok)"><span class="dot" style="background:var(--ok);animation:verge-pulse 1.6s infinite"></span>scan running</div></div><div class="lab">ok</div><code>#2f9e44 / #e7f3e9</code></div>
  <div style="flex:1"><div class="pair"><div class="top" style="background:var(--warn)"></div><div class="bot" style="background:var(--warn-soft);color:var(--warn)"><span class="dot" style="background:var(--warn)"></span>cert expires 6d</div></div><div class="lab">warn</div><code>#b08800 / #faf3d9</code></div>
  <div style="flex:1"><div class="pair"><div class="top" style="background:var(--danger)"></div><div class="bot" style="background:var(--danger-soft);color:var(--danger)"><span class="dot" style="background:var(--danger)"></span>scan failed</div></div><div class="lab">danger</div><code>#c92a2a / #faeaea</code></div>
</div>
</body></html>
