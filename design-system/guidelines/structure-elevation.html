<!-- @dsCard group="Structure" viewport="700x190" subtitle="No soft shadows — ink border + hard offset" name="Elevation" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.wrap{padding:22px 24px;display:flex;gap:32px;align-items:flex-start}
code{font:400 10px var(--font-mono);color:var(--text-muted)}
</style></head><body>
<div class="wrap">
  <div>
    <div style="border:1px solid var(--border-ink);background:var(--surface);box-shadow:var(--shadow-hard);padding:14px 16px;width:250px">
      <div style="font:600 14px var(--font-sans);margin-bottom:4px">Delete target?</div>
      <div style="font-size:12px;color:var(--text-muted)">Historical findings are kept.</div>
    </div>
    <code style="display:block;margin-top:12px">--shadow-hard · 6px 6px 0 rgba(22,22,15,.1) · dialogs, menus</code>
  </div>
  <div>
    <div style="border:1px solid var(--border-ink);background:var(--surface-ink);color:var(--text-on-ink);box-shadow:var(--shadow-hard-sm);padding:6px 10px;font:500 11px var(--font-mono);width:max-content">first seen 2026-06-02</div>
    <code style="display:block;margin-top:12px">--shadow-hard-sm · 3px 3px 0 · tooltips, dropdowns</code>
  </div>
  <div style="flex:1">
    <div style="border:1px solid var(--border);background:var(--surface);padding:14px 16px;font-size:12px;color:var(--text-muted)">Everything else is flat.</div>
  </div>
</div>
</body></html>
