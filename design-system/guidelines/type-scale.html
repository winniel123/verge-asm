<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.wrap{padding:14px 20px}
.r{display:flex;align-items:baseline;gap:16px;padding:3px 0}
.r code{font:400 10px var(--font-mono);color:var(--text-muted);width:150px;flex:none}
</style></head><body>
<div class="wrap">
  <div class="r"><code>--text-4xl · 48</code><span style="font:700 48px/1.05 var(--font-sans);letter-spacing:-.01em">Hero</span></div>
  <div class="r"><code>--text-3xl · 34</code><span style="font:700 34px/1.15 var(--font-sans);letter-spacing:-.01em">Marketing heading</span></div>
  <div class="r"><code>--text-2xl · 26 mono</code><span style="font:600 26px/1.15 var(--font-mono)">1,284</span></div>
  <div class="r"><code>--text-xl · 20</code><span style="font:700 20px/1.2 var(--font-sans)">Page title</span></div>
  <div class="r"><code>--text-lg · 16</code><span style="font:600 16px/1.3 var(--font-sans)">Card title</span></div>
  <div class="r"><code>--text-md · 14</code><span style="font:600 14px/1.35 var(--font-sans)">Section title</span></div>
  <div class="r"><code>--text-base · 13</code><span style="font:400 13px/1.55 var(--font-sans)">Body — the app default</span></div>
  <div class="r"><code>--text-sm · 12</code><span style="font:400 12px/1.35 var(--font-sans)">Dense cells, captions</span></div>
  <div class="r"><code>--text-2xs · 10 mono</code><span style="font:600 10px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)">Micro-label</span></div>
</div>
</body></html>
