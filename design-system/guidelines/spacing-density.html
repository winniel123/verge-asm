<!-- @dsCard group="Spacing" viewport="700x190" subtitle="Control heights and table density" name="Density metrics" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.wrap{padding:16px 20px;display:flex;gap:24px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.ctl{display:flex;align-items:center;padding:0 12px;border:1px solid var(--border-ink);background:var(--surface);font:500 13px var(--font-sans)}
code{font:400 10px var(--font-mono);color:var(--text-muted)}
table{border-collapse:collapse;background:var(--surface);border:1px solid var(--border);flex:1}
td{padding:9px 16px;border-top:1px solid var(--border-soft);font:400 12px var(--font-sans)}
td.m{font:400 12px var(--font-mono);color:var(--text-muted)}
th{padding:8px 16px;border-bottom:2px solid var(--border-ink);font:600 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);text-align:left}
</style></head><body>
<div class="wrap">
  <div class="col">
    <div class="ctl" style="height:26px;font-size:12px">compact 26</div>
    <div class="ctl" style="height:32px">default 32</div>
    <div class="ctl" style="height:40px">marketing 40</div>
    <code>--control-h(-sm/-lg)</code>
  </div>
  <table>
    <tr><th>Host</th><th>Service</th></tr>
    <tr><td class="m">edge-gw-03</td><td>Apache 2.4.58</td></tr>
    <tr><td class="m">vpn.acmecorp.io</td><td>OpenVPN 2.6</td></tr>
    <tr><td class="m">203.0.113.44</td><td>VNC :5900</td></tr>
  </table>
</div>
</body></html>
