<!-- @dsCard group="Colors" viewport="700x170" subtitle="Paper, surfaces, ink and text neutrals" name="Neutrals" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.row{display:flex;gap:8px;padding:16px}
.sw{flex:1}
.chip{height:64px;border:1px solid var(--border)}
.sw b{display:block;font:var(--weight-semibold) 11px/1.4 var(--font-sans);margin-top:6px}
.sw code{font:400 10px/1.4 var(--font-mono);color:var(--text-muted)}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--paper)"></div><b>paper</b><code>#f7f7f4 · page</code></div>
  <div class="sw"><div class="chip" style="background:var(--surface)"></div><b>surface</b><code>#ffffff · cards</code></div>
  <div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><b>sunken</b><code>#f2f2ee · wells, hover</code></div>
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><b>ink</b><code>#16160f · headings, primary</code></div>
  <div class="sw"><div class="chip" style="background:var(--text)"></div><b>text</b><code>#1a1a16 · body</code></div>
  <div class="sw"><div class="chip" style="background:var(--text-muted)"></div><b>muted</b><code>#6b6b62 · secondary</code></div>
  <div class="sw"><div class="chip" style="background:var(--text-faint)"></div><b>faint</b><code>#9a9a90 · timestamps</code></div>
</div>
</body></html>
