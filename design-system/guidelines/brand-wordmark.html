<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.wrap{padding:18px 20px;display:flex;align-items:center;gap:40px}
.wm{display:flex;align-items:baseline;gap:7px}
.chip{font:600 11px var(--font-mono);color:var(--paper);background:var(--ink);padding:2px 6px}
code{font:400 10px/1.5 var(--font-mono);color:var(--text-muted)}
</style></head><body>
<div class="wrap">
  <div class="wm" style="font:700 28px var(--font-sans);letter-spacing:-.01em">Verge<span class="chip" style="font-size:15px;padding:3px 8px">ASM</span></div>
  <div class="wm" style="font:700 15px var(--font-sans)">Verge<span class="chip">ASM</span></div>
  <div style="background:var(--surface-ink);padding:12px 16px"><div class="wm" style="font:700 15px var(--font-sans);color:var(--text-on-ink)">Verge<span class="chip" style="background:var(--paper);color:var(--ink)">ASM</span></div></div>
  <code style="max-width:180px">Sans bold + mono chip. Never letterspaced, never outlined. Do not invent a mark.</code>
</div>
</body></html>
