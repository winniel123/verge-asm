<!-- @dsCard group="App" viewport="1440x900" subtitle="Interactive console: dashboard, inventory, findings, graph, reports" name="Verge ASM console" -->
<!DOCTYPE html><html><head>
<meta charset="utf-8"><title>Verge ASM — console</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../components/dev-loader.js" data-base="../../"></script>
<script src="./data.js"></script>
<script>
window.NS=(function(){for(var k in window){try{var v=window[k];if(v&&typeof v==="object"&&v.Button&&v.Table&&v.TopNav)return v}catch(e){}}return {}})();
window.VergeApp={};
</script>
<script>__runJsx(["./Dashboard.jsx","./Inventory.jsx","./Findings.jsx","./GraphView.jsx","./Reports.jsx"]);</script>
</head><body><div id="root"></div>
<script type="text/jsx-run">
const { TopNav, Footer, StatusDot, Button, Dialog, Input, Select, Checkbox, Toast } = window.NS;

function App() {
  const [nav, setNav] = React.useState("Dashboard");
  const [findingId, setFindingId] = React.useState(null);
  const [scanOpen, setScanOpen] = React.useState(false);
  const [toasts, setToasts] = React.useState([]);
  const [statuses, setStatuses] = React.useState({});
  const [sub, setSub] = React.useState(true);
  const toast = (title, detail) => {
    const id = Date.now();
    setToasts((t) => [...t, { id, title, detail }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 5000);
  };
  const openFinding = (id) => { setFindingId(id); setNav("Findings"); };
  const A = window.VergeApp;
  const screen =
    nav === "Dashboard" ? <A.Dashboard openFinding={openFinding} /> :
    nav === "Inventory" ? <A.Inventory /> :
    nav === "Findings" ? <A.Findings key={findingId || "f"} initialId={findingId} statuses={statuses} setStatuses={setStatuses} /> :
    nav === "Graph" ? <A.GraphView /> :
    <A.Reports toast={toast} />;
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: "var(--paper)" }}>
      <TopNav
        items={["Dashboard", "Inventory", "Findings", "Graph", "Reports"].map((l) => ({ label: l, active: l === nav }))}
        onSelect={(it) => { setFindingId(null); setNav(it.label); }}
        status={<StatusDot tone="ok" pulse label="scan running" />}
        right={<Button size="sm" onClick={() => setScanOpen(true)}>+ New scan</Button>} />
      <main style={{ flex: 1, width: "100%", maxWidth: 1440, margin: "0 auto", boxSizing: "border-box", padding: 24 }}>
        {screen}
      </main>
      <Footer links={[{ label: "Docs" }, { label: "Report an issue" }, { label: "Changelog" }]} stars="4,218" />
      <Dialog open={scanOpen} title="New scan" onClose={() => setScanOpen(false)}
        footer={<React.Fragment>
          <Button variant="secondary" onClick={() => setScanOpen(false)}>Cancel</Button>
          <Button onClick={() => { setScanOpen(false); toast("Scan queued", "acmecorp.io · full profile · position 1"); }}>Run scan</Button>
        </React.Fragment>}>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <Input label="Target" mono defaultValue="acmecorp.io" hint="Domain, subdomain, IP, or CIDR range" />
          <Select label="Profile" options={["Full — discovery + fingerprint + checks", "Passive only", "Ports + TLS only"]} />
          <Checkbox label="Include subdomains" checked={sub} onChange={setSub} />
        </div>
      </Dialog>
      <div style={{ position: "fixed", right: 16, bottom: 16, display: "flex", flexDirection: "column", gap: 8, zIndex: 200 }}>
        {toasts.map((t) => <Toast key={t.id} tone="ok" title={t.title} detail={t.detail} onDismiss={() => setToasts((x) => x.filter((y) => y.id !== t.id))} />)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>__runJsxTags();</script></body></html>
