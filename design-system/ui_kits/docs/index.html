<!-- @dsCard group="Docs" viewport="1440x900" subtitle="Docs site: sidebar nav, prose, code blocks, config table" name="docs.verge-asm.org" -->
<!DOCTYPE html><html><head>
<meta charset="utf-8"><title>Installation — Verge ASM docs</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../components/dev-loader.js" data-base="../../"></script>
<script>
window.NS=(function(){for(var k in window){try{var v=window[k];if(v&&typeof v==="object"&&v.Button&&v.Table&&v.TopNav)return v}catch(e){}}return {}})();
</script>
</head><body><div id="root"></div>
<script type="text/jsx-run">
const { Wordmark, Input, Select, Badge, Table, Button } = window.NS;

const NAV = [
  ["Getting started", ["Overview", "Installation", "First scan", "Upgrading"], "Installation"],
  ["Configuration", ["verge.yaml", "Scan profiles", "Notifications"], null],
  ["Scanning", ["Targets", "Discovery", "Fingerprinting", "Checks"], null],
  ["Findings", ["Severity model", "Triage workflow", "Webhooks"], null],
  ["Reference", ["REST API", "CLI", "Exit codes"], null],
];

function CodeBlock({ title, children }) {
  return (
    <div style={{ border: "1px solid var(--border-ink)", background: "var(--surface-ink)", margin: "18px 0" }}>
      {title && <div style={{ padding: "7px 14px", borderBottom: "1px solid #2e2e26", font: "600 10px var(--font-mono)", letterSpacing: "0.06em", textTransform: "uppercase", color: "#8a8a7e" }}>{title}</div>}
      <pre style={{ margin: 0, padding: "14px 16px", font: "400 12.5px/1.7 var(--font-mono)", color: "var(--text-on-ink)", overflow: "auto" }}>{children}</pre>
    </div>
  );
}

function DocsPage() {
  return (
    <div data-screen-label="Docs — Installation" style={{ minHeight: "100vh", background: "var(--surface)", display: "flex", flexDirection: "column" }}>
      <header style={{ display: "flex", alignItems: "center", gap: 16, padding: "0 24px", height: 52, borderBottom: "2px solid var(--border-ink)", background: "var(--surface)", flex: "none" }}>
        <Wordmark />
        <span style={{ font: "600 10px var(--font-mono)", letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", borderLeft: "1px solid var(--border)", paddingLeft: 16 }}>Docs</span>
        <Input mono placeholder="Search docs — /" size="sm" style={{ width: 260, marginLeft: 24 }} />
        <div style={{ marginLeft: "auto", display: "flex", gap: 12, alignItems: "center" }}>
          <Select size="sm" options={["v0.9 (current)", "v0.8", "main (dev)"]} style={{ width: 130 }} />
          <a href="#" style={{ font: "500 13px var(--font-sans)" }}>GitHub ↗</a>
        </div>
      </header>
      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "250px 1fr 200px", maxWidth: 1440, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
        <aside style={{ borderRight: "1px solid var(--border)", padding: "24px 0 40px", background: "var(--paper)" }}>
          {NAV.map(([group, pages, activePage]) => (
            <div key={group} style={{ marginBottom: 22 }}>
              <div style={{ font: "600 10px var(--font-mono)", letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", padding: "0 20px", marginBottom: 7 }}>{group}</div>
              {pages.map((p) => (
                <a key={p} href="#" style={{
                  display: "block", padding: "5px 20px", font: "400 13px var(--font-sans)", textDecoration: "none",
                  color: p === activePage ? "var(--accent)" : "var(--text)",
                  background: p === activePage ? "var(--accent-soft)" : "transparent",
                  boxShadow: p === activePage ? "inset 2px 0 0 var(--accent)" : "none",
                }}>{p}</a>
              ))}
            </div>
          ))}
        </aside>
        <main style={{ padding: "36px 48px 64px", maxWidth: 760, boxSizing: "content-box" }}>
          <div style={{ font: "600 10px var(--font-mono)", letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 10 }}>Getting started / Installation</div>
          <h1 style={{ font: "700 34px/1.15 var(--font-sans)", letterSpacing: "-0.01em", color: "var(--ink)", margin: "0 0 14px" }}>Installation</h1>
          <p style={{ font: "400 14px/1.65 var(--font-sans)", color: "var(--text)", margin: "0 0 6px" }}>
            Verge ships as a single container or a static binary. Both include the scanner, the web console, and an embedded database — Postgres is optional until ~50k assets.
          </p>
          <div style={{ display: "flex", gap: 8, margin: "14px 0 6px" }}>
            <Badge tone="accent">Docker</Badge><Badge>binary</Badge><Badge>docker-compose</Badge><Badge>Helm (community)</Badge>
          </div>
          <h2 style={{ font: "600 20px/1.25 var(--font-sans)", color: "var(--ink)", margin: "30px 0 8px" }}>Docker</h2>
          <p style={{ font: "400 14px/1.65 var(--font-sans)", margin: "0 0 4px" }}>Pull and run the latest release. The console listens on <code style={{ font: "500 12.5px var(--font-mono)", background: "var(--surface-sunken)", padding: "1px 5px" }}>:8443</code> with a self-signed certificate.</p>
          <CodeBlock title="shell">{`$ docker run -d --name verge \\
    -p 8443:8443 \\
    -v verge-data:/var/lib/verge \\
    vergeasm/verge:0.9.2

$ docker logs -f verge
verge 0.9.2 · listening on :8443
admin token: 9f2c-e1a0-44b7  (shown once)`}</CodeBlock>
          <div style={{ background: "var(--accent-soft)", borderLeft: "none", border: "1px solid var(--accent)", padding: "12px 16px", font: "400 13px/1.55 var(--font-sans)", color: "var(--text)", margin: "18px 0" }}>
            <span style={{ font: "600 10px var(--font-mono)", letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--accent)", display: "block", marginBottom: 4 }}>Note</span>
            The admin token is printed once at first boot. Store it — there is no password reset without database access.
          </div>
          <h2 style={{ font: "600 20px/1.25 var(--font-sans)", color: "var(--ink)", margin: "30px 0 8px" }}>Configuration flags</h2>
          <p style={{ font: "400 14px/1.65 var(--font-sans)", margin: "0 0 12px" }}>Every flag maps to an environment variable with the <code style={{ font: "500 12.5px var(--font-mono)", background: "var(--surface-sunken)", padding: "1px 5px" }}>VERGE_</code> prefix.</p>
          <div style={{ border: "1px solid var(--border)" }}>
            <Table rowKey="flag" columns={[
              { key: "flag", label: "Flag", mono: true, width: 200, nowrap: true },
              { key: "def", label: "Default", mono: true, muted: true, width: 130 },
              { key: "desc", label: "Description" },
            ]} rows={[
              { flag: "--listen", def: ":8443", desc: "Console bind address." },
              { flag: "--db", def: "embedded", desc: "Postgres DSN, or \"embedded\" for the bundled store." },
              { flag: "--scan-interval", def: "6h", desc: "Base interval for scheduled scans." },
              { flag: "--rate-limit", def: "150/s", desc: "Global outbound request ceiling." },
            ]} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 44, borderTop: "1px solid var(--border)", paddingTop: 16 }}>
            <a href="#" style={{ font: "500 13px var(--font-sans)" }}>← Overview</a>
            <a href="#" style={{ font: "500 13px var(--font-sans)" }}>First scan →</a>
          </div>
        </main>
        <aside style={{ padding: "40px 24px 0 0" }}>
          <div style={{ font: "600 10px var(--font-mono)", letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--text-muted)", marginBottom: 8 }}>On this page</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, borderLeft: "1px solid var(--border)", paddingLeft: 14 }}>
            {["Docker", "Static binary", "docker-compose", "Configuration flags"].map((h, i) => (
              <a key={h} href="#" style={{ font: "400 12px var(--font-sans)", color: i === 0 ? "var(--accent)" : "var(--text-muted)" }}>{h}</a>
            ))}
          </div>
        </aside>
      </div>
      <footer style={{ display: "flex", gap: 18, padding: "12px 24px", borderTop: "1px solid var(--border)", font: "400 11px var(--font-mono)", color: "var(--text-muted)", background: "var(--surface)" }}>
        <span>v0.9.2</span><span>AGPL-3.0</span><a href="#">Edit this page on GitHub</a>
        <span style={{ marginLeft: "auto" }}>built with the community</span>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<DocsPage />);
</script>
<script>__runJsxTags();</script></body></html>
