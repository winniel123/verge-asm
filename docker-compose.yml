x-security: &security
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  web:
    build:
      context: .
      target: web
    <<: *security
    user: "65532:65532"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-verge}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-verge}?sslmode=disable
      VERGE_LISTEN_ADDR: ":8080"
      # First-boot bootstrap: with no accounts, web logs a single-use setup
      # token. Set VERGE_SETUP_TOKEN to pin it instead of reading the logs.
      VERGE_SETUP_TOKEN: ${VERGE_SETUP_TOKEN:-}
      # Set to true when a TLS-terminating proxy fronts web, so the session
      # cookie is marked Secure even though web itself sees plain HTTP.
      VERGE_SECURE_COOKIES: ${VERGE_SECURE_COOKIES:-}
    ports:
      - "8080:8080"
    volumes:
      # The session signing key lives here and never in Postgres (§4.3).
      - web-state:/app/state
      # The instance transcript key: one symmetric key shared by web (reader) and
      # worker (writer), sealing the Transcript corpus at rest. Never in Postgres
      # (raw-job-output spec §5.3).
      - transcript-key:/app/transcript-key
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    <<: *security
    user: "65532:65532"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-verge}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-verge}?sslmode=disable
      VERGE_PROBER_PATH: "/app/prober"
    volumes:
      - worker-state:/app/state
      # Same shared transcript key as web mounts: the worker seals the Transcript
      # streams under it before writing them (raw-job-output spec §5.3).
      - transcript-key:/app/transcript-key
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # tag postgres:16-bookworm pinned by manifest-list digest (#333)
    image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
    <<: *security
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-verge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verge} -d ${POSTGRES_DB:-verge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  web-state:
  worker-state:
  # One instance key, mounted by both web and worker, seals the Transcript corpus
  # at rest. Kept off Postgres and out of backups so no ciphertext leaves without
  # its key and no restore inherits data it cannot decrypt (spec §5.3).
  transcript-key:
