x-security: &security
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  web:
    build:
      context: .
      target: web
    <<: *security
    user: "65532:65532"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-verge}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-verge}?sslmode=disable
      VERGE_LISTEN_ADDR: ":8080"
      # First-boot bootstrap: with no accounts, web logs a single-use setup
      # token. Set VERGE_SETUP_TOKEN to pin it instead of reading the logs.
      VERGE_SETUP_TOKEN: ${VERGE_SETUP_TOKEN:-}
      # Set to true when a TLS-terminating proxy fronts web, so the session
      # cookie is marked Secure even though web itself sees plain HTTP.
      VERGE_SECURE_COOKIES: ${VERGE_SECURE_COOKIES:-}
      # Passed to BOTH services from one variable on purpose. It configures the
      # worker's stale-`running` reaper, and the hot cadence-lag gate (#1114) refuses
      # to arm without that reaper. If web read a different value than worker, a
      # manual trigger would gate on a reaper that is not running, which is the
      # permanent-skip configuration the gate exists to refuse. A value <= 0 disables
      # both.
      VERGE_STALE_JOB_TIMEOUT: ${VERGE_STALE_JOB_TIMEOUT:-}
    ports:
      # Bind loopback only by default, so the operator UI is not published on
      # every host address. Front it with a proxy, or set VERGE_BIND=0.0.0.0
      # (or a specific address) for direct host/LAN access.
      - "${VERGE_BIND:-127.0.0.1}:8080:8080"
    volumes:
      # The session signing key lives here and never in Postgres (§4.3).
      - web-state:/app/state
      # The instance transcript key: one symmetric key shared by web (reader) and
      # worker (writer), sealing the Transcript corpus at rest. Never in Postgres
      # (raw-job-output spec §5.3).
      - transcript-key:/app/transcript-key
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # SINGLE-INSTANCE BY DESIGN. Do not `--scale worker=N` (#1092). The active-scan
  # safety budget is enforced per prober process, and this service execs a fresh
  # prober per job. One worker drains its queue serially, so one prober is live at
  # a time and the declared ceilings hold for the instance. N workers run N probers
  # that share no state, so the instance emits up to N times the rate every Batch
  # still records. Nothing warns and nothing refuses. See docs/guides/running.md.
  worker:
    build:
      context: .
      target: worker
    <<: *security
    user: "65532:65532"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-verge}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-verge}?sslmode=disable
      VERGE_PROBER_PATH: "/app/prober"
      # Must match web's. See the note on the web service.
      VERGE_STALE_JOB_TIMEOUT: ${VERGE_STALE_JOB_TIMEOUT:-}
    volumes:
      - worker-state:/app/state
      # Same shared transcript key as web mounts: the worker seals the Transcript
      # streams under it before writing them (raw-job-output spec §5.3).
      - transcript-key:/app/transcript-key
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    # tag postgres:16-bookworm pinned by manifest-list digest (#333)
    image: postgres:16-bookworm@sha256:60f4761b9035e0b8d5218f701a8c3382f641bf12b1604822574cf5be3baeb537
    <<: *security
    user: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-verge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verge} -d ${POSTGRES_DB:-verge}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  web-state:
  worker-state:
  # One instance key, mounted by both web and worker, seals the Transcript corpus
  # at rest. Kept off Postgres and out of backups so no ciphertext leaves without
  # its key and no restore inherits data it cannot decrypt (spec §5.3).
  transcript-key:
