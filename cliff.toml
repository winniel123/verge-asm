# git-cliff configuration for verge-asm.
#
# One config, two readers (SPEC docs/spec/release-pipeline.md §10.1):
#
#   * Release-prep regenerates the whole file:
#         git cliff -o CHANGELOG.md --tag vX.Y.Z
#   * `release.yml` builds the GitHub Release body from the same config:
#         git cliff --latest --strip all
#     `--strip all` is required. Without it the `header` below is prepended to
#     every Release body. Nothing parses `CHANGELOG.md`; the generator is
#     deterministic over this file, so the body equals the file's newest section.
#
# `CHANGELOG.md` is generated output, not a hand-written file (§10.3). It is
# refreshed only at release-prep, so between releases it lags `main`. There is
# no hand-written `[Unreleased]` section and no gate on one.
# `docs/spec/doc-lint-tool.md` §1.3 excludes `CHANGELOG` from doclint.
#
# ---------------------------------------------------------------------------
# The section heading form
# ---------------------------------------------------------------------------
#
# The `body` template below emits exactly one heading per release, in this form:
#
#     ## [v0.1.0] - 2026-09-06
#
# That is `## [` + the tag verbatim + `] - ` + the tag's commit date as
# `YYYY-MM-DD`. The `v` is kept, so the bracketed token equals the pushed tag
# with no transformation. A run with no tag in range (`--unreleased`) emits
# `## [Unreleased]` instead.
#
# This form is load-bearing. `release.yml` guard 2 (§4.3) compares
# `CHANGELOG.md`'s newest section heading against the pushed tag: the first
# `^## ` line in the file is that heading, because the `header` below contains
# no `##` line. Changing the heading form breaks guard 2.
#
# ---------------------------------------------------------------------------
# The version bump rule, in prose
# ---------------------------------------------------------------------------
#
# `git cliff --bumped-version` names the next version. The human does not guess
# (§10.5). The `[bump]` settings below implement one rule, stated here so a
# reader can predict the answer without running the tool:
#
#     Any `feat` or any `!` in the range bumps the MINOR.
#     Everything else bumps the PATCH.
#
# So on `v0.1.0`: a range holding a `feat` gives `v0.2.0`; a range holding only
# `fix`, `docs`, `chore`, `ci` or `security` gives `v0.1.1`. A breaking change
# gives `v0.2.0`, never `v1.0.0`, because the project is alpha on `0.y.z` and a
# minor bump is allowed to carry a break (README alpha notice, §1.3). The `!`
# marker has been used once in the repository's history.

[changelog]
header = """
# Changelog

All notable changes to verge-asm are recorded here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
This file is generated by `git cliff` from the commit history at release-prep, so
it lags `main` between releases.

> **Pre-1.0.** verge-asm is alpha software on `0.y.z`. A minor bump may include a
> breaking change. See the alpha notice in [`README.md`](README.md).

"""
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
# Each template line is trimmed, so the indentation above is readability only.
trim = true

[git]
conventional_commits = true
# Drops the ~250 pre-standard merge subjects ("Merge ticket/... into main") that
# predate Conventional Commits. They carry no type and so no group.
filter_unconventional = true
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# Order matters: the first matching parser wins. The `<!-- N -->` prefixes only
# sort the groups; `striptags` in the body template removes them from the output.
#
# Three non-standard types exist in the history (§10.1). Conventional Commit
# conformance is 189 of the last 200 commits, and the stragglers are `security`,
# `land` and `file`:
#
#   * `security` is a real change class and earns its own Security group.
#   * `land` and `file` are pre-standard noise from the retired design-system
#     handoff workflow (ADR-0145) and are skipped.
commit_parsers = [
  { message = "^land", skip = true },
  { message = "^file", skip = true },
  { message = "^security", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactor" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^(build|deps)", group = "<!-- 7 -->Build and dependencies" },
  { message = "^(?i)ci", group = "<!-- 8 -->CI" },
  { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
  # A conventional commit whose type is none of the above is still recorded, so
  # a new type cannot vanish from the changelog unnoticed.
  { message = ".*", group = "<!-- 9 -->Miscellaneous" },
]

[bump]
# feat -> minor. See the prose rule at the top of this file.
features_always_bump_minor = true
# `!` -> minor, not major. The project is alpha on `0.y.z`.
breaking_always_bump_major = false
# `--bumped-version` returns this when no tag exists yet.
initial_tag = "v0.1.0"
