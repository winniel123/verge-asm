# gitleaks config — verge-asm.
#
# Extends gitleaks' default ruleset (unchanged behaviour) and adds ONE narrow,
# value-scoped allowlist for the design-owned deterministic TOTP-enrolment
# fixture secret. This value exists only so the SignIn `enroll` parity golden is
# byte-stable; the real enrolment path mints secrets via crypto/rand and is
# untouched (design-system/verify/WORK-ORDER-4-6-BATCH1.md; SPEC-CHANGE #19b).
#
# Scoped to the exact literal, not to a file or path, so any OTHER secret — even
# in design-system/fixtures/fixtures.json or cmd/web/devfixtures.go — still trips
# the scan. This preserves the fingerprint-exact posture set in the 2026-08-23
# security audit (map #320, see .gitleaksignore) while being robust to the
# squash-merge SHA change that a fingerprint entry would not survive on `main`.
title = "verge-asm"

[extend]
useDefault = true

[allowlist]
description = "Value-scoped false-positive allowlist. Each entry is an exact fixture literal, not a path — any OTHER secret still trips. (1) The design-owned deterministic TOTP-enrol fixture secret (SignIn `enroll` parity golden stability; real enrolment mints via crypto/rand — SPEC-CHANGE #19b). (2) The batch-4 AssetDetail fixture subject key `edge-gw-03.acmecorp.io` and its endpoint/copy-key forms — a domain identifier gitleaks' generic-api-key rule flags on the `key = \"...\"` keyword+entropy heuristic (design-system/fixtures/fixtures.json + cmd/web/devfixtures.go; batch 4, map #579). Neither is a live credential; both are value-scoped so they survive squash-merge where a commit-fingerprint entry would not."
regexes = ['''VG7K-2Q9X-8MRD-P3TL''', '''edge-gw-03\.acmecorp\.io''']
